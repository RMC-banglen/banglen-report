<script>
// iOS เก็บหน้าเว็บไว้ใน cache พอขึ้นโค้ดใหม่เครื่องเดิมจะยังเปิดของเก่า
// จึงโหลดแค่ 2KB แรกของไฟล์ตัวเองมาเทียบเลขเวอร์ชัน ถ้าไม่ตรงก็โหลดใหม่ให้เอง
var APP_VERSION='2026-09-22c';
(function(){
  var check=function(){
    fetch(location.pathname+'?_ck='+Date.now(),{cache:'no-store',headers:{Range:'bytes=0-2047'}})
      .then(function(r){return r.text();})
      .then(function(t){
        var m=t.match(/APP_VERSION='([^']+)'/);
        if(m&&m[1]!==APP_VERSION) location.replace(location.pathname+'?v='+m[1]);
      }).catch(function(){});
  };
  check();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
})();
</script>

const ALERT_URL='https://script.google.com/macros/s/AKfycbzyu-ZNgAu9Rxof-PP-JVG6wmKfw1nSnbr75novSi3VbThXxwBfUvZjKrs1OuuW3617/exec';

// ---- ทราย ----
const FM_SIEVES=[
  {key:'w9_5', label:'3/8″',      sub:'9.5 mm'},
  {key:'w4_75',label:'เบอร์ 4',   sub:'4.75 mm'},
  {key:'w2_36',label:'เบอร์ 8',   sub:'2.36 mm'},
  {key:'w1_18',label:'เบอร์ 16',  sub:'1.18 mm'},
  {key:'w0_60',label:'เบอร์ 30',  sub:'0.60 mm'},
  {key:'w0_30',label:'เบอร์ 50',  sub:'0.30 mm'},
  {key:'w0_15',label:'เบอร์ 100', sub:'0.15 mm'},
];
const FM_MIN=2.3,FM_MAX=3.1;
function calcFM(w){
  const wts=FM_SIEVES.map(s=>Number(w[s.key])||0);
  const pan=Number(w.w_pan)||0;
  const total=wts.reduce((a,b)=>a+b,0)+pan;
  if(!total)return{total:0,fm:null,rows:[]};
  let cum=0;
  const rows=FM_SIEVES.map((s,i)=>{const ret=wts[i]/total*100;cum+=ret;return{...s,cum};});
  return{total,fm:rows.reduce((a,r)=>a+r.cum,0)/100,rows};
}

// ---- หิน ----
const STONE_SIZES=['3/4″','1″'];
const STONE_SIEVES_ALL=[
  {key:'w37_5',label:'1-1/2″',sub:'37.5 mm'},
  {key:'w25_0',label:'1″',    sub:'25.0 mm'},
  {key:'w19_0',label:'3/4″',  sub:'19.0 mm'},
  {key:'w12_5',label:'1/2″',  sub:'12.5 mm'},
  {key:'w9_5', label:'3/8″',  sub:'9.5 mm'},
  {key:'w4_75',label:'เบอร์ 4',sub:'4.75 mm'},
  {key:'w2_36',label:'เบอร์ 8',sub:'2.36 mm'},
];
const STONE_LIMITS={
  '3/4″':{w25_0:[100,100],w19_0:[90,100],w9_5:[20,55],w4_75:[0,10],w2_36:[0,5]},
  '1″':  {w37_5:[100,100],w25_0:[95,100],w12_5:[25,60],w4_75:[0,10],w2_36:[0,5]},
};
function calcStone(size,w){
  const limits=STONE_LIMITS[size]||STONE_LIMITS['3/4″'];
  const active=STONE_SIEVES_ALL.filter(s=>limits[s.key]);
  const wts=active.map(s=>Number(w[s.key])||0);
  const pan=Number(w.w_pan)||0;
  const total=wts.reduce((a,b)=>a+b,0)+pan;
  if(!total)return{total:0,rows:[]};
  let cum=0;
  const rows=active.map((s,i)=>{
    const[lo,hi]=limits[s.key];
    const ret=wts[i]/total*100;cum+=ret;
    const pass=100-cum;
    return{...s,lo,hi,pass};
  });
  return{total,rows};
}

// ---- Sand Form ----
function SandForm(){
  const blank={test_date:todayISO(),sand_source:'',w9_5:'',w4_75:'',w2_36:'',w1_18:'',w0_60:'',w0_30:'',w0_15:'',w_pan:'',note:''};
  const[f,setF]=useState(blank);
  const[saving,setSaving]=useState(false);
  const[done,setDone]=useState(false);
  const[err,setErr]=useState('');
  const live=calcFM(f);
  const fm=live.fm;
  const fmClass=fm==null?'null':fm>=FM_MIN&&fm<=FM_MAX?'ok':'bad';
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

  const save=async()=>{
    if(!f.test_date){setErr('กรุณาเลือกวันที่ทดสอบ');return;}
    if(!live.total){setErr('กรุณาใส่น้ำหนักค้างตะแกรงอย่างน้อย 1 ช่อง');return;}
    setErr('');setSaving(true);
    const rec={test_date:f.test_date,sand_source:f.sand_source||'',note:f.note||'',
      fm:fm!=null?Math.round(fm*100)/100:null};
    FM_SIEVES.forEach(s=>{rec[s.key]=Number(f[s.key])||0;});
    rec.w_pan=Number(f.w_pan)||0;
    const{error}=await SB.from('sand_fm_tests').insert([rec]);
    setSaving(false);
    if(error){setErr('บันทึกไม่สำเร็จ: '+error.message);return;}
    if(fm!=null&&(fm<FM_MIN||fm>FM_MAX))
      alertFail({test:'sand_fm',fm:fm.toFixed(2),lo:FM_MIN,hi:FM_MAX,test_date:f.test_date,source:f.sand_source});
    setDone(true);
  };

  if(done)return(
    <div className="card success">
      <div className="icon">✅</div>
      <h2>บันทึกแล้ว!</h2>
      <p>ผลทดสอบขนาดคละทราย<br/>วันที่ {f.test_date.split('-').reverse().join('/')}<br/>
      {fm!=null&&<>FM = <b>{fm.toFixed(2)}</b> {fm>=FM_MIN&&fm<=FM_MAX?'(ผ่าน)':'(ไม่ผ่าน)'}</>}</p>
      <button className="bigbtn green" onClick={()=>{setF(blank);setDone(false);}}>+ บันทึกรายการใหม่</button>
    </div>
  );

  return(
    <div>
      <div className="card">
        <div className="field">
          <label>วันที่ทดสอบ</label>
          <input type="date" value={f.test_date} onChange={e=>set('test_date',e.target.value)}/>
        </div>
        <div className="field">
          <label>แหล่งทราย (ถ้ามี)</label>
          <input type="text" value={f.sand_source} onChange={e=>set('sand_source',e.target.value)} placeholder="เช่น บ่อหนองแค, แม่น้ำ..."/>
        </div>
      </div>

      <div className="card">
        <div style={{fontSize:15,fontWeight:700,color:'#42465a',marginBottom:14}}>น้ำหนักค้างตะแกรง (กรัม)</div>
        <div className="sieve-grid">
          {FM_SIEVES.map(s=>(
            <div className="sieve-item" key={s.key}>
              <label>{s.label} <span className="sub">{s.sub}</span></label>
              <input type="number" inputMode="decimal" min="0" value={f[s.key]} onChange={e=>set(s.key,e.target.value)} placeholder="0"/>
            </div>
          ))}
          <div className="sieve-item">
            <label>ถาดล่าง <span className="sub">Pan</span></label>
            <input type="number" inputMode="decimal" min="0" value={f.w_pan} onChange={e=>set('w_pan',e.target.value)} placeholder="0"/>
          </div>
        </div>

        <div className={`fm-card ${fmClass}`}>
          <div>
            <div className="fm-label" style={{color:fmClass==='ok'?'#059669':fmClass==='bad'?'#d13438':'#5f6470'}}>
              ค่า FM (Fineness Modulus)
            </div>
            <div className="fm-note" style={{color:fmClass==='ok'?'#059669':fmClass==='bad'?'#d13438':'#8b91a1'}}>
              {fm==null?'ใส่น้ำหนักเพื่อคำนวณ':fm>=FM_MIN&&fm<=FM_MAX?`✓ อยู่ในเกณฑ์ ${FM_MIN}–${FM_MAX}`:fm<FM_MIN?`✗ ทรายละเอียดเกินไป (เกณฑ์ ${FM_MIN}–${FM_MAX})`:`✗ ทรายหยาบเกินไป (เกณฑ์ ${FM_MIN}–${FM_MAX})`}
            </div>
          </div>
          <div className="fm-val" style={{color:fmClass==='ok'?'#059669':fmClass==='bad'?'#d13438':'#c0c4ce'}}>
            {fm!=null?fm.toFixed(2):'–'}
          </div>
        </div>
      </div>

      <div className="card">
        <div className="field">
          <label>หมายเหตุ (ถ้ามี)</label>
          <textarea rows={2} value={f.note} onChange={e=>set('note',e.target.value)} placeholder="..." style={{resize:'none'}}/>
        </div>
        {err&&<div className="err">{err}</div>}
        <button className="bigbtn" disabled={saving} onClick={save}>
          {saving?'กำลังบันทึก…':'บันทึกผลทดสอบทราย'}
        </button>
      </div>
    </div>
  );
}

// สารอินทรีย์ในทราย (ASTM C40) — แช่ทรายใน NaOH 3% 24 ชม. แล้วดูสีน้ำ
// อ่านสีจากรูป แต่แสงกับกล้องทำให้สีเพี้ยนได้ จึงให้แตะกระดาษขาวในรูปเป็นตัวอ้างอิง
// แล้วปรับสมดุลขาวก่อนคิดค่า ค่าที่ได้จึงเทียบข้ามวันกันได้
function OrganicForm(){
  const blank={test_date:todayISO(),sand_source:'',note:''};
  const[f,setF]=useState(blank);
  const[img,setImg]=useState(null);       // dataURL สำหรับวาดลงแคนวาส
  const[blob,setBlob]=useState(null);     // ไฟล์ที่บีบแล้ว ไว้อัปโหลด
  const[white,setWhite]=useState(null);   // สีกระดาษขาวอ้างอิง
  const[sol,setSol]=useState(null);       // สีน้ำในขวด
  const[pick,setPick]=useState('white');  // กำลังจะแตะอะไร
  const[warn,setWarn]=useState(35);
  const[saving,setSaving]=useState(false);
  const[done,setDone]=useState(false);
  const[err,setErr]=useState('');
  const cv=useRef(null);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

  useEffect(()=>{
    SB.from('sand_silt_spec').select('organic_warn_index').eq('id',1).limit(1)
      .then(({data})=>{if(data&&data.length&&data[0].organic_warn_index!=null)setWarn(Number(data[0].organic_warn_index));});
  },[]);

  // รูปนี้ใช้ดูสีอย่างเดียว ไม่ต้องละเอียด ย่อ 480px คุณภาพ 0.6 → ราว 30 KB
  const onPick=e=>{
    const file=e.target.files&&e.target.files[0]; if(!file)return;
    const im=new Image(), u=URL.createObjectURL(file);
    im.onload=()=>{
      URL.revokeObjectURL(u);
      const MAX=480, s=Math.min(1,MAX/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=>setBlob(b),'image/jpeg',0.6);
      setImg(c.toDataURL('image/jpeg',0.6));
      setWhite(null);setSol(null);setPick('white');setErr('');
    };
    im.src=u;
  };

  useEffect(()=>{
    if(!img||!cv.current)return;
    const im=new Image();
    im.onload=()=>{const c=cv.current;c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);};
    im.src=img;
  },[img]);

  // เฉลี่ยสีรอบจุดที่แตะ 9x9 กันจุดเดียวที่บังเอิญสว่าง/มืดผิดปกติ
  const sample=e=>{
    const c=cv.current; if(!c)return;
    const r=c.getBoundingClientRect();
    const t=e.touches&&e.touches[0]?e.touches[0]:e;
    const x=Math.round((t.clientX-r.left)/r.width*c.width);
    const y=Math.round((t.clientY-r.top)/r.height*c.height);
    const g=c.getContext('2d');
    let R=0,G=0,B=0,n=0;
    for(let dx=-4;dx<=4;dx++)for(let dy=-4;dy<=4;dy++){
      const px=x+dx,py=y+dy;
      if(px<0||py<0||px>=c.width||py>=c.height)continue;
      const d=g.getImageData(px,py,1,1).data;
      R+=d[0];G+=d[1];B+=d[2];n++;
    }
    if(!n)return;
    const col={r:Math.round(R/n),g:Math.round(G/n),b:Math.round(B/n)};
    if(pick==='white'){setWhite(col);setPick('sol');}else setSol(col);
  };

  // ปรับสมดุลขาว: หารด้วยสีกระดาษขาว แล้วสเกลกลับเป็น 0-255
  const norm=(()=>{
    if(!white||!sol)return null;
    const k=v=>Math.max(1,v);
    const r=Math.min(255,Math.round(sol.r/k(white.r)*255));
    const g=Math.min(255,Math.round(sol.g/k(white.g)*255));
    const b=Math.min(255,Math.round(sol.b/k(white.b)*255));
    // น้ำใส r≈b → ดัชนีใกล้ 0 · เหลือง/น้ำตาลเข้ม b ต่ำกว่า r มาก → ดัชนีสูง
    const idx=Math.max(0,Math.min(100,Math.round((1-b/Math.max(1,r))*1000)/10));
    return {r,g,b,idx};
  })();
  const over=norm&&norm.idx>warn;

  const save=async()=>{
    if(!f.test_date){setErr('กรุณาเลือกวันที่ทดสอบ');return;}
    if(!norm){setErr('กรุณาแตะกระดาษขาวและน้ำในขวดให้ครบ');return;}
    setErr('');setSaving(true);
    let url=null;
    try{
      if(blob){
        const path='organic/'+f.test_date+'_'+Date.now()+'.jpg';
        const {error:upErr}=await SB.storage.from('quality-images')
          .upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
        if(!upErr) url=SB.storage.from('quality-images').getPublicUrl(path).data.publicUrl;
      }
    }catch(e){}
    const{error}=await SB.from('sand_organic_tests').insert([{
      test_date:f.test_date,sand_source:f.sand_source||'',
      color_r:norm.r,color_g:norm.g,color_b:norm.b,color_index:norm.idx,
      image_url:url,note:f.note||''}]);
    setSaving(false);
    if(error){setErr('บันทึกไม่สำเร็จ: '+error.message);return;}
    setDone(true);
  };

  if(done)return(
    <div className="card success">
      <div className="icon">{over?'⚠️':'✅'}</div>

// ตั้งเกณฑ์จากแผ่นเทียบสี Gardner ของโรงงานเอง
// ทำครั้งเดียวพอ — ถ่ายแผ่นคู่กับกระดาษขาว แตะช่อง No.3 แล้วเก็บดัชนีไว้เป็นเกณฑ์
// ได้แบบนี้เกณฑ์จะตรงมาตรฐานจริง ไม่ใช่เลขที่เดาไว้
function OrganicCalib({warn,onSaved}){
  const[open,setOpen]=useState(false);
  const[img,setImg]=useState(null);
  const[white,setWhite]=useState(null);
  const[glass,setGlass]=useState(null);
  const[pick,setPick]=useState('white');
  const[saving,setSaving]=useState(false);
  const[msg,setMsg]=useState('');
  const cv=useRef(null);

  const onPick=e=>{
    const file=e.target.files&&e.target.files[0]; if(!file)return;
    const im=new Image(), u=URL.createObjectURL(file);
    im.onload=()=>{
      URL.revokeObjectURL(u);
      const MAX=640, s=Math.min(1,MAX/Math.max(im.width,im.height));
      const c=document.createElement('canvas');
      c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      setImg(c.toDataURL('image/jpeg',0.7));
      setWhite(null);setGlass(null);setPick('white');setMsg('');
    };
    im.src=u;
  };

  useEffect(()=>{
    if(!img||!cv.current)return;
    const im=new Image();
    im.onload=()=>{const c=cv.current;c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);};
    im.src=img;
  },[img]);

  const sample=e=>{
    const c=cv.current; if(!c)return;
    const r=c.getBoundingClientRect();
    const t=e.touches&&e.touches[0]?e.touches[0]:e;
    const x=Math.round((t.clientX-r.left)/r.width*c.width);
    const y=Math.round((t.clientY-r.top)/r.height*c.height);
    const g=c.getContext('2d');
    let R=0,G=0,B=0,n=0;
    for(let dx=-4;dx<=4;dx++)for(let dy=-4;dy<=4;dy++){
      const px=x+dx,py=y+dy;
      if(px<0||py<0||px>=c.width||py>=c.height)continue;
      const d=g.getImageData(px,py,1,1).data;
      R+=d[0];G+=d[1];B+=d[2];n++;
    }
    if(!n)return;
    const col={r:Math.round(R/n),g:Math.round(G/n),b:Math.round(B/n)};
    if(pick==='white'){setWhite(col);setPick('glass');}else setGlass(col);
  };

  // คิดดัชนีด้วยสูตรเดียวกับตอนอ่านน้ำในขวด เกณฑ์กับผลจึงเทียบกันได้ตรง
  const idx=(()=>{
    if(!white||!glass)return null;
    const k=v=>Math.max(1,v);
    const r=Math.min(255,Math.round(glass.r/k(white.r)*255));
    const b=Math.min(255,Math.round(glass.b/k(white.b)*255));
    return Math.max(0,Math.min(100,Math.round((1-b/Math.max(1,r))*1000)/10));
  })();

  const save=async()=>{
    if(idx==null)return;
    setSaving(true);setMsg('');
    const{error}=await SB.from('sand_silt_spec').update({organic_warn_index:idx}).eq('id',1);
    setSaving(false);
    if(error){setMsg('บันทึกไม่สำเร็จ: '+error.message);return;}
    onSaved(idx);
    setMsg('ตั้งเกณฑ์เป็น '+idx+' แล้ว — ตรงตาม ASTM C40 (Plate No. 3)');
  };

  const sw=c=>({display:'inline-block',width:26,height:26,borderRadius:6,verticalAlign:'middle',
    border:'1.5px solid #d6d8e0',background:c?`rgb(${c.r},${c.g},${c.b})`:'#fff'});

  return(
    <div className="card">
      <button className="ghost" style={{marginTop:0}} onClick={()=>setOpen(!open)}>
        {open?'▲ ปิด':'⚙️ ตั้งเกณฑ์จากแผ่นเทียบสีมาตรฐาน'}
      </button>
      {open&&<div style={{marginTop:14}}>
        <div style={{fontSize:13,color:'#5f6470',lineHeight:1.8,marginBottom:12}}>
          ถ้ามีแผ่นเทียบสี Gardner (ASTM C40) ให้ถ่ายรูปแผ่น <b>พร้อมกระดาษขาวในเฟรมเดียวกัน</b>
          แล้วแตะที่ช่องสี <b>No. 3</b> ซึ่งเป็นเกณฑ์ตัดสินตามมาตรฐาน
          ระบบจะอ่านค่าไปตั้งเป็นเกณฑ์เตือนให้ ทำครั้งเดียวพอ<br/>
          <span style={{color:'#8b91a1'}}>ต้องเป็นแผ่นจริงของโรงงานที่ถ่ายเอง ใช้รูปจากอินเทอร์เน็ตไม่ได้ เพราะสีเพี้ยนไปแล้ว</span>
        </div>
        <input type="file" accept="image/*" capture="environment" onChange={onPick}
          style={{width:'100%',padding:12,border:'1.5px dashed #94afd4',borderRadius:10,background:'#f7faff'}}/>
        {img&&<>
          <div style={{fontSize:13.5,fontWeight:700,color:pick==='white'?'#1a56db':'#42465a',margin:'14px 0 6px'}}>
            {pick==='white'?'① แตะที่กระดาษขาว':'② แตะที่ช่องสี No. 3'}
          </div>
          <canvas ref={cv} onClick={sample}
            style={{width:'100%',borderRadius:10,border:'1.5px solid #d6d8e0',cursor:'crosshair',display:'block'}}/>
          <div style={{display:'flex',gap:16,alignItems:'center',marginTop:10,fontSize:13.5,flexWrap:'wrap'}}>
            <span><span style={sw(white)}/> กระดาษขาว</span>
            <span><span style={sw(glass)}/> ช่อง No. 3</span>
            <button className="ghost" style={{width:'auto',padding:'6px 14px',marginTop:0,fontSize:13}}
              onClick={()=>{setWhite(null);setGlass(null);setPick('white');}}>เลือกใหม่</button>
          </div>
        </>}
        {idx!=null&&<div style={{marginTop:14,padding:'14px 16px',borderRadius:12,textAlign:'center',
          background:'#f7faff',border:'1.5px solid #cbd9f0'}}>
          <div style={{fontSize:13,color:'#5f6470'}}>ดัชนีของช่อง No. 3 (เกณฑ์ใหม่)</div>
          <div style={{fontSize:30,fontWeight:800,color:'#1a56db'}}>{idx}</div>
          <div style={{fontSize:12,color:'#8b91a1',marginTop:4}}>เกณฑ์ที่ใช้อยู่ตอนนี้ {warn}</div>
          <button className="bigbtn" style={{marginTop:12}} disabled={saving} onClick={save}>
            {saving?'กำลังบันทึก…':'ใช้ค่านี้เป็นเกณฑ์'}
          </button>
        </div>}
        {msg&&<div style={{marginTop:10,fontSize:13.5,fontWeight:700,
          color:/ไม่สำเร็จ/.test(msg)?'#d13438':'#0f766e'}}>{msg}</div>}
      </div>}
    </div>
  );
}

// ---- Stone Form ----
// ฝุ่นในทราย 2 วิธี — เขย่าขวดวัดปริมาตร, ล้างตะแกรงเบอร์ 200 ชั่งน้ำหนัก
// คนละหน่วยกัน เกณฑ์จึงแยกคนละค่า
function SiltForm(){
  const blank={test_date:todayISO(),sand_source:'',method:'bottle',
    sand_mm:'',silt_mm:'',w_before:'',w_after:'',note:''};
  const[f,setF]=useState(blank);
  const[saving,setSaving]=useState(false);
  const[done,setDone]=useState(false);
  const[err,setErr]=useState('');
  const[spec,setSpec]=useState({bottle:6,wash:3});
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const isWash=f.method==='wash';
  const maxPct=isWash?spec.wash:spec.bottle;

  useEffect(()=>{
    SB.from('sand_silt_spec').select('max_pct_bottle,max_pct_wash').eq('id',1).limit(1)
      .then(({data})=>{if(data&&data.length)setSpec({
        bottle:Number(data[0].max_pct_bottle),wash:Number(data[0].max_pct_wash)});});
  },[]);

  const sand=Number(f.sand_mm)||0, silt=Number(f.silt_mm)||0;
  const wb=Number(f.w_before)||0, wa=Number(f.w_after)||0;
  const pct=isWash
    ? (wb>0&&wa>0&&wa<=wb ? Math.round((wb-wa)/wb*1000)/10 : null)
    : ((sand+silt)>0 ? Math.round(silt/(sand+silt)*1000)/10 : null);
  const ok=pct!=null&&pct<=maxPct;

  const save=async()=>{
    if(!f.test_date){setErr('กรุณาเลือกวันที่ทดสอบ');return;}
    if(isWash){
      if(!wb||!wa){setErr('กรุณาใส่น้ำหนักก่อนและหลังล้าง');return;}
      if(wa>wb){setErr('น้ำหนักหลังล้างต้องไม่มากกว่าก่อนล้าง');return;}
    }else if(!sand){setErr('กรุณาใส่ความสูงชั้นทราย');return;}
    setErr('');setSaving(true);
    const{error}=await SB.from('sand_silt_tests').insert([{
      test_date:f.test_date,sand_source:f.sand_source||'',method:f.method,
      sand_mm:isWash?null:sand,silt_mm:isWash?null:silt,
      w_before:isWash?wb:null,w_after:isWash?wa:null,
      silt_pct:pct,note:f.note||''}]);
    setSaving(false);
    if(error){setErr('บันทึกไม่สำเร็จ: '+error.message);return;}
    if(!ok) alertFail({test:'sand_silt',method:f.method,pct:pct,max_pct:maxPct,
      sand_mm:isWash?'':sand,silt_mm:isWash?'':silt,
      w_before:isWash?wb:'',w_after:isWash?wa:'',
      test_date:f.test_date,source:f.sand_source});
    setDone(true);
  };

  if(done)return(
    <div className="card success">
      <div className="icon">{ok?'✅':'⚠️'}</div>
      <h2>บันทึกแล้ว!</h2>
      <p>ฝุ่นในทราย · {isWash?'ล้างตะแกรง #200':'เขย่าขวด'}<br/>
      วันที่ {f.test_date.split('-').reverse().join('/')}<br/>
      ฝุ่น = <b>{pct}%</b> {ok?'(ผ่าน)':`(เกินเกณฑ์ ${maxPct}%)`}</p>
      <button className="bigbtn green" onClick={()=>{setF(blank);setDone(false);}}>+ บันทึกรายการใหม่</button>
    </div>
  );

  return(
    <div>
      <div className="card">
        <div className="field">
          <label>วันที่ทดสอบ</label>
          <input type="date" value={f.test_date} onChange={e=>set('test_date',e.target.value)}/>
        </div>
        <div className="field">
          <label>แหล่งทราย (ถ้ามี)</label>
          <input type="text" value={f.sand_source} onChange={e=>set('sand_source',e.target.value)} placeholder="เช่น วันวิสาข์"/>
        </div>
      </div>

      <div className="card">
        <div style={{fontSize:15,fontWeight:700,color:'#42465a',marginBottom:10}}>วิธีทดสอบ</div>
        <div className="stone-tabs">
          <button className={`stone-tab${!isWash?' active':''}`} onClick={()=>set('method','bottle')}>เขย่าขวด</button>
          <button className={`stone-tab${isWash?' active':''}`} onClick={()=>set('method','wash')}>ล้างตะแกรง #200</button>
        </div>
        <div style={{fontSize:13,color:'#8b91a1',marginBottom:14,lineHeight:1.8}}>
          {isWash
            ? 'ชั่งทรายแห้ง → ล้างผ่านตะแกรงเบอร์ 200 จนน้ำใส → อบให้แห้งแล้วชั่งใหม่ (ASTM C117) — ได้ % โดยน้ำหนัก เทียบเกณฑ์ ASTM C33 ได้โดยตรง'
            : 'ใส่ทรายครึ่งขวด เติมน้ำ เขย่าแรงๆ แล้วตั้งทิ้งไว้ให้ตกตะกอน — ฝุ่นจะเป็นชั้นบางๆ อยู่เหนือชั้นทราย ได้ % โดยปริมาตร ซึ่งอ่านค่าได้สูงกว่าวิธีล้าง'}
        </div>

        {isWash ? <>
          <div className="field">
            <label>น้ำหนักทรายแห้ง ก่อนล้าง (g)</label>
            <input type="number" inputMode="decimal" value={f.w_before} onChange={e=>set('w_before',e.target.value)} placeholder="0"/>
          </div>
          <div className="field">
            <label>น้ำหนักทรายแห้ง หลังล้าง (g)</label>
            <input type="number" inputMode="decimal" value={f.w_after} onChange={e=>set('w_after',e.target.value)} placeholder="0"/>
          </div>
        </> : <>
          <div className="field">
            <label>ชั้นทราย (มม.)</label>
            <input type="number" inputMode="decimal" value={f.sand_mm} onChange={e=>set('sand_mm',e.target.value)} placeholder="0"/>
          </div>
          <div className="field">
            <label>ชั้นฝุ่นที่ทับอยู่ด้านบน (มม.)</label>
            <input type="number" inputMode="decimal" value={f.silt_mm} onChange={e=>set('silt_mm',e.target.value)} placeholder="0"/>
          </div>
        </>}

        {pct!=null&&(
          <div style={{marginTop:6,padding:'14px 16px',borderRadius:12,textAlign:'center',
            background:ok?'#ecfdf5':'#fdecea',border:`1.5px solid ${ok?'#a7e3d4':'#f3b8b0'}`}}>
            <div style={{fontSize:13,color:'#5f6470'}}>ปริมาณฝุ่น ({isWash?'โดยน้ำหนัก':'โดยปริมาตร'})</div>
            <div style={{fontSize:30,fontWeight:800,color:ok?'#0f766e':'#c0392b'}}>{pct}%</div>
            <div style={{fontSize:13,fontWeight:700,color:ok?'#0f766e':'#c0392b'}}>
              {ok?`✓ ผ่าน (เกณฑ์ไม่เกิน ${maxPct}%)`:`✗ เกินเกณฑ์ ${maxPct}%`}
            </div>
            <div style={{fontSize:11.5,color:'#8b91a1',marginTop:4,lineHeight:1.7}}>
              {isWash
                ? (maxPct===3?'ASTM C33 — คอนกรีตที่ต้องทนการขัดสี':maxPct===5?'ASTM C33 — คอนกรีตทั่วไป':'เกณฑ์ที่ตั้งเองในหน้าเว็บ')
                : 'เกณฑ์คัดกรองภาคสนาม ไม่ใช่ค่าตามมาตรฐาน'}
            </div>
            {!isWash&&!ok&&<div style={{fontSize:12,color:'#c47b00',marginTop:6,lineHeight:1.7}}>
              ควรยืนยันด้วยวิธีล้างตะแกรง #200 ก่อนตัดสินว่าทรายใช้ไม่ได้
            </div>}
          </div>
        )}
      </div>

      <div className="card">
        <div className="field" style={{marginBottom:0}}>
          <label>หมายเหตุ</label>
          <input type="text" value={f.note} onChange={e=>set('note',e.target.value)} placeholder="ถ้ามี"/>
        </div>
      </div>

      {err&&<div className="card" style={{color:'#d13438',fontWeight:600}}>{err}</div>}
      <button className="bigbtn blue" disabled={saving} onClick={save}>
        {saving?'กำลังบันทึก…':'บันทึกผลทดสอบ'}
      </button>
    </div>
  );
}

function StoneForm(){
  const blank={test_date:todayISO(),stone_size:'3/4″',stone_source:'',w37_5:'',w25_0:'',w19_0:'',w12_5:'',w9_5:'',w4_75:'',w2_36:'',w_pan:'',note:''};
  const[f,setF]=useState(blank);
  const[saving,setSaving]=useState(false);
  const[done,setDone]=useState(false);
  const[err,setErr]=useState('');
  const live=calcStone(f.stone_size,f);
  const activeKeys=Object.keys(STONE_LIMITS[f.stone_size]||STONE_LIMITS['3/4″']);
  const activeSieves=STONE_SIEVES_ALL.filter(s=>activeKeys.includes(s.key));
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const changeSize=s=>setF(p=>({...blank,test_date:p.test_date,stone_source:p.stone_source,stone_size:s}));

  const allPass=live.total>0&&live.rows.every(r=>r.pass>=r.lo-0.05&&r.pass<=r.hi+0.05);
  const hasBad=live.total>0&&live.rows.some(r=>r.pass<r.lo-0.05||r.pass>r.hi+0.05);

  const save=async()=>{
    if(!f.test_date){setErr('กรุณาเลือกวันที่ทดสอบ');return;}
    if(!live.total){setErr('กรุณาใส่น้ำหนักค้างตะแกรงอย่างน้อย 1 ช่อง');return;}
    setErr('');setSaving(true);
    const rec={test_date:f.test_date,stone_size:f.stone_size,stone_source:f.stone_source||'',note:f.note||''};
    STONE_SIEVES_ALL.forEach(s=>{rec[s.key]=Number(f[s.key])||0;});
    rec.w_pan=Number(f.w_pan)||0;
    const{error}=await SB.from('stone_gradation_tests').insert([rec]);
    setSaving(false);
    if(error){setErr('บันทึกไม่สำเร็จ: '+error.message);return;}
    const bad=live.rows.filter(r=>r.pass<r.lo-0.05||r.pass>r.hi+0.05);
    if(bad.length) alertFail({test:'stone',size:f.stone_size,
      detail:bad.map(r=>r.label).join(', '),test_date:f.test_date,source:f.stone_source});
    setDone(true);
  };

  if(done)return(
    <div className="card success">
      <div className="icon">✅</div>
      <h2>บันทึกแล้ว!</h2>
      <p>ผลทดสอบขนาดคละหิน {f.stone_size}<br/>วันที่ {f.test_date.split('-').reverse().join('/')}</p>
      <button className="bigbtn green" onClick={()=>{setF(blank);setDone(false);}}>+ บันทึกรายการใหม่</button>
    </div>
  );

  return(
    <div>
      <div className="card">
        <div className="field">
          <label>วันที่ทดสอบ</label>
          <input type="date" value={f.test_date} onChange={e=>set('test_date',e.target.value)}/>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:14,fontWeight:700,color:'#42465a',display:'block',marginBottom:8}}>ขนาดหิน</label>
          <div className="stone-tabs">
            {STONE_SIZES.map(s=>(
              <button key={s} className={`stone-tab${f.stone_size===s?' active':''}`} onClick={()=>changeSize(s)}>
                หิน {s}
              </button>
            ))}
          </div>
        </div>
        <div className="field">
          <label>แหล่งหิน (ถ้ามี)</label>
          <input type="text" value={f.stone_source} onChange={e=>set('stone_source',e.target.value)} placeholder="เช่น หินเขา, หินบดย่อย..."/>
        </div>
      </div>

      <div className="card">
        <div style={{fontSize:15,fontWeight:700,color:'#42465a',marginBottom:4}}>น้ำหนักค้างตะแกรง (กรัม)</div>
        <div style={{fontSize:12,color:'#8b91a1',marginBottom:14}}>หิน {f.stone_size} — ใส่เฉพาะตะแกรงที่ระบุตามเกณฑ์ ASTM C33</div>
        <div className="sieve-grid">
          {activeSieves.map(s=>(
            <div className="sieve-item" key={s.key}>
              <label>{s.label} <span className="sub">{s.sub}</span></label>
              <input type="number" inputMode="decimal" min="0" value={f[s.key]} onChange={e=>set(s.key,e.target.value)} placeholder="0"/>
            </div>
          ))}
          <div className="sieve-item">
            <label>ถาดล่าง <span className="sub">Pan</span></label>
            <input type="number" inputMode="decimal" min="0" value={f.w_pan} onChange={e=>set('w_pan',e.target.value)} placeholder="0"/>
          </div>
        </div>

        {live.total>0&&(
          <div style={{marginTop:4}}>
            <div style={{fontSize:14,fontWeight:700,color:'#42465a',marginBottom:8}}>ผลขนาดคละเทียบเกณฑ์ ASTM C33</div>
            {live.rows.map(r=>{
              const ok=r.pass>=r.lo-0.05&&r.pass<=r.hi+0.05;
              return(
                <div className="result-row" key={r.key}>
                  <span style={{fontWeight:600}}>{r.label} <span style={{fontWeight:400,color:'#8b91a1',fontSize:12}}>{r.sub}</span></span>
                  <span style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{color:'#42465a',fontSize:13}}>ผ่าน {r.pass.toFixed(1)}%</span>
                    <span className={`badge ${ok?'ok':'bad'}`}>{ok?'✓ ผ่าน':'✗ หลุด'}</span>
                  </span>
                </div>
              );
            })}
            <div style={{marginTop:10,padding:'10px 14px',borderRadius:10,
              background:allPass?'#f0fdf4':hasBad?'#fef2f2':'#f4f6fa',
              border:`1.5px solid ${allPass?'#86efac':hasBad?'#fca5a5':'#e6e8ee'}`,
              fontSize:14,fontWeight:700,
              color:allPass?'#059669':hasBad?'#d13438':'#5f6470'}}>
              {allPass?'✓ ผ่านเกณฑ์ทุกตะแกรง':hasBad?`✗ หลุดเกณฑ์ ${live.rows.filter(r=>r.pass<r.lo-0.05||r.pass>r.hi+0.05).map(r=>r.label).join(', ')}`:'-'}
            </div>
          </div>
        )}
      </div>

      <div className="card">
        <div className="field">
          <label>หมายเหตุ (ถ้ามี)</label>
          <textarea rows={2} value={f.note} onChange={e=>set('note',e.target.value)} placeholder="..." style={{resize:'none'}}/>
        </div>
        {err&&<div className="err">{err}</div>}
        <button className="bigbtn" disabled={saving} onClick={save}>
          {saving?'กำลังบันทึก…':f.stone_size==='3/4″'?'บันทึกผลทดสอบหิน 3/4″':'บันทึกผลทดสอบหิน 1″'}
        </button>
      </div>
    </div>
  );
}

// ---- App ----
function App(){
  const[tab,setTab]=useState('sand');
  return(
    <div className="wrap">
      <div className="topbar">
        <a href="qc.html" style={{color:'#fff',fontSize:22,textDecoration:'none',padding:'4px 8px 4px 0',lineHeight:1}}>‹</a>
        <div style={{flex:1}}>
          <h1>บันทึกผลทดสอบวัตถุดิบ</h1>
          <p>บางเลน — ขนาดคละ · ฝุ่น · สารอินทรีย์ · หิน</p>
        </div>
      </div>
      <div className="tabs" style={{fontSize:14}}>
        <button className={`tab${tab==='sand'?' active':''}`} onClick={()=>setTab('sand')} style={{fontSize:14,padding:'12px 4px'}}>🏖 FM</button>
        <button className={`tab${tab==='silt'?' active':''}`} onClick={()=>setTab('silt')} style={{fontSize:14,padding:'12px 4px'}}>💧 ฝุ่น</button>
        <button className={`tab${tab==='org'?' active':''}`} onClick={()=>setTab('org')} style={{fontSize:14,padding:'12px 4px'}}>🧪 สารอินทรีย์</button>
        <button className={`tab${tab==='stone'?' active':''}`} onClick={()=>setTab('stone')} style={{fontSize:14,padding:'12px 4px'}}>🪨 หิน</button>
      </div>
      {tab==='sand'?<SandForm/>:tab==='silt'?<SiltForm/>:tab==='org'?<OrganicForm/>:<StoneForm/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
