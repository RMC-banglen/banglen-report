// ใบงานผลิตรายวัน + สถานะการตรวจ — หน้าเดียวจบ ลงใบงานแล้วเห็นเลยว่าเหลือแพไหน
function PlanView({me,rafts,onBack,onInspect}){
  const [day,setDay]=useState(todayISO());
  const [plan,setPlan]=useState(null);        // เลขแพที่ลงใบงานไว้ของวันนั้น
  const [checked,setChecked]=useState([]);    // เลขแพที่ตรวจก่อนผลิตแล้วของวันนั้น
  const [editing,setEditing]=useState(false);
  const [sel,setSel]=useState([]);
  const [spec,setSpec]=useState({});   // ขนาดที่แก้เอง เฉพาะแพที่แก้ได้
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState('');
  const [missing,setMissing]=useState(false);

  const load=(d)=>{
    Promise.all([
      DB.from('qc_production_day').select('raft_num,pile_spec').eq('d',d).order('raft_num'),
      DB.from('qc_checks').select('bed_no').eq('form_type','pre').eq('check_date',d),
    ]).then(([p,c])=>{
      if(p.error){setMissing(true);return;}
      setMissing(false);
      setPlan(p.data||[]);
      setChecked([...new Set((c.data||[]).map(x=>String(x.bed_no)).filter(Boolean))]);
    }).catch(()=>setMissing(true));
  };
  useEffect(()=>{setPlan(null);load(day);},[day]);

  const isDone=n=>checked.includes(String(n));
  const openEdit=()=>{
    const sp={};
    (plan||[]).forEach(p=>{sp[p.raft_num]=p.pile_spec||raftLabel(rafts.find(r=>Number(r.raft_num)===Number(p.raft_num)));});
    setSel((plan||[]).map(p=>p.raft_num)); setSpec(sp); setEditing(true); setMsg('');
  };
  // แพ S เปลี่ยนได้เฉพาะขนาด S · แพที่ 4 เปลี่ยนได้ทุกแบบ · แพอื่นล็อกตามระบบแพผลิต
  const FREE_RAFT=4;
  // แยก มอก. (มาตรฐาน) กับ รง. (โรงงาน) ให้เลือกถูกตอนลงใบงาน — ค่าระยะยืดไม่ต้องแยก ใช้ร่วมกัน
  const S_SIZES=['S18มอก.','S18รง.','S22มอก.','S22รง.','S26มอก.','S26รง.','S30มอก.','S30รง.','S35มอก.','S35รง.','S40มอก.','S40รง.'];
  const ALL_SIZES=['I18','I22','I26','I30','I35','I40'].concat(S_SIZES).concat(['เลนเดี่ยว']);
  const sizeOptsFor=n=>{
    const r=rafts.find(x=>Number(x.raft_num)===Number(n));
    const cur=raftLabel(r);
    const base=Number(n)===FREE_RAFT?ALL_SIZES:(String((r&&r.pile_type)||'').toUpperCase()==='S'?S_SIZES:null);
    if(!base) return null;                       // null = แก้ไม่ได้
    return [...new Set([cur,...base].filter(Boolean))];
  };

  const copyPrev=async()=>{
    const d=new Date(day+'T00:00:00'); d.setDate(d.getDate()-1);
    const prev=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const {data}=await DB.from('qc_production_day').select('raft_num').eq('d',prev);
    if(!data||!data.length){setMsg('เมื่อวานไม่มีใบงาน');return;}
    setSel(data.map(r=>r.raft_num));setMsg('ดึงจากเมื่อวานแล้ว '+data.length+' แพ — กดบันทึกเพื่อยืนยัน');
  };

  const save=async()=>{
    setSaving(true);setMsg('');
    try{
      await DB.from('qc_production_day').delete().eq('d',day);
      if(sel.length){
        const rows=sel.map(n=>{
          const r=rafts.find(x=>Number(x.raft_num)===Number(n));
          return {d:day,raft_num:Number(n),pile_spec:(spec[n]||raftLabel(r)||'').trim(),created_by:me.code};
        });
        const {error}=await DB.from('qc_production_day').insert(rows);
        if(error) throw error;
      }
      setEditing(false);setMsg('✅ บันทึกใบงานแล้ว');load(day);
      setTimeout(()=>setMsg(''),3500);
    }catch(e){setMsg('❌ '+(e.message||e));}
    finally{setSaving(false);}
  };

  const done=(plan||[]).filter(p=>isDone(p.raft_num)).length;
  const total=(plan||[]).length;

  return <>
    <div className="topbar">
      <button onClick={onBack} style={{background:'rgba(255,255,255,.2)',border:'none',color:'#fff',
        borderRadius:10,padding:'7px 11px',fontSize:16,cursor:'pointer'}}>←</button>
      <div><div className="who">ใบงานผลิต</div><div className="sub">{me.name} · {thaiDate(day)}</div></div>
    </div>

    <div className="wrap">
      {missing&&<div className="card" style={{marginTop:14,color:'#92400e',background:'#fffbeb',borderColor:'#fde68a',lineHeight:1.9}}>
        ⚠️ ยังไม่ได้สร้างตารางใบงานผลิต — ให้แอดมินรันไฟล์ supabase-qc-plan.sql ก่อน
      </div>}

      <div className="card">
        <div className="field" style={{marginBottom:0}}>
          <label>วันที่</label>
          <input type="date" value={day} onChange={e=>setDay(e.target.value)}/>
        </div>
      </div>

      {msg&&<div style={{margin:'10px 2px',fontSize:14,color:msg.startsWith('❌')?'var(--bad)':'var(--ok)'}}>{msg}</div>}

      {!missing&&(plan===null
        ? <div className="card" style={{color:'#78839a'}}>กำลังโหลด…</div>
        : editing
          ? <>
            <div className="sec">เลือกแพที่ผลิตวันนี้</div>
            <div className="card">
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                {rafts.map(r=>{
                  const on=sel.includes(r.raft_num);
                  const opts=sizeOptsFor(r.raft_num);       // null = แพนี้แก้ขนาดไม่ได้
                  const cur=spec[r.raft_num]||raftLabel(r);
                  return <div key={r.raft_num} onClick={()=>{
                      setSel(s=>on?s.filter(x=>x!==r.raft_num):[...s,r.raft_num]);
                      if(!on) setSpec(sp=>({...sp,[r.raft_num]:sp[r.raft_num]||raftLabel(r)}));
                    }}
                    style={{padding:'12px 8px',borderRadius:12,cursor:'pointer',textAlign:'left',
                      border:`2px solid ${on?'var(--ok)':'var(--line-strong)'}`,background:on?'var(--okbg)':'#fff'}}>
                    <div style={{fontSize:15,fontWeight:800,color:on?'var(--ok)':'var(--ink)'}}>
                      {on?'✓ ':''}แพ {r.raft_num}
                    </div>
                    {on&&opts
                      ? <select value={cur} onClick={e=>e.stopPropagation()}
                          onChange={e=>{e.stopPropagation();setSpec(sp=>({...sp,[r.raft_num]:e.target.value}));}}
                          style={{marginTop:5,width:'100%',padding:'5px 6px',fontSize:13,fontWeight:700,
                            fontFamily:'inherit',color:'var(--ok)',background:'#fff',
                            border:'1.5px solid var(--ok)',borderRadius:7}}>
                          {opts.map(o=><option key={o} value={o}>{o}</option>)}
                        </select>
                      : <div style={{fontSize:12.5,color:'var(--muted)',marginTop:2}}>
                          {cur||'ยังไม่ระบุ'}{opts?' ✎':''}
                        </div>}
                  </div>;
                })}
              </div>
              <button className="ghost" style={{marginTop:12}} onClick={copyPrev}>📄 เหมือนเมื่อวาน</button>
            </div>

            <div style={{display:'flex',gap:10,marginTop:12}}>
              <button className="bigbtn" style={{flex:1}} disabled={saving} onClick={save}>
                {saving?'กำลังบันทึก…':'บันทึกใบงาน ('+sel.length+' แพ)'}
              </button>
              <button className="ghost" style={{width:110}} onClick={()=>setEditing(false)}>ยกเลิก</button>
            </div>
          </>
          : <>
            <div className="card" style={{marginTop:12,textAlign:'center',
              background:total&&done===total?'var(--okbg)':'#fff',
              borderColor:total&&done===total?'#a7e3d4':'var(--line)'}}>
              <div style={{fontSize:13,color:'var(--muted)'}}>ตรวจก่อนผลิตแล้ว</div>
              <div className="big" style={{color:total&&done===total?'var(--ok)':'var(--bad)'}}>{done}/{total} แพ</div>
            </div>

            {total===0
              ? <div className="card" style={{color:'#78839a',lineHeight:1.9}}>
                  ยังไม่ได้ลงใบงานของวันนี้ — กดปุ่มด้านล่างเพื่อเลือกแพที่ผลิต
                </div>
              : (plan||[]).map(p=>{
                  const ok=isDone(p.raft_num);
                  return <button key={p.raft_num} onClick={()=>onInspect(p.raft_num,day,p.pile_spec,ok)}
                    style={{width:'100%',textAlign:'left',marginBottom:8,padding:'14px 15px',borderRadius:12,
                      cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:12,
                      border:`1.5px solid ${ok?'#a7e3d4':'#f3b8b0'}`,background:ok?'var(--okbg)':'var(--badbg)'}}>
                    <span style={{fontSize:20}}>{ok?'🟢':'🔴'}</span>
                    <span style={{flex:1}}>
                      <span style={{display:'block',fontSize:16,fontWeight:800,color:ok?'var(--ok)':'var(--bad)'}}>แพ {p.raft_num}</span>
                      <span style={{display:'block',fontSize:13,color:'var(--muted)'}}>{p.pile_spec||'ยังไม่ระบุขนาด'}</span>
                    </span>
                    <span style={{fontSize:13,fontWeight:700,color:ok?'var(--ok)':'var(--bad)'}}>
                      {ok?'ตรวจแล้ว':'ตรวจเลย →'}
                    </span>
                  </button>;
                })}

            <button className="ghost" style={{marginTop:6}} onClick={openEdit}>
              ✎ {total?'แก้ไขใบงาน':'ลงใบงานผลิตวันนี้'}
            </button>
          </>)}
    </div>
  </>;
}

// หน้าเลือกแพก่อนตรวจก่อนผลิต — แสดงสถานะแดง/เขียว เหมือนใบงานผลิต
function PreListView({me,rafts,onBack,onInspect,initialDay,formType='pre'}){
  const isPost=formType==='post';
  const title=isPost?'ตรวจหลังผลิต':'ตรวจก่อนผลิต';
  const [day,setDay]=useState(initialDay||todayISO());
  const [plan,setPlan]=useState(null);
  const [checked,setChecked]=useState([]);
  const [missing,setMissing]=useState(false);

  const load=(d)=>{
    Promise.all([
      DB.from('qc_production_day').select('raft_num,pile_spec').eq('d',d).order('raft_num'),
      DB.from('qc_checks').select('bed_no').eq('form_type',formType).eq('check_date',d),
    ]).then(([p,c])=>{
      if(p.error){setMissing(true);return;}
      setMissing(false);
      setPlan(p.data||[]);
      setChecked([...new Set((c.data||[]).map(x=>String(x.bed_no)).filter(Boolean))]);
    }).catch(()=>setMissing(true));
  };
  useEffect(()=>{setPlan(null);load(day);},[day]);

  const isDone=n=>checked.includes(String(n));
  const done=(plan||[]).filter(p=>isDone(p.raft_num)).length;
  const total=(plan||[]).length;

  return <>
    <div className="topbar">
      <button onClick={onBack} style={{background:'rgba(255,255,255,.2)',border:'none',color:'#fff',
        borderRadius:10,padding:'7px 11px',fontSize:16,cursor:'pointer'}}>←</button>
      <div><div className="who">{title}</div><div className="sub">{me.name} · {thaiDate(day)}</div></div>
    </div>
    <div className="wrap">
      <div className="card">
        <div className="field" style={{marginBottom:0}}>
          <label>{isPost?'วันที่ผลิตของแพ':'วันที่'}</label>
          <input type="date" value={day} onChange={e=>setDay(e.target.value)}/>
        </div>
      </div>

      {missing
        ? <div className="card" style={{marginTop:14,color:'#92400e',background:'#fffbeb',borderColor:'#fde68a',lineHeight:1.9}}>
            ⚠️ ยังไม่ได้สร้างตารางใบงานผลิต — ให้แอดมินรันไฟล์ supabase-qc-plan.sql ก่อน
          </div>
        : plan===null
          ? <div className="card" style={{color:'#78839a'}}>กำลังโหลด…</div>
          : <>
              <div className="card" style={{marginTop:12,textAlign:'center',
                background:total&&done===total?'var(--okbg)':'#fff',
                borderColor:total&&done===total?'#a7e3d4':'var(--line)'}}>
                <div style={{fontSize:13,color:'var(--muted)'}}>{title}แล้ว</div>
                <div className="big" style={{color:total&&done===total?'var(--ok)':'var(--bad)'}}>{done}/{total} แพ</div>
              </div>

              {total===0
                ? <div className="card" style={{color:'#78839a',lineHeight:1.9}}>
                    ยังไม่มีใบงานผลิตของวันนี้ — ไปที่แท็บ ใบงานผลิต เพื่อลงแพก่อน
                  </div>
                : (plan||[]).map(p=>{
                    const ok=isDone(p.raft_num);
                    return <button key={p.raft_num} onClick={()=>onInspect(p.raft_num,day,p.pile_spec,ok)}
                      style={{width:'100%',textAlign:'left',marginBottom:8,padding:'14px 15px',borderRadius:12,
                        cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',gap:12,
                        border:`1.5px solid ${ok?'#a7e3d4':'#f3b8b0'}`,background:ok?'var(--okbg)':'var(--badbg)'}}>
                      <span style={{fontSize:20}}>{ok?'🟢':'🔴'}</span>
                      <span style={{flex:1}}>
                        <span style={{display:'block',fontSize:16,fontWeight:800,color:ok?'var(--ok)':'var(--bad)'}}>แพ {p.raft_num}</span>
                        <span style={{display:'block',fontSize:13,color:'var(--muted)'}}>{p.pile_spec||'ยังไม่ระบุขนาด'}</span>
                      </span>
                      <span style={{fontSize:13,fontWeight:700,color:ok?'var(--ok)':'var(--bad)'}}>
                        {ok?'ตรวจแล้ว ✓':'ตรวจเลย →'}
                      </span>
                    </button>;
                  })}
            </>}
    </div>
  </>;
}

function PickMaterial({me,mats,onPick,onBack}){
  return <>
    <div className="topbar">
      <button onClick={onBack} style={{background:'rgba(255,255,255,.2)',border:'none',color:'#fff',
        borderRadius:10,padding:'7px 11px',fontSize:16,cursor:'pointer'}}>←</button>
      <div><div className="who">ตรวจสอบวัตถุดิบ</div><div className="sub">{me.name} · เลือกวัตถุดิบที่รับเข้า</div></div>
    </div>
    <div className="wrap">
      {mats.map(m=>(
        <button key={m} onClick={()=>onPick(m)} className="card"
          style={{width:'100%',textAlign:'left',cursor:'pointer',fontSize:16.5,fontWeight:700,color:'var(--brand)'}}>
          📦 {m}
        </button>
      ))}
      {!mats.length&&<div className="card" style={{marginTop:16,color:'#92400e',background:'#fffbeb',borderColor:'#fde68a',lineHeight:1.9}}>
        ⚠️ ยังไม่มีหัวข้อตรวจวัตถุดิบ — ให้แอดมินรันไฟล์ supabase-qc-materials.sql ก่อน
      </div>}
    </div>
  </>;
}

function CheckForm({me,formType,material,checklist,rafts,elong,preset,onBack,onBackToList}){
  const F=FORMS[formType];
  const isPre=formType==='pre';
  const isMat=formType==='mat';
  const [head,setHead]=useState(()=>({
    check_date: (preset&&preset.day)||todayISO(), bed_no:'', lot_no:'', pile_spec:'', qty:'', supplier:'', elong:{},
  }));
  const [vals,setVals]=useState({});        // itemId -> {yn, num, note}
  const [files,setFiles]=useState([]);      // {id, file, url}
  const [saving,setSaving]=useState(false);
  const [done,setDone]=useState(null);
  const [viewMode,setViewMode]=useState(()=>preset?.isChecked?'view':null);
  const [existingCheck,setExistingCheck]=useState(null);
  const [existingItems,setExistingItems]=useState([]);
  const fileRef=useRef(null);
  // แพที่เลือกตรวจได้ = เฉพาะแพในใบงานผลิตของวันนั้น
  const [dayPlan,setDayPlan]=useState(null);
  useEffect(()=>{
    if(formType==='mat'){setDayPlan([]);return;}
    setDayPlan(null);
    DB.from('qc_production_day').select('raft_num,pile_spec').eq('d',head.check_date).order('raft_num')
      .then(({data,error})=>setDayPlan(error?[]:(data||[])));
  },[head.check_date,formType]);

  // จำค่าหัวเรื่องล่าสุดของคนนี้ไว้ กรอกครั้งต่อไปไม่ต้องพิมพ์ซ้ำ
  const memKey='qc_last_'+me.code+'_'+formType+(material?'_'+material:'');
  // กดมาจากใบงานผลิต → ตั้งวันที่ แพ และขนาดตามใบงานนั้นเลย (ไม่ใช่ค่าจากระบบแพผลิต)
  useEffect(()=>{
    if(!preset) return;
    const r=(rafts||[]).find(x=>String(x.raft_num)===String(preset.raft));
    setHead(h=>({...h,check_date:preset.day||h.check_date,
      bed_no:String(preset.raft), pile_spec:preset.spec||raftLabel(r)}));
  },[preset]);
  useEffect(()=>{
    if(preset) return; // กดมาจากใบงาน → ใช้ขนาดจากใบงาน ไม่ใช่จาก localStorage
    try{
      const m=JSON.parse(localStorage.getItem(memKey)||'null');
      if(m) setHead(h=>({...h,pile_spec:m.pile_spec||'',supplier:m.supplier||''}));
    }catch(e){}
  },[memKey]);

  useEffect(()=>{
    if(!preset?.isChecked){setViewMode(null);setExistingCheck(null);setExistingItems([]);return;}
    setViewMode('view');
    DB.from('qc_checks')
      .select('*').eq('form_type',formType).eq('check_date',preset.day).eq('bed_no',String(preset.raft))
      .limit(1)
      .then(({data,error})=>{
        if(error||!data||!data.length){setViewMode(null);return;}
        const chk=data[0];
        setExistingCheck(chk);
        setHead(h=>({...h,check_date:chk.check_date,bed_no:String(chk.bed_no),
          lot_no:chk.lot_no||'',pile_spec:chk.pile_spec||'',
          qty:chk.qty||'',supplier:chk.supplier||'',elong:{}}));
        DB.from('qc_check_items').select('*').eq('check_id',chk.id)
          .then(({data:items})=>{
            const nv={},ev={};
            (items||[]).forEach(it=>{
              if(it.item_id!=null) nv[it.item_id]={yn:it.value_yn||undefined,num:it.value_num!=null?String(it.value_num):'',note:it.note||''};
              else if(it.label&&it.label.includes('ระยะยืด')){const m=it.label.match(/(\d+)\s*มม/);if(m)ev[m[1]]=it.value_num!=null?String(it.value_num):'';}
            });
            setVals(nv);setHead(h=>({...h,elong:ev}));setExistingItems(items||[]);
          });
      }).catch(()=>{setViewMode(null);});
  },[preset]);

  const set=(id,patch)=>setVals(v=>({...v,[id]:{...(v[id]||{}),...patch}}));
  const itemOk=it=>{
    const v=vals[it.id]||{};
    if(it.kind==='num') return judgeNum(v.num,it.min_val,it.max_val);
    return v.yn==null||v.yn==='na' ? (v.yn==='na'?true:null) : v.yn==='pass';
  };
  const answered=checklist.filter(it=>{const v=vals[it.id]||{};return it.kind==='num'?(v.num!==''&&v.num!=null):!!v.yn;});
  const failed=checklist.filter(it=>itemOk(it)===false);
  const allAnswered=answered.length===checklist.length;

  const passAll=()=>{
    const next={...vals};
    checklist.forEach(it=>{ if(it.kind==='yn') next[it.id]={...(next[it.id]||{}),yn:'pass'}; });
    setVals(next);
  };

  const addFiles=e=>{
    const list=Array.from(e.target.files||[]);
    setFiles(f=>[...f,...list.map(file=>({id:Math.random().toString(36).slice(2),file,url:URL.createObjectURL(file)}))]);
    e.target.value='';
  };

  const submit=async()=>{
    if(viewMode==='edit'&&existingCheck){
      setSaving(true);
      try{
        const checkId=existingCheck.id;
        const elongRows=!isPre?[]:pickElongSpecs(elong,head.pile_spec,head.bed_no)
          .map(sp=>{
            const raw=(head.elong||{})[sp.wire_mm];
            if(raw===''||raw==null||!isFinite(Number(raw))) return null;
            const n=Number(raw);
            const ok=n>=sp.target_mm*(1-sp.tol_pct/100)&&n<=sp.target_mm*(1+sp.tol_pct/100);
            return {sp,n,ok};
          }).filter(Boolean);
        const allFailed=failed.concat(elongRows.filter(r=>!r.ok).map(r=>({label:'ระยะยืดของลวด '+r.sp.wire_mm+' มม.'})));
        const result=allFailed.length?'fail':'pass';
        const {error:updErr}=await DB.from('qc_checks')
          .update({pile_spec:head.pile_spec||'',result,fail_count:allFailed.length})
          .eq('id',checkId);
        if(updErr) throw updErr;
        await DB.from('qc_check_items').delete().eq('check_id',checkId);
        const rows=checklist.map(it=>{
          const v=vals[it.id]||{};const ok=itemOk(it);
          return {check_id:checkId,item_id:it.id,label:it.label,section:it.section,kind:it.kind,
            value_yn:it.kind==='yn'?(v.yn||null):null,
            value_num:it.kind==='num'&&v.num!==''&&v.num!=null?Number(v.num):null,
            unit:it.unit||'',ok:ok,note:v.note||''};
        });
        elongRows.forEach(r=>{rows.push({check_id:checkId,item_id:null,
          label:'ระยะยืดของลวด '+r.sp.wire_mm+' มม. (Elongation total)',section:'ลวดอัดแรง/เหล็กเสริม',
          kind:'num',value_yn:null,value_num:r.n,unit:'มม.',ok:r.ok,
          note:'เกณฑ์ '+r.sp.target_mm+' มม. ±'+r.sp.tol_pct+'%'});});
        if(rows.length) await DB.from('qc_check_items').insert(rows);
        setExistingCheck(c=>({...c,result,fail_count:allFailed.length}));
        setExistingItems(rows);
        setDone({result,failed:allFailed.map(f=>f.label),id:checkId,isEdit:true});
      }catch(e){alert('แก้ไขไม่สำเร็จ: '+(e.message||e));}
      finally{setSaving(false);}
      return;
    }
    if(!allAnswered){
      if(!window.confirm('ยังตอบไม่ครบ ('+answered.length+'/'+checklist.length+' ข้อ) — ส่งเลยไหม?')) return;
    }
    setSaving(true);
    try{
      // ระยะยืดของลวดเป็นหัวข้อพิเศษ (ไม่ได้อยู่ในเช็คลิสต์) ต้องรวมผลก่อนตัดสินทั้งใบ
      // ระยะยืดของลวด — ตัดสินแยกทีละขนาดลวด แล้วรวมเข้ากับผลรวมของใบ
      // ต้องจับคู่ด้วยขนาดเสาก่อน เพราะแพเดียวกันผลิตขนาดต่างกันได้ในแต่ละวัน
      // (ใช้ให้ตรงกับตอนแก้ไขและตอนแสดงผล ไม่งั้นได้เกณฑ์คนละตัว)
      const elongRows=!isPre?[]:pickElongSpecs(elong,head.pile_spec,head.bed_no)
        .map(sp=>{
          const raw=(head.elong||{})[sp.wire_mm];
          if(raw===''||raw==null||!isFinite(Number(raw))) return null;
          const n=Number(raw);
          const ok=n>=sp.target_mm*(1-sp.tol_pct/100)&&n<=sp.target_mm*(1+sp.tol_pct/100);
          return {sp,n,ok};
        }).filter(Boolean);
      const allFailed=failed.concat(elongRows.filter(r=>!r.ok)
        .map(r=>({label:'ระยะยืดของลวด '+r.sp.wire_mm+' มม.'})));
      const result=allFailed.length?'fail':'pass';
      const {data,error}=await DB.from('qc_checks').insert({
        form_type:formType, inspector_code:me.code, check_date:head.check_date,
        bed_no:head.bed_no||'', lot_no:head.lot_no||'', pile_spec:head.pile_spec||'',
        material:material||'', supplier:head.supplier||'',
        qty:Number(head.qty)||0, result, fail_count:allFailed.length, note:''
      }).select().single();
      if(error) throw error;
      const checkId=data.id;

      const rows=checklist.map(it=>{
        const v=vals[it.id]||{};
        const ok=itemOk(it);
        return {check_id:checkId,item_id:it.id,label:it.label,section:it.section,kind:it.kind,
                value_yn:it.kind==='yn'?(v.yn||null):null,
                value_num:it.kind==='num'&&v.num!==''&&v.num!=null?Number(v.num):null,
                unit:it.unit||'', ok:ok, note:v.note||''};
      });
      // ระยะยืดของลวด เก็บเป็นหัวข้อหนึ่งในใบตรวจ จะได้โผล่ในรายงานเหมือนหัวข้ออื่น
      elongRows.forEach(r=>{
        rows.push({check_id:checkId,item_id:null,
          label:'ระยะยืดของลวด '+r.sp.wire_mm+' มม. (Elongation total)',section:'ลวดอัดแรง/เหล็กเสริม',
          kind:'num',value_yn:null,value_num:r.n,unit:'มม.',ok:r.ok,
          note:'เกณฑ์ '+r.sp.target_mm+' มม. ±'+r.sp.tol_pct+'%'});
      });
      if(rows.length) await DB.from('qc_check_items').insert(rows);

      for(const f of files){
        const blob=await compressImage(f.file);
        if(!blob) continue;
        const path='qc/'+checkId+'/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';
        const {error:upErr}=await DB.storage.from('quality-images')
          .upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
        if(upErr) continue;
        const {data:{publicUrl}}=DB.storage.from('quality-images').getPublicUrl(path);
        await DB.from('qc_check_images').insert({check_id:checkId,image_url:publicUrl});
      }

      try{localStorage.setItem(memKey,JSON.stringify({pile_spec:head.pile_spec,supplier:head.supplier}));}catch(e){}
      setDone({result,failed:allFailed.map(f=>f.label),id:checkId});
    }catch(e){
      alert('บันทึกไม่สำเร็จ: '+(e.message||e));
    }finally{ setSaving(false); }
  };

  if(done) return <Done me={me} done={done}
    onNew={done.isEdit?(()=>(onBackToList||onBack)(existingCheck?.check_date)):()=>{setDone(null);setVals({});setFiles([]);}}
    onBack={onBack}/>;

  // การ์ดระยะยืดของลวด — แสดงรวมอยู่ในหมวดลวดอัดแรง/เหล็กเสริม
  // การ์ดระยะยืดของลวด — แยกช่องกรอกตามขนาดลวด (บางแพใช้ทั้ง 4 และ 5 มม.)
  const elongCard=(()=>{
    if(!isPre||!head.bed_no) return null;
    if(String(head.pile_spec||'').trim()==='เลนเดี่ยว') return null; // ไม่ใช่ขนาดเสาจริง ไม่มีระยะยืดให้ตรวจ
    // ผูกกับขนาดเสาที่ใช้จริงวันนี้ (head.pile_spec) ไม่ใช่เลขแพ — แพ S/แพที่เปลี่ยนขนาดได้จะได้ค่าตามขนาดที่ใช้จริง
    const specs=pickElongSpecs(elong,head.pile_spec,head.bed_no);
    const judge=(sp,raw)=>{
      if(raw===''||raw==null) return null;
      const n=Number(raw); if(!isFinite(n)) return null;
      return n>=sp.target_mm*(1-sp.tol_pct/100)&&n<=sp.target_mm*(1+sp.tol_pct/100);
    };
    const anyBad=specs.some(sp=>judge(sp,(head.elong||{})[sp.wire_mm])===false);
    const anyOk=specs.some(sp=>judge(sp,(head.elong||{})[sp.wire_mm])===true);
    return (
      <div className={'item '+(anyBad?'bad':anyOk?'ok':'')}>
        <div className="lbl">ระยะยืดของลวด (Elongation total)</div>
        {!specs.length
          ? <div className="spec" style={{margin:0,lineHeight:1.9}}>
              ⚠️ ขนาด {head.pile_spec||('แพ '+head.bed_no)} ยังไม่ได้ตั้งค่าระยะยืด — ให้แอดมินตั้งที่ แท็บงาน QC → ลิงก์ &amp; หัวข้อตรวจ
            </div>
          : specs.map((sp,i)=>{
              const raw=(head.elong||{})[sp.wire_mm];
              const ok=judge(sp,raw);
              const lo=sp.target_mm*(1-sp.tol_pct/100), hi=sp.target_mm*(1+sp.tol_pct/100);
              const diff=(raw===''||raw==null||!isFinite(Number(raw)))?null:(Number(raw)-sp.target_mm);
              return <div key={sp.wire_mm} style={{marginTop:i?14:4,paddingTop:i?12:0,
                borderTop:i?'1px solid var(--line)':'none'}}>
                <div style={{fontSize:14.5,fontWeight:800,color:'var(--brand)',marginBottom:3}}>ลวด {sp.wire_mm} มม.</div>
                <div className="spec" style={{marginBottom:7}}>
                  ค่ามาตรฐาน <b>{sp.target_mm} มม.</b> · ยอมรับ ±{sp.tol_pct}% ({lo.toFixed(1)}–{hi.toFixed(1)} มม.)
                </div>
                <div className="numrow">
                  <input type="number" step="any" inputMode="decimal" placeholder="ค่าที่วัดได้"
                    value={raw??''}
                    onChange={e=>setHead(h=>({...h,elong:{...(h.elong||{}),[sp.wire_mm]:e.target.value}}))}/>
                  <span className="unit">มม.</span>
                  {ok!=null&&<span className={'verdict '+(ok?'v-ok':'v-bad')}>{ok?'ผ่าน':'ไม่ผ่าน'}</span>}
                </div>
                {diff!=null&&<div className="spec" style={{marginTop:6,marginBottom:0}}>
                  ต่างจากมาตรฐาน {diff>0?'+':''}{diff.toFixed(1)} มม. ({(diff/sp.target_mm*100).toFixed(1)}%)
                </div>}
              </div>;
            })}
      </div>
    );
  })();

  // จัดกลุ่มตาม section
  const groups=[];
  checklist.forEach(it=>{
    const g=groups.find(x=>x.name===it.section);
    if(g) g.items.push(it); else groups.push({name:it.section,items:[it]});
  });

  return <>
    <div className="topbar">
      <button onClick={onBack} style={{background:'rgba(255,255,255,.2)',border:'none',color:'#fff',
        borderRadius:10,padding:'7px 11px',fontSize:16,cursor:'pointer'}}>←</button>
      <div><div className="who">{material||F.label}</div><div className="sub">{me.name} · {thaiDate(head.check_date)}{viewMode==='view'?' · ดูผลตรวจ':viewMode==='edit'?' · แก้ไข':''}</div></div>
    </div>

    <div className="wrap">
      <fieldset disabled={viewMode==='view'} style={{border:0,padding:0,margin:0,minWidth:0}}>
      <div className="card">
        <div className="field">
          {/* หลังผลิตตรวจคนละวันกับที่ผลิต จึงยึดวันที่ผลิตของแพเป็นหลัก (เวลาที่กรอกจริงเก็บใน created_at) */}
          <label>{isPre?'วันที่ตรวจ':isMat?'วันที่ตรวจ':'วันที่ผลิตของแพที่ตรวจ'}</label>
          <input type="date" value={head.check_date} onChange={e=>setHead(h=>({...h,check_date:e.target.value}))}/>
        </div>
        {isMat ? <>
          <div className="field"><label>ผู้ขาย / ผู้ส่ง</label>
            <input value={head.supplier} placeholder="ชื่อร้าน/บริษัท" onChange={e=>setHead(h=>({...h,supplier:e.target.value}))}/></div>
          <div className="field"><label>เลขที่ใบส่งของ</label>
            <input value={head.lot_no} placeholder="เช่น DO-1234" onChange={e=>setHead(h=>({...h,lot_no:e.target.value}))}/></div>
        </> : <>
          {/* เลือกแพจากระบบแพผลิต — ขนาดเสาเติมให้เองตามแพที่เลือก ไม่ต้องพิมพ์ */}
          <>
            <div className="field"><label>แพที่ตรวจ</label>
              <select value={head.bed_no} disabled={!dayPlan||!dayPlan.length} onChange={e=>{
                const n=e.target.value;
                const p=(dayPlan||[]).find(x=>String(x.raft_num)===n);
                const r=rafts.find(x=>String(x.raft_num)===n);
                setHead(h=>({...h,bed_no:n,pile_spec:(p&&p.pile_spec)||(r?raftLabel(r):'')}));
              }}>
                <option value="">— เลือกแพ —</option>
                {(dayPlan||[]).map(p=>(
                  <option key={p.raft_num} value={p.raft_num}>แพที่ {p.raft_num} · {p.pile_spec||'ยังไม่ระบุ'}</option>
                ))}
              </select>
              {dayPlan&&!dayPlan.length&&<div className="spec" style={{marginTop:6,marginBottom:0,color:'#92400e'}}>
                ⚠️ {isPre?'วันนี้':'วันที่เลือก'}ยังไม่มีใบงานผลิต — {isPre?'กลับไปลงใบงานที่เมนู “📋 ใบงานผลิตวันนี้” ก่อน':'ลองเลือกวันอื่น'}
              </div>}
              {dayPlan===null&&<div className="spec" style={{marginTop:6,marginBottom:0}}>กำลังโหลดใบงาน…</div>}
            </div>
            {head.bed_no&&<div className="field"><label>ขนาดเสา (จากใบงานผลิต)</label>
              <div style={{padding:'11px 12px',border:'1.5px solid var(--line)',borderRadius:10,
                background:'#f8fafc',fontWeight:700,color:'var(--brand)'}}>
                {(dayPlan||[]).find(p=>String(p.raft_num)===String(head.bed_no))?.pile_spec||head.pile_spec||'ยังไม่ระบุขนาดในระบบแพผลิต'}
              </div></div>}
          </>
        </>}
      </div>

      {!viewMode&&<button onClick={passAll} className="ghost" style={{marginTop:12,color:'var(--ok)',borderColor:'#a7e3d4'}}>
        ✓ ติ๊กผ่านทั้งหมด แล้วแก้เฉพาะข้อที่มีปัญหา
      </button>}

      {groups.map(g=>(
        <div key={g.name}>
          <div className="sec">{g.name}</div>
          {g.items.map(it=>{
            const v=vals[it.id]||{}, ok=itemOk(it);
            return <div key={it.id} className={'item '+(ok===false?'bad':ok===true?'ok':'')}>
              <div className="lbl">{it.label}</div>
              {it.spec_text&&<div className="spec">เกณฑ์: {it.spec_text}</div>}
              {it.kind==='yn'
                ? <div className="seg">
                    {[['pass','ผ่าน','on-pass'],['fail','ไม่ผ่าน','on-fail'],['na','ไม่เกี่ยว','on-na']].map(([k,l,cls])=>(
                      <button key={k} className={v.yn===k?cls:''} onClick={()=>set(it.id,{yn:k})}>{l}</button>
                    ))}
                  </div>
                : <div className="numrow">
                    <input type="number" step="any" inputMode="decimal" placeholder="ค่าที่วัดได้"
                      value={v.num??''} onChange={e=>set(it.id,{num:e.target.value})}/>
                    <span className="unit">{it.unit}</span>
                    {ok!=null&&<span className={'verdict '+(ok?'v-ok':'v-bad')}>{ok?'ผ่าน':'ไม่ผ่าน'}</span>}
                  </div>}
              {ok===false&&<input className="note" placeholder="ระบุปัญหา / สิ่งที่ต้องแก้"
                value={v.note||''} onChange={e=>set(it.id,{note:e.target.value})}/>}
            </div>;
          })}
          {g.name==='ลวดอัดแรง/เหล็กเสริม'&&elongCard}
        </div>
      ))}

      {viewMode!=='view'&&<>
      <div className="sec">รูปถ่าย</div>
      <div className="card">
        {/* ปุ่มเขียนว่าเลือกรูปได้ แต่ capture บังคับเปิดกล้องอย่างเดียว เอาออกให้ตรงกับที่เขียน */}
        <input ref={fileRef} type="file" accept="image/*" multiple
               style={{display:'none'}} onChange={addFiles}/>
        <button className="ghost" onClick={()=>fileRef.current&&fileRef.current.click()}>📷 ถ่ายรูป / เลือกรูป</button>
        {files.length>0&&<div className="thumbs">
          {files.map(f=>(
            <div key={f.id} className="thumb">
              <img src={f.url}/>
              <button onClick={()=>setFiles(x=>x.filter(y=>y.id!==f.id))}>✕</button>
            </div>
          ))}
        </div>}
      </div>
      </>}
      </fieldset>
    </div>

    <div className="bottom">
      <div className="inner">
        {viewMode==='view'
          ? <>
              <div style={{flex:1,fontSize:14,fontWeight:700,
                color:existingCheck?.result==='fail'?'var(--bad)':'var(--ok)'}}>
                {existingCheck
                  ? existingCheck.result==='fail'
                    ? '⚠️ ไม่ผ่าน '+existingCheck.fail_count+' ข้อ'
                    : '✅ ผ่านทั้งหมด'
                  : 'กำลังโหลด…'}
              </div>
              <button className="bigbtn" style={{flex:1,background:'#1a6fba'}} onClick={()=>setViewMode('edit')}>
                ✎ แก้ไขผลตรวจ
              </button>
            </>
          : viewMode==='edit'
          ? <>
              <button className="ghost" style={{width:100}} onClick={()=>{
                  const nv={},ev={};
                  existingItems.forEach(it=>{
                    if(it.item_id!=null) nv[it.item_id]={yn:it.value_yn||undefined,num:it.value_num!=null?String(it.value_num):'',note:it.note||''};
                    else if(it.label&&it.label.includes('ระยะยืด')){const m=it.label.match(/(\d+)\s*มม/);if(m)ev[m[1]]=it.value_num!=null?String(it.value_num):'';}
                  });
                  setVals(nv);setHead(h=>({...h,elong:ev}));setViewMode('view');
                }}>ยกเลิก</button>
              <button className="bigbtn" style={{flex:1,background:'#c47b00'}} disabled={saving} onClick={submit}>
                {saving?'กำลังบันทึก…':'ยืนยันแก้ไข'}
              </button>
            </>
          : <>
              <span className="pill" style={{background:failed.length?'var(--badbg)':'var(--nabg)',
                color:failed.length?'var(--bad)':'var(--muted)'}}>
                {answered.length}/{checklist.length}{failed.length?' · ไม่ผ่าน '+failed.length:''}
              </span>
              <button className="bigbtn" style={{flex:1}} disabled={saving||answered.length===0} onClick={submit}>
                {saving?'กำลังบันทึก…':'ส่งผลตรวจ'}
              </button>
            </>}
      </div>
    </div>
  </>;
}

function Done({me,done,onNew,onBack}){
  const bad=done.result==='fail';
  const edited=done.isEdit;
  return <>
    <div className="topbar"><div><div className="who">{bad?(edited?'แก้ไขแล้ว — พบข้อบกพร่อง':'บันทึกแล้ว — พบข้อบกพร่อง'):(edited?'แก้ไขแล้ว':'บันทึกแล้ว')}</div>
      <div className="sub">{me.name}</div></div></div>
    <div className="wrap">
      <div className="card" style={{marginTop:16,textAlign:'center',
        background:bad?'var(--badbg)':'var(--okbg)',borderColor:bad?'#f3b8b0':'#a7e3d4'}}>
        <div style={{fontSize:44}}>{bad?'⚠️':'✅'}</div>
        <div className="big" style={{color:bad?'var(--bad)':'var(--ok)',marginTop:4}}>
          {bad?'ไม่ผ่าน '+done.failed.length+' ข้อ':'ผ่านทั้งหมด'}
        </div>
        <div className="hint" style={{marginTop:6}}>ใบตรวจเลขที่ #{done.id}</div>
      </div>
      {bad&&<div className="card">
        <div style={{fontWeight:700,marginBottom:8,color:'var(--bad)'}}>ข้อที่ไม่ผ่าน</div>
        {done.failed.map((l,i)=><div key={i} style={{fontSize:14.5,lineHeight:1.9}}>• {l}</div>)}
      </div>}
      <button className="bigbtn" style={{marginTop:14}} onClick={onNew}>{edited?'กลับไปรายการ':'ตรวจใบใหม่'}</button>
      <button className="ghost" style={{marginTop:10}} onClick={onBack}>เปลี่ยนงานตรวจ</button>
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
