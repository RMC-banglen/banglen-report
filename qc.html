// iOS เก็บหน้าเว็บไว้ใน cache พอขึ้นโค้ดใหม่เครื่องเดิมจะยังเปิดของเก่า
// จึงโหลดแค่ 2KB แรกของไฟล์ตัวเองมาเทียบเลขเวอร์ชัน ถ้าไม่ตรงก็โหลดใหม่ให้เอง
var APP_VERSION='2026-11-12j';
(function(){
  var check=function(){
    fetch(location.pathname+'?_ck='+Date.now(),{cache:'no-store',headers:{Range:'bytes=0-2047'}})
      .then(function(r){return r.text();})
      .then(function(t){
        var m=t.match(/APP_VERSION='([^']+)'/);
        if(m&&m[1]!==APP_VERSION) location.replace(location.pathname+'?v='+m[1]);
      }).catch(function(){});
  };
  check();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
})();

const elongSpecKey = spec => { const s=String(spec||'').trim(); const m=s.match(/^(S[0-9]+)/); if(!m) return s; const suf=s.slice(m[1].length); return (suf==='มอก.'||suf==='รง.') ? m[1] : s; };

// เลือกค่ามาตรฐานระยะยืดของขนาดเสาที่กำลังตรวจ
//
// การยุบคีย์ข้างบนทำให้ 'S22' กับ 'S22มอก.' กลายเป็นคีย์เดียวกัน พอในตารางมีทั้งสองชื่อ

// แล้วกันซ้ำด้วยการเอาลวดขนาดละแถวเดียวเป็นด่านสุดท้าย
const pickElongSpecs = (list, pileSpec, bedNo) => {
  const all = list || [];

  if (!rows.length && raw) {

  }
  if (!rows.length) rows = all.filter(e => !e.pile_spec && String(e.raft_num) === String(bedNo));
  const seen = {};
  return rows.filter(e => seen[e.wire_mm] ? false : (seen[e.wire_mm] = 1, true))
             .sort((a,b) => a.wire_mm - b.wire_mm);
};
const thaiInitial = name => {
  const t=String(name||'').trim();
  return (t.length>1 && /[เแโใไ]/.test(t[0])) ? t[1] : t.slice(0,1);
};
const thaiDate = iso => {
  if(!iso) return '';
  const [y,m,d]=String(iso).split('-');
  return `${Number(d)}/${Number(m)}/${Number(y)+543}`;
};

// ย่อรูปก่อนอัป — มือถือถ่ายมา 3-5MB ถ้าอัปดิบจะช้าและเปลือง bandwidth
function compressImage(file,maxSize){
  return new Promise(resolve=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(u);
      const MAX=maxSize||900, scale=Math.min(1,MAX/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(resolve,'image/jpeg',0.78);
    };
    img.onerror=()=>resolve(null);
    img.src=u;
  });
}

// ตัดสินหัวข้อแบบกรอกค่า: อยู่ในช่วง min–max หรือไม่ (ว่างข้างไหน = ไม่จำกัดข้างนั้น)
function judgeNum(v,min,max){
  if(v===''||v==null) return null;
  const n=Number(v);
  if(!isFinite(n)) return null;
  if(min!=null && n<Number(min)) return false;
  if(max!=null && n>Number(max)) return false;
  return true;
}

// ===================== ตรวจสอบเสาเฟลหน้างาน =====================
// ลำดับ: ข้อมูลเสา/หน้างาน (อายุเสานับจากวันที่ผลิต) → กำลังอัดคอนกรีตวันผลิต ±3 วัน → ชั้นดิน Blow 30 ฟุต
//        → ตุ้ม (น้ำหนัก/ระยะยก เทียบ 0.7–2.5 เท่าของเสา) → ดิ่งเสา → รูปตอนเสาแตก → สรุป → ส่งออก PDF
const TARGET_NORMAL = {1:350,3:415,5:435,7:450};   // ksc ตามอายุ (ตรงกับแดชบอร์ด)
const TARGET_NP280  = {1:340,7:420};
// พื้นที่หน้าตัด A (ตร.ซม.) และเส้นรอบรูป P (ซม.) ตามแอปแบบเสาเข็ม — T = I มอก. · F = I โรงงาน · S = สี่เหลี่ยม มอก. · Q = สี่เหลี่ยมโรงงาน
const PILE_AP = {T18:[275,89],T22:[386,105],T26:[489,126],T30:[660,145],T35:[880,180],T40:[1240,197.5],
  F15:[140,74.9],F18:[216,89.3],F22:[344,107.5],F26:[460,129.9],F30:[585,148.9],F35:[805,176.0],
  Q22:[484,88],Q26:[676,104],Q30:[900,120],
  S18:[324,72],S22:[484,88],S26:[676,104],S30:[900,120],S35:[1225,140],S40:[1600,160]};
const PILE_SIZES = ['I15','I18','I22','I26','I30','I35','I40','S18','S22','S26','S30','S35','S40'];
const PILE_DENSITY = 2.4;                 // ตัน/ลบ.ม. คอนกรีตอัดแรง (ใช้หาน้ำหนักเสา = A × L × 2.4)
const pileKey = (size,std) => { const m=String(size||'').toUpperCase().match(/^([IS])\s*-?\s*(\d{2})$/); if(!m) return null; return (m[1]==='I'?(std==='fac'?'F':'T'):(std==='fac'?'Q':'S'))+m[2]; };
// สูตรคำนวณ Blow แบบ Danish (เหมือนใบ Blow count ในแอปแบบเสาเข็ม): W ตัน · H ซม. · Qa ตัน · L ม. · A ตร.ซม.
const BLOW_E = 0.75, BLOW_FS = 2.5, BLOW_EC = 300;
function blowCalc(A,L,W,H,Qa){
  if(!(A>0)||!(L>0)||!(W>0)||!(H>0)||!(Qa>0)) return null;
  const a=BLOW_E*W*H, b=(L*100)/(A*BLOW_EC), Qu=BLOW_FS*Qa, S=a/Qu-0.5*Math.sqrt(2*a*b);
  return {a,b,Qu,S,per10:S>0?10/S:0,per30:S>0?30/S:0};
}
// ใบบันทึกการตอก (Driving record): Blow ต่อ 1 ฟุต (30 ซม.) · Last ten blow penetration · ระดับหัว/ปลายเสาจริง · เบี้ยว N/E/W/S
// blowCalc = set ที่ "ต้องได้" ตาม Qa · ตรงนี้คือ set ที่ "ตอกได้จริง" (เฉลี่ยของ 10 ครั้งสุดท้าย) แล้วย้อนหา Qa ที่ทำได้จริงด้วยสูตร Danish เดียวกัน
const parseBlows = t => String(t||'').split(/[\s,;]+/).filter(x=>/^\d+(?:\.\d+)?$/.test(x)).map(Number).slice(0,60);
const numOrNull = v => v===''||v==null||!isFinite(Number(v))?null:Number(v);
function driveStats(r){
  const L=r.drive_log||{}, out={}, blows=(L.blows||[]).map(Number).filter(x=>x>=0);
  if(blows.length){const n=blows.length,sum=blows.reduce((t,x)=>t+x,0),l3=blows.slice(-3);
    out.n=n;out.total=sum;out.max=Math.max(...blows);out.avg=sum/n;out.last3=l3.reduce((t,x)=>t+x,0)/l3.length;out.ratio=out.avg>0?out.last3/out.avg:null;}
  const l10=(L.l10||[]).map(Number).filter(x=>x>0);
  if(l10.length){out.set=(l10.reduce((t,x)=>t+x,0)/l10.length)/10;out.per10=out.set>0?10/out.set:null;}   // set = ซม./ครั้ง (penetration 10 ครั้ง ÷ 10)
  const A=Number(r.pile_area_cm2),Ln=Number(r.pile_length_m),W=Number(r.hammer_weight_t),H=Number(r.hammer_drop_cm),Qa=Number(r.qa_ton);
  if(out.set>0&&A>0&&Ln>0&&W>0&&H>0){const a=BLOW_E*W*H,b=Ln*100/(A*BLOW_EC),Qu=a/(out.set+0.5*Math.sqrt(2*a*b));out.qaAct=Qu/BLOW_FS;if(Qa>0)out.qaRatio=out.qaAct/Qa;}
  const top=numOrNull(L.top),tip=numOrNull(L.tip),spec=numOrNull(L.spec_tip);
  out.top=top;out.tip=tip;out.spec=spec;
  if(tip!=null&&spec!=null)out.shortfall=Math.round((tip-spec)*100)/100;           // >0 = ตอกตื้นกว่าระดับปลายเสาที่กำหนด
  if(top!=null&&tip!=null&&Ln>0)out.lenGap=Math.round((Math.abs(top-tip)-Ln)*100)/100;   // ≠0 = ระดับหัว/ปลายไม่ตรงกับความยาวเสา
  const d=L.dev||{},nn=numOrNull(d.N)||0,ee=numOrNull(d.E)||0,ww=numOrNull(d.W)||0,ss=numOrNull(d.S)||0;
  if([d.N,d.E,d.W,d.S].some(x=>numOrNull(x)!=null)){const x=ee-ww,y=nn-ss;out.dev=Math.hypot(x,y);out.devDir=(y>0?'N':y<0?'S':'')+(x>0?'E':x<0?'W':'');}
  return out;
}
const HAMMER_MIN = 0.7, HAMMER_MAX = 2.5;
const SOIL_LV = [
  {t:'ดินอ่อน',e:'🟢',col:'#15803d',bg:'#dcfce7'},
  {t:'เฝ้าระวัง 1',e:'🟡',col:'#a16207',bg:'#fef9c3'},

];
const soilIdx = n => n<=300?0 : n>=600?4 : n<=400?1 : n<=500?2 : 3;
const isoAdd = (iso,n) => { const d=new Date(String(iso).slice(0,10)+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const isoDiff = (a,b) => Math.round((new Date(String(a).slice(0,10)+'T00:00:00Z')-new Date(String(b).slice(0,10)+'T00:00:00Z'))/864e5);
const normF = s => String(s==null?'':s).replace(/[\s ]+/g,' ').trim().replace(/^([A-Za-z]{1,3})\s+(?=\d)/,'$1');
const targetFor = (formula,age) => ((/^NP280$/i.test(formula||'')?TARGET_NP280:TARGET_NORMAL)[age])||null;
const dm = d => { const p=String(d).slice(0,10).split('-'); return Number(p[2])+'/'+Number(p[1]); };
const fmtN = (v,d=0) => v==null||!isFinite(v)?'–':Number(v).toFixed(d);
const mean = a => a.length?a.reduce((s,x)=>s+x,0)/a.length:null;

// รวมผลกำลังอัดวันผลิต ±3 วัน เป็นตาราง วัน × อายุ  (rows = [{d,a,k}] ผลรายชุด)
function buildStrength(rows,prod){
  const dates=prod?[-3,-2,-1,0,1,2,3].map(n=>isoAdd(prod,n)):[];
  const ages=[...new Set((rows||[]).map(r=>r.a))].filter(a=>a===7).sort((a,b)=>a-b);   // เทียบเฉพาะกำลังอัดอายุ 7 วัน
  const cell=(d,a)=>{const v=(rows||[]).filter(r=>String(r.d).slice(0,10)===d&&r.a===a).map(r=>r.k);return v.length?{avg:mean(v),n:v.length}:null;};
  return {dates,ages,cell};
}
// สรุปต่ออายุ: ผลวันผลิต เทียบเกณฑ์ และเทียบค่าเฉลี่ยวันข้างเคียง
function strengthSummary(rows,prod,formula){
  const S=buildStrength(rows,prod);
  return S.ages.map(a=>{
    const p=S.cell(prod,a);
    const nb=mean(S.dates.filter(d=>d!==prod).map(d=>S.cell(d,a)).filter(Boolean).map(c=>c.avg));
    const tg=targetFor(formula,a);
    return {age:a,prod:p?p.avg:null,n:p?p.n:0,nb,target:tg,ok:p&&tg?p.avg>=tg:null,delta:p&&nb!=null?p.avg-nb:null};
  });
}

// เสา 1 ต้นอาจผลิตหลายวัน (ต่อกันหลายท่อน) → prod_dates = [{date,len}] · ใบเก่าที่มีวันเดียว (prod_date) ใช้เป็น 1 ท่อน
const pieceLabel = (i,n) => n<=1?'เสาต้นนี้':i===0?'ท่อนล่าง':i===n-1?'ท่อนบน':'ท่อนกลาง'+(n>3?' '+i:'');
const piecesOf = r => { const a=(Array.isArray(r.prod_dates)&&r.prod_dates.length)?r.prod_dates:(r.prod_date?[{date:r.prod_date}]:[]);
  const list=a.filter(p=>p&&p.date), single=a.length===1;   // ใบเก่า/ท่อนเดียว: วันที่หน้าเสาเก็บอยู่ที่ตัวใบ
  return list.map((p,i)=>({date:String(p.date).slice(0,10),len:p.len==null?'':p.len,
    face:p.face!=null&&p.face!==''?String(p.face):(single?String(r.face_date||''):''),
    drive:String(r.drive_date||'').slice(0,10),label:pieceLabel(i,list.length)})); };
const keyOfSum = sum => sum.find(s=>s.age===7&&s.prod!=null)||sum.find(s=>s.age===3&&s.prod!=null)||sum.find(s=>s.prod!=null)||null;
// ตัวแทนผลกำลังอัดของใบตรวจ (ใช้ในรายการ): ท่อนที่ต่ำกว่าเกณฑ์มาก่อน
function strengthKeyAll(r){
  const keys=piecesOf(r).map(p=>({p,k:keyOfSum(strengthSummary(r.strength_rows||[],p.date,r.strength_formula))})).filter(x=>x.k);
  return keys.find(x=>x.k.ok===false)||keys[0]||null;
}

// ข้อสังเกตอัตโนมัติจากข้อมูลที่กรอก (บอกเป็นแนวโน้ม ไม่ใช่ข้อสรุปตายตัว)
function observations(r){
  const out=[];
  const pcsO=piecesOf(r);
  if(!(r.strength_rows||[]).length) out.push({t:'info',x:'ยังไม่มีผลกำลังอัดของวันผลิตในระบบ (ไม่ได้เทียบ)'});
  else pcsO.forEach(p=>{
    const key=keyOfSum(strengthSummary(r.strength_rows||[],p.date,r.strength_formula));
    const pre=pcsO.length>1?p.label+' (ผลิต '+dm(p.date)+'): ':'';
    if(!key) out.push({t:'info',x:pre+'ไม่มีผลกำลังอัดเฉพาะวันผลิต มีเฉพาะวันข้างเคียง'});
    else{
      if(key.ok===false) out.push({t:'bad',x:pre+'กำลังอัด '+key.age+' วันของวันผลิตได้ '+fmtN(key.prod)+' ksc ต่ำกว่าเกณฑ์ '+key.target+' ksc'});
      else if(key.ok===true) out.push({t:'ok',x:pre+'กำลังอัด '+key.age+' วันของวันผลิตได้ '+fmtN(key.prod)+' ksc ผ่านเกณฑ์ '+key.target+' ksc'});
      if(key.delta!=null&&key.delta<=-25) out.push({t:'warn',x:pre+'วันผลิตต่ำกว่าค่าเฉลี่ยวันข้างเคียง ±3 วัน อยู่ '+fmtN(-key.delta)+' ksc (ผลวันนั้นแย่กว่าปกติ)'});
    }
  });
  if(r.blow_count!=null&&r.blow_count!==''){
    const L=SOIL_LV[soilIdx(Number(r.blow_count))];
    if(soilIdx(Number(r.blow_count))===4) out.push({t:'warn',x:'ดินแข็ง (Blow '+r.blow_count+' ครั้ง/30 ฟุต) ต้องเพิ่มสเต็งคอนกรีตช่วย และเสี่ยงเสาแตกตอนตอกลึก'});
    else if(soilIdx(Number(r.blow_count))>=1) out.push({t:'info',x:'ชั้นดิน'+L.t+' (Blow '+r.blow_count+' ครั้ง/30 ฟุต) ควรเฝ้าระวังเรื่องตุ้มและระยะยก'});
    else out.push({t:'ok',x:'ดินอ่อน (Blow '+r.blow_count+' ครั้ง/30 ฟุต)'});
  }
  if(r.hammer_ratio!=null&&isFinite(r.hammer_ratio)){
    if(r.hammer_ratio<HAMMER_MIN) out.push({t:'bad',x:'ตุ้มเบาเกินไป ('+fmtN(r.hammer_ratio,2)+' เท่าของน้ำหนักเสา ต่ำกว่า '+HAMMER_MIN+') เสาอาจตอกไม่เข้า ตอกซ้ำหลายครั้งจนแตก'});
    else if(r.hammer_ratio>HAMMER_MAX) out.push({t:'bad',x:'ตุ้มหนักเกินไป ('+fmtN(r.hammer_ratio,2)+' เท่าของน้ำหนักเสา เกิน '+HAMMER_MAX+') เสี่ยงหัวเสาแตก/ร้าว'});
    else out.push({t:'ok',x:'น้ำหนักตุ้ม '+fmtN(r.hammer_ratio,2)+' เท่าของน้ำหนักเสา อยู่ในเกณฑ์ ('+HAMMER_MIN+'–'+HAMMER_MAX+' เท่า)'});
  }
  if(r.vertical_result==='bad') out.push({t:'bad',x:'เสาไม่ดิ่ง'+(r.vertical_note?' ('+r.vertical_note+')':'')+' อาจทำให้รับแรงเยื้องศูนย์จนแตก'});
  else if(r.vertical_result==='ok') out.push({t:'ok',x:'เช็คดิ่งเสาแล้ว ผ่าน'});
  return out;
}

// วิเคราะห์สาเหตุเบื้องต้นจากข้อมูลทั้งหมดในใบตรวจ — เรียงปัจจัยเสี่ยงตามความสำคัญ + แนวทางตรวจ/แก้ต่อ (ใช้เป็นแนวทาง ไม่ใช่ข้อสรุปตายตัว)
function analyze(r){
  const obs=observations(r), extra=[], pcs=piecesOf(r);
  pcs.forEach(p=>{
    const age=p.drive?isoDiff(p.drive,p.date):null;
    if(age!=null&&age<7) extra.push({t:'warn',x:(pcs.length>1?p.label+': ':'')+'ตอกตอนอายุ '+age+' วัน (น้อยกว่า 7 วัน) ยังไม่ถึงอายุที่ใช้เทียบกำลังอัด จึงยืนยันกำลังอัดจริงไม่ได้'});
  });
  if(r.blow_s_cm!=null&&r.blow_s_cm!==''&&Number(r.blow_s_cm)<=0) extra.push({t:'bad',x:'คำนวณ Blow ไม่ได้ — พลังงานตุ้ม (น้ำหนัก × ระยะยก) น้อยกว่าที่ Qa ต้องการ ตุ้มเบา/ยกต่ำเกินไป ตอกไม่เข้า'});
  const ds=driveStats(r), qaT=Number(r.qa_ton);
  if(ds.qaAct!=null&&qaT>0){
    if(ds.qaRatio<1) extra.push({t:'bad',x:'ตอกยังไม่ถึง set ที่ต้องการ — set จริง '+fmtN(ds.set,3)+' ซม./ครั้ง ให้ Qa ≈ '+fmtN(ds.qaAct,1)+' ตัน ต่ำกว่า Qa ตามแบบ '+fmtN(qaT,1)+' ตัน'});
    else extra.push({t:ds.qaRatio>=1.5?'warn':'ok',x:'set ถึงตามต้องการ — Qa ที่ตอกได้จริง ≈ '+fmtN(ds.qaAct,1)+' ตัน (แบบ '+fmtN(qaT,1)+' ตัน = '+fmtN(ds.qaRatio,2)+' เท่า)'+(ds.qaRatio>=1.5?' ตอกแน่นเกินที่ต้องการมาก ถ้ายังตอกต่อหลังถึง set หัวเสาเสี่ยงแตก':'')});
  }
  if(ds.shortfall!=null&&ds.shortfall>0.05){
    const reached=ds.qaRatio!=null&&ds.qaRatio>=1;
    extra.push({t:reached?'warn':'bad',x:'ตอกไม่ถึงระดับปลายเสาที่กำหนด (ปลายเสาจริง '+fmtN(ds.tip,2)+' ม. · ตามแบบ '+fmtN(ds.spec,2)+' ม. ขาด '+fmtN(ds.shortfall,2)+' ม.)'+(reached?' แต่ถึง set แล้ว → น่าจะติดชั้นแข็ง':' และยังไม่ถึง set')});
  }
  if(ds.ratio!=null&&ds.ratio>=2.5) extra.push({t:'warn',x:'ช่วงท้ายตอกยากขึ้นมาก — 3 ฟุตสุดท้ายเฉลี่ย '+fmtN(ds.last3,0)+' ครั้ง/ฟุต (สูงสุด '+ds.max+') เทียบเฉลี่ยทั้งช่วง '+fmtN(ds.avg,1)+' = '+fmtN(ds.ratio,1)+' เท่า หัวเสารับแรงกระแทกสูง/ติดชั้นแข็ง'});
  if(ds.lenGap!=null&&Math.abs(ds.lenGap)>0.05) extra.push({t:'info',x:'ระดับหัว/ปลายเสาจริงไม่ตรงกับความยาวเสา (ต่างกัน '+fmtN(Math.abs(ds.lenGap),2)+' ม.) — ตรวจตัวเลขในใบบันทึก'});
  if(ds.dev!=null&&ds.dev>0) extra.push({t:'info',x:'หัวเสาเบี้ยว '+fmtN(ds.dev,1)+' ซม. ทิศ '+(ds.devDir||'–')+(ds.tip!=null&&ds.top!=null&&Math.abs(ds.top-ds.tip)>0?' (≈ '+fmtN(ds.dev/(Math.abs(ds.top-ds.tip)),2)+' ซม./ม.)':'')});
  const all=[...obs,...extra];
  const sev={bad:0,warn:1,info:2,ok:3};
  const risks=all.filter(o=>o.t==='bad'||o.t==='warn').sort((a,b)=>sev[a.t]-sev[b.t]);
  const oks=all.filter(o=>o.t==='ok'), infos=all.filter(o=>o.t==='info');
  const has=re=>risks.some(o=>re.test(o.x));
  const checks=[];
  if(has(/ต่ำกว่าเกณฑ์ \d+ ksc|วันผลิตต่ำกว่าค่าเฉลี่ย/)) checks.push('ตรวจรอบผลิตวันนั้น: ส่วนผสม การบ่ม ผลก้อนทดสอบ และเสาต้นอื่นที่ผลิตวันเดียวกัน');
  if(has(/ดินแข็ง/)) checks.push('ดินแข็ง: พิจารณาเพิ่มสเต็งคอนกรีต/ใช้ตุ้มที่เหมาะสม/เจาะนำ และเฝ้าระวังเสาต้นข้างเคียง');
  if(has(/ตุ้มเบา|ตอกไม่เข้า/)) checks.push('ตุ้มเบา: เพิ่มน้ำหนักตุ้มให้อยู่ในช่วง '+HAMMER_MIN+'–'+HAMMER_MAX+' เท่าของน้ำหนักเสา หรือเพิ่มระยะยกอย่างระมัดระวัง');
  if(has(/ตุ้มหนัก/)) checks.push('ตุ้มหนัก: ลดระยะยก/ใช้ตุ้มเบาลง และตรวจหมวกรองหัวเสา');
  if(has(/ไม่ดิ่ง/)) checks.push('เสาไม่ดิ่ง: ตรวจแนวและหมุดก่อนตอก การตั้งเสา และแรงเยื้องศูนย์');
  if(has(/อายุ .* วัน \(น้อยกว่า 7/)) checks.push('อายุเสาน้อย: ตรวจเกณฑ์อายุก่อนตอก และเก็บผลกำลังอัดย้อนหลังให้ครบ');
  if(has(/ตอกยังไม่ถึง set/)) checks.push('ยังไม่ถึง set: ตรวจว่าตอกต่อได้อีกหรือไม่ / เพิ่มพลังงานตุ้ม และปรึกษาวิศวกรเรื่องกำลังรับน้ำหนักจริง');
  if(has(/ตอกไม่ถึงระดับปลายเสา/)) checks.push('ปลายเสาตื้นกว่าแบบ: ตรวจชั้นดินแข็ง/สิ่งกีดขวางใต้ดิน และให้วิศวกรยืนยันการรับรอง set ก่อนตัดหัวเสา');
  if(has(/ช่วงท้ายตอกยากขึ้นมาก/)) checks.push('ช่วงท้ายตอกยาก: ลดการตอกซ้ำเกิน set ใช้หมวกรองหัวเสาที่ดี และตรวจรอยร้าวหัวเสา/รอยต่อหลังตอก');
  if(!risks.length) checks.push('ข้อมูลที่ตรวจอยู่ในเกณฑ์ทั้งหมด — ตรวจเพิ่ม: รอยร้าวก่อนตอก การยกขนส่ง การจี้/รองหัวเสา และตำแหน่งที่แตก (หัวเสา/กลางต้น/รอยต่อ)');
  const summary=risks.length?('พบปัจจัยเสี่ยง '+risks.length+' ข้อ — ที่น่าสงสัยที่สุด: '+risks[0].x):'ข้อมูลที่ตรวจทั้งหมดอยู่ในเกณฑ์ ยังไม่พบสาเหตุชัดเจนจากตัวเลข';
  return {summary,risks,oks,infos,checks,nRisk:risks.length};
}

// ย่อรูปสำหรับรายงาน (ใหญ่กว่ารูปในใบตรวจอื่นเล็กน้อย)
async function loadAsDataUrl(url){
  try{
    const r=await fetch(url,{mode:'cors',cache:'force-cache'}); if(!r.ok) return null;
    const b=await r.blob();
    return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(b);});
  }catch(e){return null;}
}
function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector('script[data-src="'+src+'"]')) return res();
    const s=document.createElement('script'); s.src=src; s.dataset.src=src; s.onload=res; s.onerror=()=>rej(new Error('โหลดไลบรารีไม่ได้: '+src)); document.head.appendChild(s);
  });
}

// แปลงใบรายงานเป็น PDF (A4) โดยวางทีละบล็อก ไม่ตัดกลางบล็อก
async function makeFailPdf(rec,onStep){
  onStep&&onStep('กำลังโหลดเครื่องมือสร้าง PDF…');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  onStep&&onStep('กำลังเตรียมรูป…');
  const logo=await loadAsDataUrl('logo.png');
  const photos=(await Promise.all((rec.photos||[]).map(loadAsDataUrl))).filter(Boolean);
  const host=document.createElement('div');
  host.style.cssText='position:fixed;left:-10000px;top:0;background:#fff';
  document.body.appendChild(host);
  const root=ReactDOM.createRoot(host);
  root.render(<FailReport rec={rec} logo={logo} photos={photos}/>);
  try{
    await new Promise(r=>setTimeout(r,400));
    try{ await document.fonts.ready; }catch(e){}
    await Promise.all([...host.querySelectorAll('img')].map(im=>im.complete?1:new Promise(r=>{im.onload=r;im.onerror=r;})));
    onStep&&onStep('กำลังสร้าง PDF…');
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const PW=210,PH=297,M=8,W=PW-2*M,maxY=PH-M;
    let y=M;
    const wrap=host.firstChild;
    const padX=34,padTop=28;
    const blocks=[...wrap.querySelectorAll('[data-block]')];
    for(const b of blocks){
      const cv=await window.html2canvas(b,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      const w=W-2*((padX/794)*W), h=cv.height/cv.width*w;
      if(y+h>maxY&&y>M+1){pdf.addPage();y=M;}
      pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',M+(padX/794)*W,y,w,h);
      y+=h+2.5;
    }
    return pdf.output('blob');
  } finally { root.unmount(); host.remove(); }
}

  document.body.appendChild(host);
  const root=ReactDOM.createRoot(host);
  root.render(<FailReport rec={rec} logo={logo} photos={photos}/>);
  try{
    await new Promise(r=>setTimeout(r,400));
    try{ await document.fonts.ready; }catch(e){}
    await Promise.all([...host.querySelectorAll('img')].map(im=>im.complete?1:new Promise(r=>{im.onload=r;im.onerror=r;})));

function FailInspectView({me,onBack,openId}){
  const [view,setView]=useState('list');          // list | form | view
  const [list,setList]=useState(null);
  const [noTable,setNoTable]=useState(false);

  const carryOf=r=>({inspect_date:r.inspect_date,drive_date:String(r.drive_date||'').slice(0,10),customer:r.customer,site:r.site,pile_std:r.pile_std,blow_id:r.blow_id,blow_site:r.blow_site,blow_count:r.blow_count,blow_feet:r.blow_feet,hammer_weight_t:r.hammer_weight_t,hammer_drop_cm:r.hammer_drop_cm,qa_ton:r.qa_ton});
  const addNext=r=>{setRec(carryOf(r));setFormKey(k=>k+1);setView('form');};
  const loadList=()=>DB.from('pile_fail_inspections').select('*').order('created_at',{ascending:false}).limit(60)
    .then(({data,error})=>{if(error){setNoTable(true);setList([]);return;}setNoTable(false);setList(data||[]);}).catch(()=>{setNoTable(true);setList([]);});
  useEffect(()=>{loadList();},[]);
  useEffect(()=>{ if(!openId) return; if(openId==='new'){setRec(null);setView('form');return;} DB.from('pile_fail_inspections').select('*').eq('id',openId).single().then(({data})=>{ if(data){setRec(data);setView('view');} }); },[openId]);
  if(view==='form') return <FailForm key={formKey} me={me} init={rec} onCancel={()=>{setView(rec&&rec.id?'view':'list');}} onSaved={(r,opt)=>{loadList();if(opt&&opt.next){addNext(r);}else{setRec(r);setView('view');}}}/>;
  if(view==='view'&&rec) return <FailDetail rec={rec} onBack={()=>{setView('list');setRec(null);}} onEdit={()=>{setFormKey(k=>k+1);setView('form');}} onAddNext={()=>addNext(rec)}/>;
  const badge=(ok,txt)=>ok==null?null:<span className="pill" style={{background:ok?'#ecfdf5':'#fdecea',color:ok?'#0f766e':'#c0392b',marginRight:5,fontSize:12}}>{txt}</span>;
  return <>
    <div className="topbar"><button onClick={onBack} style={{background:'none',border:'none',color:'#fff',fontSize:22,cursor:'pointer'}}>‹</button>
      <div><div className="who">ตรวจเสาเฟลหน้างาน</div><div className="sub">{me.name} · ตรวจสาเหตุเสาแตกที่หน้างาน แล้วส่งออก PDF</div></div></div>
    <div className="wrap">
      {noTable&&<div className="card" style={{color:'#92400e',background:'#fffbeb',borderColor:'#fde68a',lineHeight:1.9}}>⚠️ ยังไม่ได้สร้างตารางในฐานข้อมูล — ให้แอดมินรัน SQL <b>supabase-pile-fail-inspect.sql</b> หนึ่งครั้ง แล้วรีเฟรชหน้านี้</div>}
      <div style={{marginTop:14}}><button className="bigbtn" disabled={noTable} onClick={()=>{setRec(null);setView('form');}}>＋ ตรวจเสาเฟลใหม่</button></div>
      <div className="sec">ใบตรวจล่าสุด</div>
      {list===null&&<div className="hint">กำลังโหลด…</div>}
      {list&&!list.length&&!noTable&&<div className="hint">ยังไม่มีใบตรวจ</div>}
      {(()=>{const dayOf=r=>String(r.drive_date||r.inspect_date||'').slice(0,10);const ds=[...new Set((list||[]).map(dayOf))].sort().reverse();
        return ds.map(day=>{const items=(list||[]).filter(r=>dayOf(r)===day);return <div key={day}>

        {items.map(r=>{
        const sk=strengthKeyAll(r),key=sk&&sk.k,pcsL=piecesOf(r);
        return <button key={r.id} className="card" style={{width:'100%',textAlign:'left',cursor:'pointer'}} onClick={()=>{setRec(r);setView('view');}}>
          <div style={{fontWeight:800,color:'var(--brand)'}}>{[r.customer,r.site].filter(Boolean).join(' · ')||'(ไม่ระบุหน้างาน)'}</div>
          <div className="hint">{r.pile_size||'–'}×{r.pile_length_m||'–'} ม. · ผลิต {pcsL.map(p=>thaiDate(p.date)).join(' + ')||'–'} · ตอก {thaiDate(r.drive_date)} · อายุ {r.age_days!=null?r.age_days+' วัน':'–'}</div>
          <div style={{marginTop:6}}>
            {key&&badge(key.ok,'กำลังอัด '+key.age+'ว. '+fmtN(key.prod)+(pcsL.length>1?' ('+sk.p.label+')':''))}
            {r.blow_count!=null&&<span className="pill" style={{background:SOIL_LV[soilIdx(r.blow_count)].bg,color:SOIL_LV[soilIdx(r.blow_count)].col,marginRight:5,fontSize:12}}>Blow {r.blow_count}</span>}

            {r.vertical_result&&r.vertical_result!=='na'&&badge(r.vertical_result==='ok','ดิ่ง'+(r.vertical_result==='ok'?'ผ่าน':'ไม่ผ่าน'))}
          </div>
          <div className="hint" style={{marginTop:4}}>ตรวจ {thaiDate(r.inspect_date)} โดย {r.inspector||'–'}</div>
        </button>;})}
        </div>;});})()}
    </div>
  </>;
}

function FailDetail({rec,onBack,onEdit,onAddNext}){
  const [busy,setBusy]=useState('');
  const [pdf,setPdf]=useState(null);   // {url,file}
  const [err,setErr]=useState('');
  const gen=async()=>{
    setBusy('เริ่ม…');setErr('');
    try{
      const blob=await makeFailPdf(rec,setBusy);
      const name='ตรวจเสาเฟล-'+(rec.pile_size||'')+'-'+String(rec.drive_date||rec.inspect_date||'').slice(0,10)+(rec.id?'-'+rec.id:'')+'.pdf';
      setPdf({url:URL.createObjectURL(blob),file:new File([blob],name,{type:'application/pdf'}),name});
    }catch(e){setErr('สร้าง PDF ไม่สำเร็จ: '+(e.message||e));}
    setBusy('');
  };
  const baseName='ตรวจเสาเฟล-'+(rec.pile_size||'')+'-'+String(rec.drive_date||rec.inspect_date||'').slice(0,10)+(rec.id?'-'+rec.id:'');
  const [busy2,setBusy2]=useState('');
  const [imgOut,setImgOut]=useState(null);              // {blob,url,file,name}
  const [sent,setSent]=useState(rec.problem_report_id||null);
  const getImg=async()=>{ if(imgOut) return imgOut.blob; const blob=await makeFailImage(rec,setBusy2);
    setImgOut({blob,url:URL.createObjectURL(blob),file:new File([blob],baseName+'.jpg',{type:'image/jpeg'}),name:baseName+'.jpg'}); return blob; };
  const genImg=async()=>{ setBusy2('เริ่ม…');setErr(''); try{ await getImg(); }catch(e){ setErr('สร้างรูปภาพไม่สำเร็จ: '+(e.message||e)); } setBusy2(''); };
  // ส่งเข้า "รายงานปัญหา" ของแดชบอร์ด (ประเภท ปัญหาหน้างาน) พร้อมแนบรูปรายงาน
  const sendProblem=async()=>{
    if(sent&&!window.confirm('ใบนี้ส่งเข้ารายงานปัญหาไปแล้ว (#'+sent+') ส่งซ้ำอีกหรือไม่ ?')) return;
    if(!window.confirm('ส่งใบตรวจนี้เข้า "รายงานปัญหา" (ประเภท ปัญหาหน้างาน) พร้อมแนบรูปรายงาน ?')) return;
    setBusy2('กำลังส่ง…');setErr('');
    try{
      const blob=await getImg();
      const an=analyze(rec), pcs=piecesOf(rec);

      const up=await DB.storage.from('quality-images').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
      if(up.error) throw up.error;
      const url=DB.storage.from('quality-images').getPublicUrl(path).data.publicUrl;
      const im=await DB.from('quality_report_images').insert({report_id:rid,image_url:url});
      if(im.error) throw im.error;
      const lk=await DB.from('pile_fail_inspections').update({problem_report_id:rid}).eq('id',rec.id);   // จำไว้ว่าส่งแล้ว (ต้องรัน SQL คอลัมน์ problem_report_id)
      setSent(rid);
      if(lk.error) setErr('ส่งเข้ารายงานปัญหาแล้ว (#'+rid+') แต่จดจำสถานะไม่ได้ — ให้แอดมินรัน SQL ล่าสุด (supabase-pile-fail-inspect.sql) ปุ่มนี้จึงกดส่งซ้ำได้');
    }catch(e){ setErr('ส่งเข้ารายงานปัญหาไม่สำเร็จ: '+(e.message||e)); }
    setBusy2('');
  };
  const canShare=pdf&&navigator.canShare&&navigator.canShare({files:[pdf.file]});
  const canShareImg=imgOut&&navigator.canShare&&navigator.canShare({files:[imgOut.file]});

        </div>
      </div>}
      <div className="card">
        <div style={{fontWeight:800,color:'var(--brand)',marginBottom:8}}>ส่งออกเป็นรูปภาพ / รายงานปัญหา</div>

        {imgOut&&<div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:8}}>
          <a href={imgOut.url} download={imgOut.name} className="ghost" style={{textDecoration:'none',textAlign:'center',flex:'1 1 120px'}}>⬇ ดาวน์โหลดรูป</a>
          <a href={imgOut.url} target="_blank" rel="noopener" className="ghost" style={{textDecoration:'none',textAlign:'center',flex:'1 1 120px'}}>👁 เปิดดู</a>
          {canShareImg&&<button className="ghost" style={{flex:'1 1 120px'}} onClick={()=>navigator.share({files:[imgOut.file],title:imgOut.name}).catch(()=>{})}>📤 แชร์</button>}</div>}
        <div className="hint" style={{marginTop:6}}>"ส่งเข้ารายงานปัญหา" สร้างรายการประเภท ปัญหาหน้างาน ในแท็บ รายงานปัญหา ของแดชบอร์ด พร้อมแนบรูปรายงานนี้</div>
      </div>
      <div className="card" style={{padding:0,overflowX:'auto'}}>
        <div style={{zoom:0.4}}><FailReport rec={rec} logo="logo.png" photos={rec.photos||[]}/></div>
      </div>
    </div>
  </>;
}

function FailForm({me,init,onCancel,onSaved}){
  const today=todayISO();
  const blank={inspect_date:today,customer:'',site:'',pile_size:'',pile_std:'tis',pile_length_m:'',prod_dates:[{date:'',face:'',len:''}],face_date:'',drive_date:today,foreman_report_id:null,
    strength_formula:'',strength_rows:[],blow_id:null,blow_site:'',blow_count:'',blow_feet:30,
    hammer_weight_t:'',hammer_drop_cm:'',qa_ton:'',pile_weight_t:null,pile_area_cm2:null,vertical_result:'',vertical_note:'',cause_note:'',action_note:'',log:{blows:'',l10:['','',''],top:'',tip:'',spec:'',N:'',E:'',W:'',S:''}};
  const [f,setF]=useState(()=>{
    const o=init?{...blank,...Object.fromEntries(Object.entries(init).map(([k,v])=>[k,v==null?(blank[k]!==undefined?blank[k]:''):v]))}:blank;
    const pd=piecesOf(o).map(p=>({date:p.date,face:p.face||'',len:p.len===''?'':String(p.len)}));
    const dl=(init&&init.drive_log&&Object.keys(init.drive_log).length)?init.drive_log:null, sv=v=>v==null?'':String(v);
    const log=dl?{blows:(dl.blows||[]).join(' '),l10:[0,1,2].map(i=>sv((dl.l10||[])[i])),top:sv(dl.top),tip:sv(dl.tip),spec:sv(dl.spec_tip),N:sv((dl.dev||{}).N),E:sv((dl.dev||{}).E),W:sv((dl.dev||{}).W),S:sv((dl.dev||{}).S)}:blank.log;
    return {...o,prod_dates:pd.length?pd:[{date:'',face:'',len:''}],log};
  });
  const setPd=(i,patch)=>setF(o=>({...o,prod_dates:o.prod_dates.map((p,j)=>j===i?{...p,...patch}:p)}));
  const addPd=()=>setF(o=>({...o,prod_dates:[...o.prod_dates,{date:'',face:'',len:''}]}));
  const delPd=i=>setF(o=>({...o,prod_dates:o.prod_dates.filter((_,j)=>j!==i)}));
  const set=(k,v)=>setF(o=>({...o,[k]:v}));
  const [files,setFiles]=useState([]);                    // รูปใหม่ {file,preview}
  const [oldPhotos,setOldPhotos]=useState(init?.photos||[]);
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState('');
  const [reports,setReports]=useState([]);               // รายงานโฟร์แมน
  const [doneIns,setDoneIns]=useState([]);                // ใบตรวจที่บันทึกแล้ว (ไว้ซ่อนเสาที่ตรวจแล้ว)
  const [showDone,setShowDone]=useState(false);
  const [blows,setBlows]=useState([]);                    // Blow count
  const [cr,setCr]=useState(null);                        // ผลกำลังอัดดิบช่วง ±3 วัน

  useEffect(()=>{
    const since=isoAdd(today,-120);
    DB.from('foreman_reports').select('*').gte('drive_date',since).order('drive_date',{ascending:false}).limit(120)
      .then(({data})=>setReports(data||[])).catch(()=>{});
    DB.from('pile_fail_inspections').select('id,foreman_report_id,drive_date,pile_size,pile_length_m').limit(3000).then(({data})=>setDoneIns(data||[])).catch(()=>{});
    DB.from('blow_counts').select('id,site,pile,blows,feet,count_date').order('count_date',{ascending:false}).limit(80)
      .then(({data})=>setBlows(data||[])).catch(()=>{});
  },[]);

  // ผลกำลังอัดวันผลิต ±3 วัน (รวมทุกท่อน/ทุกวันผลิต)
  const pcs=f.prod_dates.filter(p=>p.date);
  const datesKey=pcs.map(p=>p.date).sort().join(',');
  useEffect(()=>{
    if(!datesKey){setCr(null);return;}
    const ds=datesKey.split(',');
    const a=isoAdd(ds[0],-3),b=isoAdd(ds[ds.length-1],3);
    let off=false;
    DB.from('concrete_results').select('sample_date,formula_name,age_days,avg_ksc').gte('sample_date',a).lte('sample_date',b).limit(5000)
      .then(({data,error})=>{if(off)return;setCr(error?[]:(data||[]).map(r=>({d:String(r.sample_date).slice(0,10),f:normF(r.formula_name),a:Number(r.age_days),k:Number(r.avg_ksc)})).filter(r=>r.k>0&&!/\(/.test(r.f)));})
      .catch(()=>{if(!off)setCr([]);});
    return ()=>{off=true;};
  },[datesKey]);

  const formulas=cr?Object.entries(cr.reduce((m,r)=>{m[r.f]=(m[r.f]||0)+1;return m;},{})).sort((a,b)=>b[1]-a[1]).map(x=>x[0]):[];
  const rowsFor=cr?cr.filter(r=>f.strength_formula?r.f===f.strength_formula:!/^NP280$/i.test(r.f)).map(r=>({d:r.d,a:r.a,k:r.k})):[];
  // เก็บผลที่ใช้ตอนตรวจไว้ในใบ (ย้อนดูภายหลังได้ แม้ผลจะถูกแก้)
  useEffect(()=>{ if(cr) setF(o=>({...o,strength_rows:rowsFor})); },[cr,f.strength_formula]);   // eslint-disable-line

  const pieceAges=pcs.map(p=>f.drive_date?isoDiff(f.drive_date,p.date):null);
  const sumLen=f.prod_dates.reduce((t,p)=>t+(Number(p.len)||0),0);
  const lenMismatch=sumLen>0&&Number(f.pile_length_m)>0&&Math.abs(sumLen-Number(f.pile_length_m))>0.011;
  const age=pieceAges.filter(x=>x!=null).length?Math.min(...pieceAges.filter(x=>x!=null)):null;   // ท่อนที่อ่อนที่สุด
  const pKey=pileKey(f.pile_size,f.pile_std);
  const pArea=pKey&&PILE_AP[pKey]?PILE_AP[pKey][0]:null;     // ตร.ซม. จากแอปแบบเสาเข็ม
  const len=Number(f.pile_length_m)||0;
  const pileW=pArea&&len?pArea*len*100*PILE_DENSITY/1e6:null;    // ตัน
  const hw=Number(f.hammer_weight_t)||0;
  const ratio=pileW&&hw?hw/pileW:null;
  const bc=blowCalc(pArea,len,hw,Number(f.hammer_drop_cm),Number(f.qa_ton));
  // ใบบันทึกการตอก → ข้อมูลจริง
  const logObj={blows:parseBlows(f.log.blows),l10:f.log.l10.map(numOrNull).filter(x=>x!=null),top:numOrNull(f.log.top),tip:numOrNull(f.log.tip),spec_tip:numOrNull(f.log.spec),dev:{N:numOrNull(f.log.N),E:numOrNull(f.log.E),W:numOrNull(f.log.W),S:numOrNull(f.log.S)}};
  const dsF=driveStats({drive_log:logObj,pile_area_cm2:pArea,pile_length_m:len,hammer_weight_t:hw,hammer_drop_cm:Number(f.hammer_drop_cm),qa_ton:Number(f.qa_ton)});
  const hasLog=logObj.blows.length>0||logObj.l10.length>0||logObj.top!=null||logObj.tip!=null||logObj.spec_tip!=null||Object.values(logObj.dev).some(x=>x!=null);
  useEffect(()=>{ const t=logObj.blows.reduce((s,x)=>s+x,0); if(logObj.blows.length&&String(t)!==String(f.blow_count)) setF(o=>({...o,blow_count:String(t)})); },[f.log.blows]);   // รวม Blow จากใบ = ค่า Blow 30 ฟุต
  const L=f.blow_count!==''&&f.blow_count!=null?SOIL_LV[soilIdx(Number(f.blow_count))]:null;

  const doneIds=(()=>{const st=new Set(),un=[];const nz=x=>String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    doneIns.forEach(q=>{if(init&&init.id&&q.id===init.id)return;if(q.foreman_report_id!=null)st.add(String(q.foreman_report_id));else un.push(q);});
    un.forEach(q=>{const m=reports.find(r=>!st.has(String(r.id))&&String(r.drive_date).slice(0,10)===String(q.drive_date||'').slice(0,10)&&nz(r.size)===nz(q.pile_size)&&Math.abs(Number(r.length_m)-Number(q.pile_length_m))<0.011);if(m)st.add(String(m.id));});
    return st;})();
  const pickable=r=>showDone||String(r.id)===String(f.foreman_report_id)||!doneIds.has(String(r.id));
  const dayRows=reports.filter(r=>String(r.drive_date).slice(0,10)===f.drive_date);
  const dayDone=dayRows.filter(r=>doneIds.has(String(r.id))).length;
  const pickReport=id=>{
    const r=reports.find(x=>String(x.id)===String(id));
    if(!r){set('foreman_report_id',null);return;}
    setF(o=>({...o,foreman_report_id:r.id,pile_std:/รง|โรงงาน/.test(String(r.kind||''))?'fac':/มอก/.test(String(r.kind||''))?'tis':o.pile_std,customer:r.customer||o.customer,site:r.site||o.site,pile_size:PILE_SIZES.includes(String(r.size||'').toUpperCase())?String(r.size).toUpperCase():(r.size||o.pile_size),
      prod_dates:(()=>{const sg=String(r.segs||'').split('+').map(x=>parseFloat(x)).filter(x=>x>0);const n=Math.max(sg.length,String(r.prod_dates||'').split(',').filter(Boolean).length,1);
        const fc=String(r.cast_dates||'').split(/\s*[-–,]\s*/).map(x=>x.trim()).filter(Boolean);
        const pv=String(r.prod_dates||'').split(',').map(x=>x.trim());
        return Array.from({length:n},(_,i)=>{const ex=o.prod_dates[i]||{};return {date:pv[i]||ex.date||'',face:fc.length===n?fc[i]:(n===1?String(r.cast_dates||''):(fc[i]||'')),len:sg[i]?String(sg[i]):(n===1?'':'')};});})(),
      pile_length_m:r.length_m!=null?String(r.length_m):o.pile_length_m,drive_date:String(r.drive_date||'').slice(0,10)||o.drive_date}));
  };
  const pickBlow=id=>{
    const b=blows.find(x=>String(x.id)===String(id));
    if(!b){setF(o=>({...o,blow_id:null}));return;}
    setF(o=>({...o,blow_id:b.id,blow_site:b.site||'',blow_count:b.blows!=null?String(b.blows):'',blow_feet:b.feet||30}));

  const addFiles=e=>{

        strength_formula:f.strength_formula||'',strength_rows:rowsFor,
        drive_log:hasLog?{...logObj,set:dsF.set??null,per10:dsF.per10??null,qa_act:dsF.qaAct??null,total:dsF.total??null,shortfall:dsF.shortfall??null,dev_mag:dsF.dev??null}:{},
        blow_id:f.blow_id||null,blow_site:f.blow_site||null,blow_count:num(f.blow_count),blow_feet:num(f.blow_feet)||30,
        vertical_result:f.vertical_result||null,vertical_note:f.vertical_note||null,
        hammer_weight_t:num(f.hammer_weight_t),hammer_drop_cm:num(f.hammer_drop_cm),qa_ton:num(f.qa_ton),pile_weight_t:pileW,pile_area_cm2:pArea,hammer_ratio:ratio,blow_s_cm:bc?bc.S:null,blow_per10:bc?bc.per10:null,
        cause_note:f.cause_note||null,action_note:f.action_note||null,updated_at:new Date().toISOString()};
      let id=init&&init.id;
      if(id){const {error}=await DB.from('pile_fail_inspections').update(row).eq('id',id);if(error)throw error;}

  return <>
    <div className="topbar"><button onClick={onCancel} style={{background:'none',border:'none',color:'#fff',fontSize:22,cursor:'pointer'}}>‹</button>

    <div className="wrap">

      {secH('① ข้อมูลเสาและหน้างาน')}
      <div className="card" style={{marginTop:0}}>

          <div className="field" style={{flex:1}}><label>ขนาดเสา</label>

            <select value={f.pile_std||'tis'} onChange={e=>set('pile_std',e.target.value)}><option value="tis">มอก.</option><option value="fac">โรงงาน</option></select></div>

            <input type="number" inputMode="decimal" step="0.5" value={f.pile_length_m} onChange={e=>set('pile_length_m',e.target.value)}/></div>
        </div>
        <div className="field"><label>ท่อนของเสาต้นนี้ — ความยาว · วันที่หน้าเสา · วันที่ผลิตจริง (เสาต่อกัน กดเพิ่มท่อนได้)</label>
          {f.prod_dates.map((p,i)=><div key={i} style={{border:'1px solid var(--line)',borderRadius:12,padding:'8px 10px',marginBottom:8,background:'#fafbfd'}}>

              <div className="field" style={{flex:'0 0 30%',minWidth:0,marginBottom:0}}><label>ยาว (ม.)</label><input type="number" inputMode="decimal" step="0.5" value={p.len} onChange={e=>setPd(i,{len:e.target.value})}/></div>
              <div className="field" style={{flex:1,minWidth:0,marginBottom:0}}><label>วันที่หน้าเสา (อ้างอิง)</label><input type="text" placeholder="เช่น 7/10/69" value={p.face} onChange={e=>setPd(i,{face:e.target.value})}/></div></div>
            <div className="field" style={{marginTop:8,marginBottom:0}}><label>วันที่ผลิตจริง ★ (ใช้เทียบผลกำลังอัด/นับอายุ)</label><input type="date" value={p.date} onChange={e=>setPd(i,{date:e.target.value})}/></div>
            <div style={{marginTop:8,fontWeight:800,color:'var(--brand)',fontSize:14.5}}>อายุตอนตอก: {p.date&&f.drive_date?isoDiff(f.drive_date,p.date)+' วัน':'—'} <span className="hint" style={{fontWeight:400}}>ผลิตจริง → ตอกเฟล</span></div>
          </div>)}
          <div style={{display:'flex',gap:8}}>
            <button className="ghost" style={{padding:'9px',flex:1}} onClick={addPd}>＋ เพิ่มท่อน (ท่อนต่อ)</button>
            {f.prod_dates.length>1&&<button className="ghost" style={{padding:'9px',flex:1}} onClick={()=>setF(o=>({...o,prod_dates:[...o.prod_dates].reverse()}))}>⇅ สลับท่อนล่าง/บน</button>}</div>
          {lenMismatch&&<div className="hint" style={{color:'#b45309',marginTop:6}}>⚠️ ความยาวรวมท่อน {fmtN(sumLen,2)} ม. ไม่เท่าความยาวเสา {fmtN(Number(f.pile_length_m),2)} ม. — ตรวจอีกครั้ง</div>}</div>
        {pcs.length>1&&<div style={{padding:'10px 12px',borderRadius:10,background:'#f0fdfa',border:'1px solid #99f6e4',fontWeight:800,color:'var(--brand)'}}>ท่อนที่อ่อนที่สุด: {age!=null?age+' วัน':'—'} <span className="hint" style={{fontWeight:400}}>(ใช้เป็นอายุหลักของเสา)</span></div>}

      {secH('② กำลังอัดคอนกรีต 7 วัน — วันผลิต ± 3 วัน')}
      <div className="card" style={{marginTop:0}}>
        {!pcs.length&&<div className="hint">ใส่วันที่ผลิตก่อน ระบบจะดึงผลกำลังอัดวันนั้นกับก่อน/หลัง 3 วันมาเทียบให้ (หลายท่อนจะเทียบทุกท่อน)</div>}

        {pcs.length>0&&cr&&!cr.length&&<div className="hint" style={{color:'#b45309'}}>ไม่พบผลกำลังอัดช่วงวันผลิตในระบบ</div>}
        {cr&&cr.length>0&&<>
          <div className="field"><label>สูตรคอนกรีต</label>
            <select value={f.strength_formula} onChange={e=>set('strength_formula',e.target.value)}>
              <option value="">ทุกสูตร (ไม่รวม NP280)</option>{formulas.map(x=><option key={x}>{x}</option>)}</select></div>
          {pcs.map((p,pi)=>{const S=buildStrength(rowsFor,p.date),sum=strengthSummary(rowsFor,p.date,f.strength_formula);
            return <div key={pi} style={{marginTop:pi?14:0}}>
            {pcs.length>1&&<div style={{fontWeight:800,color:'var(--brand)',margin:'0 0 4px'}}>ท่อนที่ {pi+1} · ผลิต {thaiDate(p.date)}{p.len?' · '+p.len+' ม.':''}</div>}

              <thead><tr><th style={{padding:'5px 6px',textAlign:'left'}}>อายุ</th>{S.dates.map(d=><th key={d} style={{padding:'5px 3px',background:d===p.date?'#fde68a':'transparent',borderRadius:6,fontSize:12}}>{dm(d)}{d===p.date?'★':''}</th>)}<th style={{padding:'5px 6px',fontSize:12}}>เกณฑ์</th></tr></thead>
              <tbody>{S.ages.map(a=>{const tg=targetFor(f.strength_formula,a);return <tr key={a} style={{borderTop:'1px solid var(--line)'}}>
                <td style={{padding:'6px',fontWeight:700}}>{a}ว.</td>
                {S.dates.map(d=>{const c=S.cell(d,a);const low=c&&tg&&c.avg<tg;return <td key={d} style={{textAlign:'center',padding:'6px 3px',background:d===p.date?'#fffbeb':'transparent',color:low?'#c0392b':'inherit',fontWeight:d===p.date?800:500}}>{c?fmtN(c.avg):'–'}</td>;})}
                <td style={{textAlign:'center',color:'var(--muted)'}}>{tg||'–'}</td></tr>;})}</tbody></table></div>
            <div style={{marginTop:8,lineHeight:1.9}}>{sum.map(s=><div key={s.age} style={{fontSize:14}}>
              <b>{s.age} วัน:</b> วันผลิต {fmtN(s.prod)} {s.nb!=null&&<span className="hint">· เฉลี่ยวันข้างเคียง {fmtN(s.nb)} ({s.delta>=0?'+':''}{fmtN(s.delta)})</span>} {s.ok!=null&&chip(s.ok,s.ok?'ผ่านเกณฑ์ '+s.target:'ต่ำกว่า '+s.target)}</div>)}</div></div>;})}
        </>}
      </div>

      {secH('③ ชั้นดิน — นับ Blow 30 ฟุตสุดท้าย')}
      <div className="card" style={{marginTop:0}}>
        <div className="field"><label>เลือกรายการ Blow ที่โฟร์แมนส่งเข้ากลุ่ม (ถ้ามี)</label>
          <select value={f.blow_id||''} onChange={e=>pickBlow(e.target.value)}>
            <option value="">— กรอกเอง —</option>
            {blows.map(b=><option key={b.id} value={b.id}>{thaiDate(String(b.count_date).slice(0,10))} · {(b.site||'').slice(0,26)} · {b.blows} ครั้ง</option>)}
          </select></div>
        {inp('blow_site','หน่วยงานที่นับ (ถ้าต่างจากหน้างาน)')}
        <div className="field"><label>จำนวน Blow (ครั้ง / {f.blow_feet||30} ฟุต)</label>
          <input type="number" inputMode="numeric" value={f.blow_count} onChange={e=>set('blow_count',e.target.value)} placeholder="เช่น 358"/></div>
        {L?<div><span className="verdict" style={{background:L.bg,color:L.col}}>{L.e} {L.t}</span> <span className="hint">≤300 ดินอ่อน · 301–599 เฝ้าระวัง 1–3 · ≥600 ดินแข็ง</span></div>:<div className="hint">ใส่ค่า Blow แล้วระบบบอกระดับดินให้</div>}
      </div>

      {secH('④ ตุ้มและการตอก · รายการคำนวณ Blow')}
      <div className="card" style={{marginTop:0}}>
        <div style={{display:'flex',gap:8}}>
          <div className="field" style={{flex:1}}><label>น้ำหนักตุ้ม (ตัน)</label><input type="number" inputMode="decimal" step="0.1" value={f.hammer_weight_t} onChange={e=>set('hammer_weight_t',e.target.value)}/></div>
          <div className="field" style={{flex:1}}><label>ระยะยกตุ้ม (ซม.)</label><input type="number" inputMode="decimal" step="1" value={f.hammer_drop_cm} onChange={e=>set('hammer_drop_cm',e.target.value)}/></div>
        </div>
        <div style={{padding:'10px 12px',borderRadius:10,background:'#f8fafc',border:'1px solid var(--line)',lineHeight:1.8,fontSize:14}}>
          {!pArea||!len?<span className="hint">เลือกขนาดเสา มาตรฐาน และความยาวก่อน ระบบจะคำนวณน้ำหนักเสาให้ (จากหน้าตัดในแอปแบบเสาเข็ม)</span>:
            <>หน้าตัด {pKey} = {fmtN(pArea)} ซม.² × {fmtN(len,2)} ม. × {PILE_DENSITY} ตัน/ลบ.ม. → น้ำหนักเสา = <b>{fmtN(pileW,2)} ตัน</b></>}
        </div>
        {ratio!=null&&<div style={{marginTop:10,lineHeight:1.9}}>ตุ้ม ÷ เสา = <b>{fmtN(ratio,2)} เท่า</b> {chip(ratio>=HAMMER_MIN&&ratio<=HAMMER_MAX,ratio>=HAMMER_MIN&&ratio<=HAMMER_MAX?'อยู่ในเกณฑ์ '+HAMMER_MIN+'–'+HAMMER_MAX:ratio<HAMMER_MIN?'เบาเกินไป (<'+HAMMER_MIN+')':'หนักเกินไป (>'+HAMMER_MAX+')')}</div>}
        <div className="field" style={{marginTop:12}}><label>Qa ตามแบบ (ตัน) — ไว้คำนวณ Blow</label>
          <input type="number" inputMode="decimal" step="0.5" value={f.qa_ton} onChange={e=>set('qa_ton',e.target.value)} placeholder="เช่น 35"/></div>
        {bc&&<div style={{padding:'10px 12px',borderRadius:10,background:'#f0f9ff',border:'1px solid #bae6fd',lineHeight:1.8,fontSize:14}}>
          <b>รายการคำนวณ Blow (Danish)</b><br/>
          {bc.S>0?<>S = <b>{fmtN(bc.S,3)} ซม./ครั้ง</b> · ≈ <b>{fmtN(bc.per10,1)} ครั้ง/10 ซม.</b> · {fmtN(bc.per30,1)} ครั้ง/30 ซม.<br/>
            <span className="hint">E·W·H = {fmtN(bc.a,1)} · Qu = {fmtN(bc.Qu,1)} ตัน</span></>:<span style={{color:'#c0392b'}}>คำนวณไม่ได้ — พลังงานตุ้มน้อยกว่าที่ Qa ต้องการ</span>}</div>}
        <div className="field" style={{marginTop:12}}><label>เช็คดิ่งเสา</label>
          <div className="seg">
            <button className={f.vertical_result==='ok'?'on-pass':''} onClick={()=>set('vertical_result','ok')}>ผ่าน</button>
            <button className={f.vertical_result==='bad'?'on-fail':''} onClick={()=>set('vertical_result','bad')}>ไม่ผ่าน</button>
            <button className={f.vertical_result==='na'?'on-na':''} onClick={()=>set('vertical_result','na')}>ไม่ได้วัด</button></div></div>
        {inp('vertical_note','ค่าที่วัดได้ (ถ้ามี)',{placeholder:'เช่น เอียง 2 ซม. ที่ความสูง 1 ม.'})}
      </div>

      {secH('⑤ ใบบันทึกการตอก (ข้อมูลจริงหน้างาน)')}
      <div className="card" style={{marginTop:0}}>
        <div className="hint" style={{marginBottom:6}}>คัดตัวเลขจากใบ "Driving record" — ยิ่งครบ ระบบยิ่งวิเคราะห์สาเหตุได้แม่น (ไม่บังคับ)</div>
        <div className="field"><label>จำนวน Blow ต่อ 1 ฟุต (30 ซม.) เรียงจากฟุตที่ 1 — พิมพ์/วางตัวเลขเว้นวรรคได้</label>
          <textarea className="note" rows={3} placeholder="เช่น 4 6 6 8 7 8 10 11 11 12 13 15 …" value={f.log.blows} onChange={e=>setF(o=>({...o,log:{...o.log,blows:e.target.value}}))} style={{marginTop:0}}/></div>
        {logObj.blows.length>0&&<div style={{marginBottom:10}}>
          <div style={{fontSize:14,fontWeight:700,color:'var(--brand)'}}>{logObj.blows.length} ฟุต · รวม {dsF.total} ครั้ง <span className="hint" style={{fontWeight:400}}>(ใช้เป็นค่า Blow 30 ฟุตให้อัตโนมัติ)</span></div>
          <div style={{display:'flex',alignItems:'flex-end',gap:2,height:64,marginTop:6}}>{logObj.blows.map((v,i)=><div key={i} title={'ฟุตที่ '+(i+1)+': '+v} style={{flex:1,minWidth:3,background:i>=logObj.blows.length-3?'#c0392b':'#0f766e',height:Math.max(3,v/dsF.max*60),borderRadius:2}}/>)}</div>
          <div className="hint">ฟุตที่ 1 → {logObj.blows.length} · แท่งแดง = 3 ฟุตสุดท้าย · สูงสุด {dsF.max} ครั้ง/ฟุต</div></div>}
        <div className="field"><label>Last ten blow penetration (ซม.) — 3 ชุดสุดท้ายในใบ</label>
          <div style={{display:'flex',gap:8}}>{[0,1,2].map(i=><input key={i} type="number" inputMode="decimal" step="0.1" placeholder={'ชุด '+(i+1)} value={f.log.l10[i]} onChange={e=>setF(o=>({...o,log:{...o.log,l10:o.log.l10.map((x,j)=>j===i?e.target.value:x)}}))} style={{flex:1,minWidth:0}}/>)}</div></div>
        <div style={{display:'flex',gap:8}}>
          <div className="field" style={{flex:1,minWidth:0}}><label>ระดับหัวเสาจริง (ม.)</label><input type="number" inputMode="decimal" step="0.01" placeholder="+1.50" value={f.log.top} onChange={e=>setF(o=>({...o,log:{...o.log,top:e.target.value}}))}/></div>
          <div className="field" style={{flex:1,minWidth:0}}><label>ระดับปลายเสาจริง (ม.)</label><input type="number" inputMode="decimal" step="0.01" placeholder="-23.50" value={f.log.tip} onChange={e=>setF(o=>({...o,log:{...o.log,tip:e.target.value}}))}/></div>
          <div className="field" style={{flex:1,minWidth:0}}><label>ปลายเสาตามแบบ (ม.)</label><input type="number" inputMode="decimal" step="0.01" placeholder="-25.00" value={f.log.spec} onChange={e=>setF(o=>({...o,log:{...o.log,spec:e.target.value}}))}/></div></div>
        <div className="field"><label>หัวเสาเบี้ยว Deviation (ซม.) — ทิศ N / E / W / S</label>
          <div style={{display:'flex',gap:8}}>{['N','E','W','S'].map(k=><input key={k} type="number" inputMode="decimal" step="0.1" placeholder={k} value={f.log[k]} onChange={e=>setF(o=>({...o,log:{...o.log,[k]:e.target.value}}))} style={{flex:1,minWidth:0}}/>)}</div></div>
        {hasLog&&<div style={{padding:'10px 12px',borderRadius:10,background:'#f0f9ff',border:'1px solid #bae6fd',lineHeight:1.8,fontSize:14}}>
          {dsF.set!=null&&<div>set จริง (เฉลี่ย 10 ครั้งสุดท้าย) = <b>{fmtN(dsF.set,3)} ซม./ครั้ง</b> ≈ {fmtN(dsF.per10,1)} ครั้ง/10 ซม.{dsF.qaAct!=null&&<> → Qa ที่ตอกได้จริง ≈ <b>{fmtN(dsF.qaAct,1)} ตัน</b>{dsF.qaRatio!=null&&<span style={{color:dsF.qaRatio>=1?'#15803d':'#c0392b',fontWeight:700}}> ({fmtN(dsF.qaRatio,2)} เท่าของ Qa ตามแบบ)</span>}</>}</div>}
          {dsF.shortfall!=null&&<div>ปลายเสา {dsF.shortfall>0.05?<b style={{color:'#b45309'}}>ตื้นกว่าแบบ {fmtN(dsF.shortfall,2)} ม.</b>:'ถึงระดับตามแบบ'}</div>}
          {dsF.dev!=null&&<div>หัวเสาเบี้ยวรวม ≈ {fmtN(dsF.dev,1)} ซม. ทิศ {dsF.devDir||'–'}</div>}
          {dsF.set==null&&logObj.l10.length===0&&<div className="hint">ใส่ Last ten blow penetration เพื่อคำนวณ set จริงและ Qa ที่ตอกได้</div>}</div>}
      </div>

      {secH('⑥ รูปถ่ายตอนเสาเข็มแตก')}
      <div className="card" style={{marginTop:0}}>
        <label className="ghost" style={{display:'block',textAlign:'center',cursor:'pointer'}}>📷 ถ่าย/เลือกรูป
          <input type="file" accept="image/*" multiple capture="environment" style={{display:'none'}} onChange={addFiles}/></label>
        <div className="thumbs">
          {oldPhotos.map((u,i)=><div className="thumb" key={'o'+i}><img src={u} alt=""/><button onClick={()=>setOldPhotos(o=>o.filter((_,j)=>j!==i))}>×</button></div>)}
          {files.map((p,i)=><div className="thumb" key={'n'+i}><img src={p.preview} alt=""/><button onClick={()=>setFiles(o=>o.filter((_,j)=>j!==i))}>×</button></div>)}
        </div>
        <div className="hint" style={{marginTop:6}}>แนะนำถ่าย: รอยแตกใกล้ ๆ · ทั้งต้นเสา · หัวเสา/ปลายเสา · หน้างานรวม</div>
      </div>

      {secH('⑦ สรุป')}
      <div className="card" style={{marginTop:0}}>
        {(()=>{const an=analyze({...f,strength_rows:rowsFor,hammer_ratio:ratio,blow_s_cm:bc?bc.S:null,drive_log:logObj,pile_area_cm2:pArea,pile_length_m:len});const cl={ok:'#15803d',bad:'#c0392b',warn:'#b45309',info:'#475569'},ic2={ok:'✔',bad:'✘',warn:'⚠',info:'ℹ'};
          return <div>
            <div className="hint" style={{marginBottom:6}}>วิเคราะห์อัตโนมัติจากข้อมูลที่กรอก (ใช้เป็นแนวทาง ไม่ใช่ข้อสรุป):</div>
            <div style={{fontSize:14.5,fontWeight:800,lineHeight:1.6,color:an.nRisk?'#c0392b':'#15803d',marginBottom:6}}>{an.summary}</div>
            {[...an.risks,...an.oks,...an.infos].map((o,i)=><div key={i} style={{fontSize:14,lineHeight:1.8,color:cl[o.t]}}>{ic2[o.t]} {o.x}</div>)}
            <div style={{marginTop:6,fontSize:13.5,lineHeight:1.8,background:'#f0f9ff',border:'1px solid #bae6fd',borderRadius:10,padding:'8px 12px'}}><b>แนวทางตรวจ/แก้ต่อ</b>{an.checks.map((c,i)=><div key={i}>→ {c}</div>)}</div>
          </div>;})()}
        <div className="field" style={{marginTop:10}}><label>สาเหตุที่น่าจะเป็น (ความเห็นผู้ตรวจ)</label>
          <textarea className="note" rows={3} value={f.cause_note} onChange={e=>set('cause_note',e.target.value)} style={{marginTop:0}}/></div>
        <div className="field"><label>มาตรการ / สิ่งที่ต้องแก้ไข</label>
          <textarea className="note" rows={3} value={f.action_note} onChange={e=>set('action_note',e.target.value)} style={{marginTop:0}}/></div>
      </div>
      {err&&<div className="card" style={{color:'#c0392b',borderColor:'#f3b8b0',background:'#fdecea'}}>{err}</div>}
    </div>
    <div className="bottom"><div className="inner">
      <button className="ghost" style={{flex:'0 0 22%',padding:'12px 4px'}} onClick={onCancel}>ยกเลิก</button>
      <button className="ghost" style={{flex:'1 1 0',padding:'12px 4px',fontSize:13.5}} disabled={saving} onClick={()=>save(true)}>💾＋ บันทึก แล้วเพิ่มเสาเฟลอีกต้น</button>
      <button className="bigbtn" style={{flex:'1 1 0',padding:'14px 4px',fontSize:16}} disabled={saving} onClick={()=>save(false)}>{saving?'กำลังบันทึก…':'💾 บันทึกใบตรวจ'}</button>
    </div></div>
  </>;
}

function App(){
  const params=new URLSearchParams(location.search);
  const urlCode=(params.get('u')||'').trim().toLowerCase();
  // จำคนใช้ไว้ในเครื่อง — เปิดจากไอคอนหน้าจอโฮม (ที่ไม่มี ?u=) ก็เข้าชื่อเดิมได้เลย ไม่ต้องเลือกซ้ำ
  let saved='';
  try{ saved=(localStorage.getItem('qc_user')||'').trim().toLowerCase(); }catch(e){}
  const code=urlCode||saved;
  useEffect(()=>{
    if(urlCode){ try{ localStorage.setItem('qc_user',urlCode); }catch(e){} }
  },[urlCode]);

  const [inspectors,setInspectors]=useState(null);
  const [checklist,setChecklist]=useState(null);
  const [rafts,setRafts]=useState([]);   // แพผลิตจากระบบติดตามงาน
  const [elong,setElong]=useState([]);   // ค่ามาตรฐานระยะยืดของลวด ต่อแพ/ขนาดลวด
  const [err,setErr]=useState('');
  const failId=params.get('fail');
  const [formType,setFormType]=useState(failId?'fail':null);
  const [material,setMaterial]=useState(null);   // ใช้เฉพาะฟอร์มตรวจวัตถุดิบ
  const [preset,setPreset]=useState(null); // {raft, day, spec} ที่กดมาจากใบงานผลิต
  const [preListDay,setPreListDay]=useState(null); // จำวันที่ที่ดูอยู่ก่อนเข้าฟอร์ม

  useEffect(()=>{
    Promise.all([
      DB.from('qc_inspectors').select('*').eq('active',true).order('sort_order'),
      DB.from('qc_checklist').select('*').eq('active',true).order('form_type').order('sort_order'),
      DB.from('worktrack_raft_info').select('raft_num,pile_type,section').order('raft_num'),
      DB.from('qc_elongation_spec').select('*').order('raft_num').order('wire_mm'),
    ]).then(([a,b,r,e])=>{
      if(a.error||b.error){setErr('ยังไม่ได้สร้างตารางในฐานข้อมูล — ให้แอดมินรันไฟล์ supabase-qc.sql ก่อน');return;}
      setInspectors(a.data||[]); setChecklist(b.data||[]); setRafts((r&&r.data)||[]); setElong((e&&e.data)||[]);
    }).catch(()=>setErr('เชื่อมต่อฐานข้อมูลไม่ได้ — ตรวจอินเทอร์เน็ต'));
  },[]);

  if(err) return <div className="wrap"><div className="card" style={{marginTop:20,color:'#92400e',background:'#fffbeb',borderColor:'#fde68a',lineHeight:1.9}}>⚠️ {err}</div></div>;
  if(!inspectors) return <div className="wrap"><div className="card" style={{marginTop:20,color:'#78839a'}}>กำลังโหลด…</div></div>;

  const me=inspectors.find(x=>x.code===code);
  if(!me) return <PickUser inspectors={inspectors}/>;
  if(!formType) return <PickForm me={me} onPick={t=>{setFormType(t);setMaterial(null);}}/>;
  if(formType==='fail') return <FailInspectView me={me} openId={failId} onBack={()=>{setFormType(null);if(failId)history.replaceState(null,'',location.pathname+'?u='+(code||''));}}/>;
  if(formType==='plan') return <PlanView me={me} rafts={rafts} onBack={()=>setFormType(null)}
                                  onInspect={(n,day,spec,isChecked)=>{setPreset({raft:String(n),day,spec,isChecked});setFormType('pre');}}/>;
  if((formType==='pre'||formType==='post')&&!preset) return <PreListView me={me} rafts={rafts} formType={formType} initialDay={preListDay||undefined}
                                  onBack={()=>{setPreListDay(null);setFormType(null);}}
                                  onInspect={(n,day,spec,isChecked)=>{setPreListDay(day);setPreset({raft:String(n),day,spec,isChecked});}}/>;
  if(formType==='mat'&&!material){
    const mats=[...new Set(checklist.filter(c=>c.form_type==='mat').map(c=>c.section))].sort((x,y)=>x.localeCompare(y,'th'));
    return <PickMaterial me={me} mats={mats} onPick={setMaterial} onBack={()=>setFormType(null)}/>;
  }
  const list=checklist.filter(c=>c.form_type===formType&&(formType!=='mat'||c.section===material));
  return <CheckForm me={me} formType={formType} material={material} checklist={list} rafts={rafts} elong={elong} preset={preset}
                    onBack={()=>{
                      if(formType==='pre'||formType==='post'){setPreListDay(preset?.day||null);setPreset(null);}
                      else if(formType==='mat'){setPreset(null);setMaterial(null);}
                      else{setPreListDay(null);setPreset(null);setFormType(null);}
                    }}
                    onBackToList={(day)=>{setPreListDay(day||preset?.day||null);setPreset(null);}}/>;
}
