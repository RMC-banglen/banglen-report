<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>งาน QC — ร่วมมิตรคอนกรีต(บางเลน)</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#0f766e" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2733; --ink-soft:#42465a; --muted:#78839a; --line:#e6e8ee; --line-strong:#d6d8e0;
    --bg:#f4f6f9; --card:#fff; --ok:#0f766e; --okbg:#ecfdf5; --bad:#c0392b; --badbg:#fdecea;
    --na:#94a3b8; --nabg:#f1f5f9; --brand:#0f766e;
    --font:'Noto Sans Thai',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);font-family:var(--font);color:var(--ink);font-size:16px;
       padding-bottom:env(safe-area-inset-bottom)}
  button,input,select,textarea{font-family:inherit;font-size:16px}
  .wrap{max-width:720px;margin:0 auto;padding:0 12px 120px}
  .topbar{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
          padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
  .topbar .who{font-weight:800;font-size:18px}
  .topbar .sub{font-size:12.5px;opacity:.85}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
  .sec{font-size:13px;font-weight:800;color:var(--brand);margin:18px 0 6px;letter-spacing:.3px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .item.bad{border-color:#f3b8b0;background:var(--badbg)}
  .item.ok{border-color:#a7e3d4}
  .lbl{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:4px}
  .spec{font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:11px 0;border-radius:10px;border:1.5px solid var(--line-strong);
              background:#fff;color:var(--ink-soft);font-weight:700;font-size:14.5px;cursor:pointer}
  .seg button.on-pass{background:var(--ok);border-color:var(--ok);color:#fff}
  .seg button.on-fail{background:var(--bad);border-color:var(--bad);color:#fff}
  .seg button.on-na{background:var(--na);border-color:var(--na);color:#fff}
  .numrow{display:flex;gap:8px;align-items:center}
  .numrow input{flex:1;padding:11px 12px;border:1.5px solid var(--line-strong);border-radius:10px;text-align:right;font-weight:700}
  .unit{font-size:14px;color:var(--muted);min-width:34px}
  .verdict{font-size:13px;font-weight:800;padding:4px 10px;border-radius:8px;white-space:nowrap}
  .v-ok{background:var(--okbg);color:var(--ok)} .v-bad{background:var(--badbg);color:var(--bad)}
  .note{width:100%;margin-top:8px;padding:9px 11px;border:1.5px solid var(--line-strong);border-radius:10px;font-size:14.5px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
  .field input,.field select{width:100%;padding:11px 12px;border:1.5px solid var(--line-strong);border-radius:10px}
  .bigbtn{width:100%;padding:16px;border:none;border-radius:14px;background:var(--brand);color:#fff;
          font-size:17px;font-weight:800;cursor:pointer}
  .bigbtn[disabled]{background:#cbd5e1;color:#8b94a5}
  .ghost{width:100%;padding:13px;border:1.5px solid var(--line-strong);border-radius:12px;background:#fff;
         color:var(--ink-soft);font-size:15px;font-weight:700;cursor:pointer}
  .bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
          padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:30}
  .bottom .inner{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .pill{padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .thumb{position:relative}
  .thumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
                border:none;background:var(--bad);color:#fff;font-size:13px;line-height:1;cursor:pointer}
  .hint{font-size:13px;color:var(--muted);line-height:1.8}
  .big{font-size:26px;font-weight:800}
</style>
</head>
<body>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef} = React;

const FORMS = {
  pre:  {label:'ตรวจก่อนผลิต', full:'ระบบตรวจสอบก่อนผลิตเสาเข็มคอนกรีตอัดแรง ตาม มอก.396-2549', icon:'🧰'},
  post: {label:'ตรวจหลังผลิต', full:'ระบบตรวจสอบหลังผลิตเสาเข็ม ตาม มอก.396-2549', icon:'📏'},
  mat:  {label:'ตรวจสอบวัตถุดิบ', full:'ตรวจรับวัตถุดิบเข้าโรงงาน — ปูน ลวด เหล็ก น้ำยา', icon:'📦'},
};
const todayISO = () => {
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
// ชื่อไทยขึ้นต้นด้วยสระหน้า (เ แ โ ใ ไ) เช่น ไผ่/เอิร์ธ ต้องข้ามไปเอาพยัญชนะ ไม่งั้นวงกลมจะขึ้น ไ เฉยๆ
const thaiInitial = name => {
  const t=String(name||'').trim();
  return (t.length>1 && /[เแโใไ]/.test(t[0])) ? t[1] : t.slice(0,1);
};
const thaiDate = iso => {
  if(!iso) return '';
  const [y,m,d]=String(iso).split('-');
  return `${Number(d)}/${Number(m)}/${Number(y)+543}`;
};

// ย่อรูปก่อนอัป — มือถือถ่ายมา 3-5MB ถ้าอัปดิบจะช้าและเปลือง bandwidth
function compressImage(file){
  return new Promise(resolve=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(u);
      const MAX=900, scale=Math.min(1,MAX/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(resolve,'image/jpeg',0.78);
    };
    img.onerror=()=>resolve(null);
    img.src=u;
  });
}

// ตัดสินหัวข้อแบบกรอกค่า: อยู่ในช่วง min–max หรือไม่ (ว่างข้างไหน = ไม่จำกัดข้างนั้น)
function judgeNum(v,min,max){
  if(v===''||v==null) return null;
  const n=Number(v);
  if(!isFinite(n)) return null;
  if(min!=null && n<Number(min)) return false;
  if(max!=null && n>Number(max)) return false;
  return true;
}

function App(){
  const params=new URLSearchParams(location.search);
  const code=(params.get('u')||'').trim().toLowerCase();

  const [inspectors,setInspectors]=useState(null);
  const [checklist,setChecklist]=useState(null);
  const [err,setErr]=useState('');
  const [formType,setFormType]=useState(null);
  const [material,setMaterial]=useState(null);   // ใช้เฉพาะฟอร์มตรวจวัตถุดิบ

  useEffect(()=>{
    Promise.all([
      DB.from('qc_inspectors').select('*').eq('active',true).order('sort_order'),
      DB.from('qc_checklist').select('*').eq('active',true).order('form_type').order('sort_order'),
    ]).then(([a,b])=>{
      if(a.error||b.error){setErr('ยังไม่ได้สร้างตารางในฐานข้อมูล — ให้แอดมินรันไฟล์ supabase-qc.sql ก่อน');return;}
      setInspectors(a.data||[]); setChecklist(b.data||[]);
    }).catch(()=>setErr('เชื่อมต่อฐานข้อมูลไม่ได้ — ตรวจอินเทอร์เน็ต'));
  },[]);

  if(err) return <div className="wrap"><div className="card" style={{marginTop:20,color:'#92400e',background:'#fffbeb',borderColor:'#fde68a',lineHeight:1.9}}>⚠️ {err}</div></div>;
  if(!inspectors) return <div className="wrap"><div className="card" style={{marginTop:20,color:'#78839a'}}>กำลังโหลด…</div></div>;

  const me=inspectors.find(x=>x.code===code);
  if(!me) return <PickUser inspectors={inspectors}/>;
  if(!formType) return <PickForm me={me} onPick={t=>{setFormType(t);setMaterial(null);}}/>;
  if(formType==='mat'&&!material){
    const mats=[...new Set(checklist.filter(c=>c.form_type==='mat').map(c=>c.section))].sort((x,y)=>x.localeCompare(y,'th'));
    return <PickMaterial me={me} mats={mats} onPick={setMaterial} onBack={()=>setFormType(null)}/>;
  }
  const list=checklist.filter(c=>c.form_type===formType&&(formType!=='mat'||c.section===material));
  return <CheckForm me={me} formType={formType} material={material} checklist={list}
                    onBack={()=>formType==='mat'?setMaterial(null):setFormType(null)}/>;
}

// เปิดลิงก์ผิด/ไม่มี ?u= → ให้เลือกชื่อ แล้วจำไว้ในเครื่อง
function PickUser({inspectors}){
  return <>
    <div className="topbar"><div><div className="who">งาน QC</div><div className="sub">เลือกชื่อของคุณ</div></div></div>
    <div className="wrap">
      <div className="card" style={{marginTop:16}}>
        <div className="hint" style={{marginBottom:12}}>ลิงก์นี้ยังไม่ได้ระบุชื่อผู้ตรวจ — เลือกชื่อแล้วบันทึกลิงก์ของตัวเองไว้ใช้ครั้งต่อไป</div>
        {inspectors.map(i=>(
          <a key={i.code} href={'?u='+i.code} style={{display:'block',textDecoration:'none',marginBottom:10}}>
            <div className="ghost" style={{textAlign:'center',color:'var(--brand)'}}>{i.name}</div>
          </a>
        ))}
      </div>
    </div>
  </>;
}

function PickForm({me,onPick}){
  return <>
    <div className="topbar">
      <div style={{width:38,height:38,borderRadius:'50%',background:'rgba(255,255,255,.22)',
                   display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:17}}>
        {thaiInitial(me.name)}
      </div>
      <div><div className="who">{me.name}</div><div className="sub">งานตรวจสอบคุณภาพ</div></div>
    </div>
    <div className="wrap">
      <div className="hint" style={{margin:'16px 2px 4px'}}>เลือกงานที่จะตรวจ</div>
      {Object.entries(FORMS).map(([k,f])=>(
        <button key={k} onClick={()=>onPick(k)} className="card"
          style={{width:'100%',textAlign:'left',cursor:'pointer',border:'1px solid var(--line)'}}>
          <div style={{fontSize:30,marginBottom:6}}>{f.icon}</div>
          <div style={{fontSize:19,fontWeight:800,color:'var(--brand)'}}>{f.label}</div>
          <div className="hint" style={{marginTop:3}}>{f.full}</div>
        </button>
      ))}
    </div>
  </>;
}

function PickMaterial({me,mats,onPick,onBack}){
  return <>
    <div className="topbar">
      <button onClick={onBack} style={{background:'rgba(255,255,255,.2)',border:'none',color:'#fff',
        borderRadius:10,padding:'7px 11px',fontSize:16,cursor:'pointer'}}>←</button>
      <div><div className="who">ตรวจสอบวัตถุดิบ</div><div className="sub">{me.name} · เลือกวัตถุดิบที่รับเข้า</div></div>
    </div>
    <div className="wrap">
      {mats.map(m=>(
        <button key={m} onClick={()=>onPick(m)} className="card"
          style={{width:'100%',textAlign:'left',cursor:'pointer',fontSize:16.5,fontWeight:700,color:'var(--brand)'}}>
          📦 {m}
        </button>
      ))}
      {!mats.length&&<div className="card" style={{marginTop:16,color:'#92400e',background:'#fffbeb',borderColor:'#fde68a',lineHeight:1.9}}>
        ⚠️ ยังไม่มีหัวข้อตรวจวัตถุดิบ — ให้แอดมินรันไฟล์ supabase-qc-materials.sql ก่อน
      </div>}
    </div>
  </>;
}

function CheckForm({me,formType,material,checklist,onBack}){
  const F=FORMS[formType];
  const isPre=formType==='pre';
  const isMat=formType==='mat';
  const [head,setHead]=useState(()=>({
    check_date: todayISO(), bed_no:'', lot_no:'', pile_spec:'', qty:'', supplier:'',
  }));
  const [vals,setVals]=useState({});        // itemId -> {yn, num, note}
  const [files,setFiles]=useState([]);      // {id, file, url}
  const [saving,setSaving]=useState(false);
  const [done,setDone]=useState(null);
  const fileRef=useRef(null);

  // จำค่าหัวเรื่องล่าสุดของคนนี้ไว้ กรอกครั้งต่อไปไม่ต้องพิมพ์ซ้ำ
  const memKey='qc_last_'+me.code+'_'+formType+(material?'_'+material:'');
  useEffect(()=>{
    try{
      const m=JSON.parse(localStorage.getItem(memKey)||'null');
      if(m) setHead(h=>({...h,pile_spec:m.pile_spec||'',bed_no:m.bed_no||'',supplier:m.supplier||''}));
    }catch(e){}
  },[memKey]);

  const set=(id,patch)=>setVals(v=>({...v,[id]:{...(v[id]||{}),...patch}}));
  const itemOk=it=>{
    const v=vals[it.id]||{};
    if(it.kind==='num') return judgeNum(v.num,it.min_val,it.max_val);
    return v.yn==null||v.yn==='na' ? (v.yn==='na'?true:null) : v.yn==='pass';
  };
  const answered=checklist.filter(it=>{const v=vals[it.id]||{};return it.kind==='num'?(v.num!==''&&v.num!=null):!!v.yn;});
  const failed=checklist.filter(it=>itemOk(it)===false);
  const allAnswered=answered.length===checklist.length;

  const passAll=()=>{
    const next={...vals};
    checklist.forEach(it=>{ if(it.kind==='yn') next[it.id]={...(next[it.id]||{}),yn:'pass'}; });
    setVals(next);
  };

  const addFiles=e=>{
    const list=Array.from(e.target.files||[]);
    setFiles(f=>[...f,...list.map(file=>({id:Math.random().toString(36).slice(2),file,url:URL.createObjectURL(file)}))]);
    e.target.value='';
  };

  const submit=async()=>{
    if(!allAnswered){
      if(!window.confirm('ยังตอบไม่ครบ ('+answered.length+'/'+checklist.length+' ข้อ) — ส่งเลยไหม?')) return;
    }
    setSaving(true);
    try{
      const result=failed.length?'fail':'pass';
      const {data,error}=await DB.from('qc_checks').insert({
        form_type:formType, inspector_code:me.code, check_date:head.check_date,
        bed_no:head.bed_no||'', lot_no:head.lot_no||'', pile_spec:head.pile_spec||'',
        material:material||'', supplier:head.supplier||'',
        qty:Number(head.qty)||0, result, fail_count:failed.length, note:''
      }).select().single();
      if(error) throw error;
      const checkId=data.id;

      const rows=checklist.map(it=>{
        const v=vals[it.id]||{};
        const ok=itemOk(it);
        return {check_id:checkId,item_id:it.id,label:it.label,section:it.section,kind:it.kind,
                value_yn:it.kind==='yn'?(v.yn||null):null,
                value_num:it.kind==='num'&&v.num!==''&&v.num!=null?Number(v.num):null,
                unit:it.unit||'', ok:ok, note:v.note||''};
      });
      if(rows.length) await DB.from('qc_check_items').insert(rows);

      for(const f of files){
        const blob=await compressImage(f.file);
        if(!blob) continue;
        const path='qc/'+checkId+'/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';
        const {error:upErr}=await DB.storage.from('quality-images')
          .upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
        if(upErr) continue;
        const {data:{publicUrl}}=DB.storage.from('quality-images').getPublicUrl(path);
        await DB.from('qc_check_images').insert({check_id:checkId,image_url:publicUrl});
      }

      try{localStorage.setItem(memKey,JSON.stringify({pile_spec:head.pile_spec,bed_no:head.bed_no,supplier:head.supplier}));}catch(e){}
      setDone({result,failed:failed.map(f=>f.label),id:checkId});
    }catch(e){
      alert('บันทึกไม่สำเร็จ: '+(e.message||e));
    }finally{ setSaving(false); }
  };

  if(done) return <Done me={me} done={done} onNew={()=>{setDone(null);setVals({});setFiles([]);}} onBack={onBack}/>;

  // จัดกลุ่มตาม section
  const groups=[];
  checklist.forEach(it=>{
    const g=groups.find(x=>x.name===it.section);
    if(g) g.items.push(it); else groups.push({name:it.section,items:[it]});
  });

  return <>
    <div className="topbar">
      <button onClick={onBack} style={{background:'rgba(255,255,255,.2)',border:'none',color:'#fff',
        borderRadius:10,padding:'7px 11px',fontSize:16,cursor:'pointer'}}>←</button>
      <div><div className="who">{material||F.label}</div><div className="sub">{me.name} · {thaiDate(head.check_date)}</div></div>
    </div>

    <div className="wrap">
      <div className="card">
        <div className="field">
          <label>วันที่ตรวจ</label>
          <input type="date" value={head.check_date} onChange={e=>setHead(h=>({...h,check_date:e.target.value}))}/>
        </div>
        {isMat ? <>
          <div className="field"><label>ผู้ขาย / ผู้ส่ง</label>
            <input value={head.supplier} placeholder="ชื่อร้าน/บริษัท" onChange={e=>setHead(h=>({...h,supplier:e.target.value}))}/></div>
          <div className="field"><label>เลขที่ใบส่งของ</label>
            <input value={head.lot_no} placeholder="เช่น DO-1234" onChange={e=>setHead(h=>({...h,lot_no:e.target.value}))}/></div>
        </> : <>
          {isPre
            ? <div className="field"><label>แพ/เบด ที่ตรวจ</label>
                <input value={head.bed_no} placeholder="เช่น แพ 6" onChange={e=>setHead(h=>({...h,bed_no:e.target.value}))}/></div>
            : <div className="field"><label>ล็อต/เลขที่ผลิต</label>
                <input value={head.lot_no} placeholder="เช่น L-0915" onChange={e=>setHead(h=>({...h,lot_no:e.target.value}))}/></div>}
          <div className="field"><label>ขนาดเสา</label>
            <input value={head.pile_spec} placeholder="เช่น I-0.26 x 12.00 ม." onChange={e=>setHead(h=>({...h,pile_spec:e.target.value}))}/></div>
          <div className="field"><label>จำนวนที่ตรวจ (ต้น)</label>
            <input type="number" inputMode="numeric" value={head.qty} onChange={e=>setHead(h=>({...h,qty:e.target.value}))}/></div>
        </>}
      </div>

      <button onClick={passAll} className="ghost" style={{marginTop:12,color:'var(--ok)',borderColor:'#a7e3d4'}}>
        ✓ ติ๊กผ่านทั้งหมด แล้วแก้เฉพาะข้อที่มีปัญหา
      </button>

      {groups.map(g=>(
        <div key={g.name}>
          <div className="sec">{g.name}</div>
          {g.items.map(it=>{
            const v=vals[it.id]||{}, ok=itemOk(it);
            return <div key={it.id} className={'item '+(ok===false?'bad':ok===true?'ok':'')}>
              <div className="lbl">{it.label}</div>
              {it.spec_text&&<div className="spec">เกณฑ์: {it.spec_text}</div>}
              {it.kind==='yn'
                ? <div className="seg">
                    {[['pass','ผ่าน','on-pass'],['fail','ไม่ผ่าน','on-fail'],['na','ไม่เกี่ยว','on-na']].map(([k,l,cls])=>(
                      <button key={k} className={v.yn===k?cls:''} onClick={()=>set(it.id,{yn:k})}>{l}</button>
                    ))}
                  </div>
                : <div className="numrow">
                    <input type="number" step="any" inputMode="decimal" placeholder="ค่าที่วัดได้"
                      value={v.num??''} onChange={e=>set(it.id,{num:e.target.value})}/>
                    <span className="unit">{it.unit}</span>
                    {ok!=null&&<span className={'verdict '+(ok?'v-ok':'v-bad')}>{ok?'ผ่าน':'ไม่ผ่าน'}</span>}
                  </div>}
              {ok===false&&<input className="note" placeholder="ระบุปัญหา / สิ่งที่ต้องแก้"
                value={v.note||''} onChange={e=>set(it.id,{note:e.target.value})}/>}
            </div>;
          })}
        </div>
      ))}

      <div className="sec">รูปถ่าย</div>
      <div className="card">
        <input ref={fileRef} type="file" accept="image/*" capture="environment" multiple
               style={{display:'none'}} onChange={addFiles}/>
        <button className="ghost" onClick={()=>fileRef.current&&fileRef.current.click()}>📷 ถ่ายรูป / เลือกรูป</button>
        {files.length>0&&<div className="thumbs">
          {files.map(f=>(
            <div key={f.id} className="thumb">
              <img src={f.url}/>
              <button onClick={()=>setFiles(x=>x.filter(y=>y.id!==f.id))}>✕</button>
            </div>
          ))}
        </div>}
      </div>
    </div>

    <div className="bottom">
      <div className="inner">
        <span className="pill" style={{background:failed.length?'var(--badbg)':'var(--nabg)',
          color:failed.length?'var(--bad)':'var(--muted)'}}>
          {answered.length}/{checklist.length}{failed.length?' · ไม่ผ่าน '+failed.length:''}
        </span>
        <button className="bigbtn" style={{flex:1}} disabled={saving||answered.length===0} onClick={submit}>
          {saving?'กำลังบันทึก…':'ส่งผลตรวจ'}
        </button>
      </div>
    </div>
  </>;
}

function Done({me,done,onNew,onBack}){
  const bad=done.result==='fail';
  return <>
    <div className="topbar"><div><div className="who">{bad?'บันทึกแล้ว — พบข้อบกพร่อง':'บันทึกแล้ว'}</div>
      <div className="sub">{me.name}</div></div></div>
    <div className="wrap">
      <div className="card" style={{marginTop:16,textAlign:'center',
        background:bad?'var(--badbg)':'var(--okbg)',borderColor:bad?'#f3b8b0':'#a7e3d4'}}>
        <div style={{fontSize:44}}>{bad?'⚠️':'✅'}</div>
        <div className="big" style={{color:bad?'var(--bad)':'var(--ok)',marginTop:4}}>
          {bad?'ไม่ผ่าน '+done.failed.length+' ข้อ':'ผ่านทั้งหมด'}
        </div>
        <div className="hint" style={{marginTop:6}}>ใบตรวจเลขที่ #{done.id}</div>
      </div>
      {bad&&<div className="card">
        <div style={{fontWeight:700,marginBottom:8,color:'var(--bad)'}}>ข้อที่ไม่ผ่าน</div>
        {done.failed.map((l,i)=><div key={i} style={{fontSize:14.5,lineHeight:1.9}}>• {l}</div>)}
      </div>}
      <button className="bigbtn" style={{marginTop:14}} onClick={onNew}>ตรวจใบใหม่</button>
      <button className="ghost" style={{marginTop:10}} onClick={onBack}>เปลี่ยนงานตรวจ</button>
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
