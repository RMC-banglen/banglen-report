// จำนวนทศนิยมของแต่ละหมวดวัสดุ — คิดจาก key เช่น 'main:plate:0.22'
// เพลท / หนวดกุ้ง / PC.wire / ปลอก = 2 ตำแหน่ง | Collar / เหล็กเสริม = ไม่มีทศนิยม
const MAT_DIGITS = {
  plate: 2, whisker: 2, stirrup: 2,
  pc: 2, pc4: 2, pc5: 2, pc7: 2,
  collar: 0, rebar: 0, rebarExtra: 0,
};
function digitsForKey(key) {
  const cat = String(key || '').split(':')[1];
  return MAT_DIGITS[cat] ?? 1;
}

// แยกสเปคเหล็กเส้น "DB12x10.00 ม." → { pre:'DB', diam:12, len:10 }
function parseRebarSpec(spec) {
  const m = String(spec || '').match(/^([A-Za-z]*)\s*([\d.]+)\s*[xX×]\s*([\d.]+)/);
  if (!m) return { pre: 'ZZ', diam: 9999, len: 9999, ok: false };
  return { pre: m[1].toUpperCase(), diam: parseFloat(m[2]), len: parseFloat(m[3]), ok: true };
}

// เรียง: ชนิด (DB/RB) → ขนาด (12, 16, …) → ความยาว น้อยไปมาก
function sortRebarBySpec(list, getSpec) {
  return [...list].sort((a, b) => {
    const A = parseRebarSpec(getSpec(a)), B = parseRebarSpec(getSpec(b));
    return A.pre.localeCompare(B.pre) || A.diam - B.diam || A.len - B.len;
  });
}

// ทำเครื่องหมายแถวแรกของแต่ละขนาด เพื่อขีดเส้นคั่นให้ดูง่าย
function markRebarGroups(rows) {
  let prev = null;
  rows.forEach(row => {
    const p = parseRebarSpec(row.label);
    const key = p.pre + p.diam;
    row.groupStart = prev !== null && key !== prev;
    row.groupLabel = p.ok ? p.pre + p.diam : null;
    prev = key;
  });
  return rows;
}

function fmt(n, digits) {
  if (n == null || !isFinite(n)) return '-';
  return n.toLocaleString('th-TH', { minimumFractionDigits: digits ?? 1, maximumFractionDigits: digits ?? 1 });

function parseFmtNum(str) {
  if (str == null || str === '' || str === '-') return null;
  const n = parseFloat(String(str).replace(/[+,%]/g, ''));

}

function Modal({ onClose, children }) {
  // หน้านี้ถูกฝังในหน้าแม่ผ่าน iframe แบบยืดความสูงเต็มเนื้อหา (ไม่มีสกรอลล์ในตัวเอง หน้าแม่เลื่อนแทน)
  // ทำให้ position:fixed ปกติอ้างอิงความสูงทั้งหมดของ iframe แทนที่จะเป็นจอที่มองเห็นจริง
  // (เดิมเคยลองสั่งเลื่อนหน้าแม่ไปหากล่องครั้งเดียว แต่ชนกับเนื้อหาที่ยังโตขึ้นระหว่างนั้นพอดี ทำให้กล่องขยับหนีไปเรื่อยๆ)
  // แก้ใหม่: ให้กล่องคำนวณ "ส่วนที่มองเห็นจริง" ของ iframe จากหน้าแม่ แล้วตามตำแหน่งนั้นตลอดเวลาแทน (เหมือน sticky ตามการเลื่อนจอ) ไม่แย่งเลื่อนจอผู้ใช้
  const [viewport, setViewport] = useState(null); // { top, height } เป็นพิกัดภายใน iframe เอง ของส่วนที่ผู้ใช้มองเห็นอยู่ตอนนี้
  useEffect(() => {
    let fe, parentWin;
    try { fe = window.frameElement; parentWin = window.parent; } catch (e) { return; }
    if (!fe || !parentWin || parentWin === window) return; // ไม่ได้ฝังใน iframe (เช่นเปิดไฟล์นี้ตรงๆ) ใช้ fixed ปกติได้เลย
    const update = () => {
      try {
        const frameRect = fe.getBoundingClientRect(); // ตำแหน่ง iframe บนจอจริงตอนนี้ (คิดรวมสกรอลล์ของหน้าแม่แล้ว)
        const top = Math.max(0, -frameRect.top);
        const height = Math.min(parentWin.innerHeight - Math.max(0, frameRect.top), fe.clientHeight - top);
        if (height > 100) setViewport({ top, height });
      } catch (e) {}
    };
    update();
    parentWin.addEventListener('scroll', update, { passive: true });
    parentWin.addEventListener('resize', update);
    // เผื่อ iframe ยังโตขึ้นระหว่างเปิด modal (เช่นตารางข้อมูลกำลังคำนวณ) แต่หน้าแม่ปรับความสูง iframe ตามทุก 400ms เท่านั้น
    const iv = setInterval(update, 200);
    return () => { parentWin.removeEventListener('scroll', update); parentWin.removeEventListener('resize', update); clearInterval(iv); };
  }, []);
  const overlayStyle = viewport
    ? { position: 'absolute', top: viewport.top, left: 0, right: 0, height: viewport.height, zIndex: 200, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center' }
    : { position: 'fixed', inset: 0, zIndex: 200, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center' };
  const maxBoxHeight = viewport ? Math.max(200, viewport.height * 0.85) : '80vh';
  return (
    <div style={overlayStyle} onClick={onClose}>
      <div style={{ background: 'white', borderRadius: 14, boxShadow: '0 20px 60px rgba(0,0,0,0.25)', padding: 26, display: 'flex', flexDirection: 'column', gap: 14, width: 560, maxWidth: '90vw', maxHeight: maxBoxHeight, overflow: 'auto', textAlign: 'left' }} onClick={e => e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
}

const inp = (w, right) => ({ width: w || undefined, textAlign: right ? 'right' : 'left', padding: '8px 10px', borderRadius: 6, border: '1px solid #d8dde6', fontFamily: 'inherit', fontSize: 14 });

  // โชว์แบบมีลูกน้ำ+ทศนิยมตรงกับคอลัมน์คำนวณ (row.actualFmt) เฉพาะตอนไม่ได้โฟกัส — ตอนพิมพ์ให้เห็นเลขดิบ พิมพ์ง่าย ไม่ต้องกังวลลูกน้ำ
  const [focused, setFocused] = React.useState(false);

    pcWireKgPerM: null, pcWireTable: null, stirrupTable: null, stirrupWireMm: null, plateThicknessMm: null,
    pileAreaM2: {},   // พื้นที่หน้าตัดเสาแต่ละขนาด (ตร.ม.) — ใช้คำนวณคิว
    concreteMix: { rock34: 940, rock1: 330, sand: 765, cement: 325, cementAlt: 280, sandAlt: 822 },   // สูตรคอนกรีต (กก./ม³) — ใช้คิดหิน/ทราย/ปูนจากคิวผลิต
    // cementAlt/sandAlt = สูตรพิเศษ (เฉพาะ I-18/S-18 ท่อนเดียว) — ปูนและทรายต่างจากสูตรปกติ ส่วนหินใช้อัตราเดิม
    plateBigSheetKg: { 6: 438, 8: 584, 9: 657 },

  };

  persistKeys = ['result', 'rawRows', 'fileName', 'actual', 'stock', 'plateStockDiam', 'generalUseEntries', 'plateGeneralUseEntries',
    'periodLabel', 'periods', 'periodHistory', 'periodLocked', 'periodSummaries', 'extraRebarItems', 'alertThresholdPct', 'alertThresholdByCategory',
    'rebarWeights', 'plateWeights', 'whiskerWeights', 'whiskerSpecs', 'pcWireKgPerM', 'pcWireTable', 'stirrupTable', 'stirrupWireMm', 'plateThicknessMm',

  async componentDidMount() {
    PC = await waitForPileCalc();

    this.setState({
      rebarWeights: { ...PC.REBAR_WEIGHT_PER_M }, plateWeights: { ...PC.PLATE_WEIGHT_PER_PIECE },
      whiskerWeights: { ...PC.WHISKER_WEIGHT_PER_PIECE },
      whiskerSpecs: Object.fromEntries(Object.keys(PC.WHISKER_WEIGHT_PER_PIECE).map(k => [k, PC.WHISKER_REBAR_SPEC[k] || ''])),

    await this.loadFromSupabase();
    this._lastSavedSnapshot = JSON.stringify(this.persistKeys.map(k => this.state[k]));
    this._persistReady = true;
  }
  applyPersistedObj(saved) {
    if (!saved) return;
    const patch = {};
    this.persistKeys.forEach(k => { if (saved[k] !== undefined) patch[k] = saved[k]; });
    if (patch.periodLabel === 'งวดปัจจุบัน') patch.periodLabel = null;
    this.setState(patch);
  }
  async loadFromSupabase() {
    try {
      this.setState({ syncStatus: 'loading' });
      const { data, error } = await DB.from('pile_materials_state').select('data').eq('id', PILE_STATE_ROW_ID).maybeSingle();
      if (error) throw error;
      if (data && data.data) this.applyPersistedObj(data.data);
      this.setState({ syncStatus: 'synced' });
    } catch (e) {
      console.warn('โหลดข้อมูลจาก Supabase ไม่สำเร็จ', e);
      this.setState({ syncStatus: 'offline' });
    }
  }
  savePersisted() {
    if (READONLY) return;
    const out = {};
    this.persistKeys.forEach(k => { out[k] = this.state[k]; });
    this._lastSavedSnapshot = JSON.stringify(this.persistKeys.map(k => out[k]));
    this.setState({ syncStatus: 'saving' });
    DB.from('pile_materials_state').upsert({ id: PILE_STATE_ROW_ID, data: out, updated_at: new Date().toISOString() })
      .then(({ error }) => { if (error) throw error; this.setState({ syncStatus: 'synced' }); })
      .catch(e => { console.warn('บันทึกขึ้น Supabase ไม่สำเร็จ', e); this.setState({ syncStatus: 'offline' }); });
  }
  componentDidUpdate() {
    if (!this._persistReady) return;
    const snapshot = JSON.stringify(this.persistKeys.map(k => this.state[k]));
    if (snapshot === this._lastSavedSnapshot) return;
    clearTimeout(this._saveTimer);
    this._saveTimer = setTimeout(() => this.savePersisted(), 600);
  }

  setAlertThresholdCategory(k, v) { if (READONLY) return; this.setState(s => ({ alertThresholdByCategory: { ...s.alertThresholdByCategory, [k]: v === '' ? null : Number(v) } })); }
  getThresholdFor(k) { const v = this.state.alertThresholdByCategory[k]; return (v == null || v === '') ? (this.state.alertThresholdPct || Infinity) : v; }
  toggleCurrentPeriodLock() { if (READONLY) return; this.setState(s => ({ periodLocked: { ...s.periodLocked, [s.periodLabel]: !s.periodLocked[s.periodLabel] } })); }
  toggleLock(k) { if (READONLY) return; this.setState(s => ({ locks: { ...s.locks, [k]: !s.locks[k] } })); }

  pushUndo(s) { const st = [...(s.undoStack || []), this.snapshotFullState(s)]; return st.length > 20 ? st.slice(st.length - 20) : st; }
  snapshotFullState(s) {
    return { stock: s.stock, plateStockDiam: s.plateStockDiam, actual: s.actual, generalUseEntries: s.generalUseEntries,
      plateGeneralUseEntries: s.plateGeneralUseEntries, periodLabel: s.periodLabel, periods: s.periods, periodHistory: s.periodHistory };
  }
  undoLastAction() {
    if (READONLY) return;
    const stack = this.state.undoStack;
    if (!stack || !stack.length) return;
    const prev = stack[stack.length - 1];
    if (prev.periodLabel !== this.state.periodLabel) {
      if (!confirm('การย้อนกลับนี้จะเปลี่ยนงวดที่กำลังดูจาก "' + this.state.periodLabel + '" กลับไปเป็น "' + prev.periodLabel + '" ต้องการดำเนินการต่อหรือไม่?')) return;
    }
    this.setState(s => {
      const ns = [...s.undoStack]; const p = ns.pop();
      const redoStack = [...s.redoStack, this.snapshotFullState(s)];
      return { ...p, undoStack: ns, redoStack, generalUseOpen: {} };
    });
  }
  redoLastAction() {
    if (READONLY) return;
    this.setState(s => {
      if (!s.redoStack.length) return null;
      const rs = [...s.redoStack]; const n = rs.pop();
      const undoStack = [...s.undoStack, this.snapshotFullState(s)];
      return { ...n, undoStack, redoStack: rs, generalUseOpen: {} };
    });
  }

  updateStock(key, field, value) {
    if (READONLY) return;
    this.setState(s => ({ undoStack: this.pushUndo(s), redoStack: [], stock: { ...s.stock, [key]: { ...s.stock[key], [field]: value === '' ? null : Number(value) } } }));
  }
  updatePlateStockDiam(diam, field, value) {
    if (READONLY) return;
    this.setState(s => ({ undoStack: this.pushUndo(s), redoStack: [], plateStockDiam: { ...s.plateStockDiam, [diam]: { ...s.plateStockDiam[diam], [field]: value === '' ? null : Number(value) } } }));
  }
  addPlateGeneralUseEntry(t) {
    if (READONLY) return;
    this.setState(s => ({ undoStack: this.pushUndo(s), redoStack: [], plateGeneralUseEntries: { ...s.plateGeneralUseEntries, [t]: [...(s.plateGeneralUseEntries[t] || []), { kg: 0, note: '' }] } }));
  }
  removePlateGeneralUseEntry(t, idx) {
    if (READONLY) return;
    this.setState(s => ({ undoStack: this.pushUndo(s), redoStack: [], plateGeneralUseEntries: { ...s.plateGeneralUseEntries, [t]: (s.plateGeneralUseEntries[t] || []).filter((_, i) => i !== idx) } }));
  }
  updatePlateGeneralUseEntry(t, idx, field, value) {
    if (READONLY) return;
    this.setState(s => {
      const list = [...(s.plateGeneralUseEntries[t] || [])];
      list[idx] = { ...list[idx], [field]: field === 'kg' ? (value === '' ? 0 : Number(value)) : value };
      return { undoStack: this.pushUndo(s), redoStack: [], plateGeneralUseEntries: { ...s.plateGeneralUseEntries, [t]: list } };
    });
  }
  computedActualFromStock(key) {
    const s = this.state.stock[key]; if (!s) return '';
    const opening = s.opening ?? 0, received = s.received ?? 0, closing = s.closing;
    if (closing == null) return '';
    return opening + received - closing;
  }
  currentConfig() {
    return { rebarWeights: this.state.rebarWeights, plateWeights: this.state.plateWeights,
      whiskerWeights: this.state.whiskerWeights, whiskerSpecs: this.state.whiskerSpecs,

  }
  recompute() { if (!this.state.rawRows || !this._mod) return; this.setState({ result: this._mod.calcPileList(this.state.rawRows, this.currentConfig()) }); }
  updateRebarWeight(k, v) { if (READONLY) return; this.setState(s => ({ rebarWeights: { ...s.rebarWeights, [k]: v === '' ? null : Number(v) } }), () => this.recompute()); }
  updatePlateWeight(k, v) { if (READONLY) return; this.setState(s => ({ plateWeights: { ...s.plateWeights, [k]: v === '' ? null : Number(v) } }), () => this.recompute()); }
  updateWhiskerWeight(k, v) { if (READONLY) return; this.setState(s => ({ whiskerWeights: { ...s.whiskerWeights, [k]: v === '' ? null : Number(v) } }), () => this.recompute()); }
  updateWhiskerSpec(k, v) { if (READONLY) return; this.setState(s => ({ whiskerSpecs: { ...s.whiskerSpecs, [k]: v } }), () => this.recompute()); }
  updatePcKgPerM(mm, v) { if (READONLY) return; this.setState(s => ({ pcWireKgPerM: { ...s.pcWireKgPerM, [mm]: v === '' ? null : Number(v) } }), () => this.recompute()); }
  updatePcWire(id, field, v) { if (READONLY) return; this.setState(s => ({ pcWireTable: s.pcWireTable.map(c => c.id === id ? { ...c, [field]: v === '' ? 0 : Number(v) } : c) }), () => this.recompute()); }
  updatePlateThickness(diam, v) { if (READONLY) return; this.setState(s => ({ plateThicknessMm: { ...s.plateThicknessMm, [diam]: Number(v) } })); }
  updatePileArea(diam, v) { if (READONLY) return; this.setState(s => ({ pileAreaM2: { ...(s.pileAreaM2 || {}), [diam]: v === '' ? null : Number(v) } })); }
  updateConcreteMix(key, v) { if (READONLY) return; this.setState(s => ({ concreteMix: { ...(s.concreteMix || {}), [key]: v === '' ? null : Number(v) } })); }
  // รายชื่อขนาดเสาทั้งหมดที่ควรตั้งค่าหน้าตัด — เอาจากตารางน้ำหนักเพลท (ครบทุกขนาด) รวมกับที่พบในไฟล์งวดนี้
  allPileDiams() {
    const set = new Set(Object.keys(this.state.plateWeights || {}));
    const r = this.state.result;
    if (r && r.piles) r.piles.forEach(p => set.add(p.diam));

  }
  updatePlateBigSheetKg(mm, v) { if (READONLY) return; this.setState(s => ({ plateBigSheetKg: { ...s.plateBigSheetKg, [mm]: v === '' ? null : Number(v) } }), () => this.recompute()); }
  updateStirrupWireMm(diam, v) { if (READONLY) return; this.setState(s => ({ stirrupWireMm: { ...s.stirrupWireMm, [diam]: v } })); }
  updateStirrup(diam, len, v) { if (READONLY) return; this.setState(s => ({ stirrupTable: { ...s.stirrupTable, [diam]: { ...s.stirrupTable[diam], [len]: v === '' ? null : Number(v) } } }), () => this.recompute()); }
  addStirrupLength(diam, len) {
    if (READONLY) return;
    len = Number(len); if (!len) return;
    this.setState(s => { const cur = s.stirrupTable[diam] || {}; if (cur[len] != null) return null;
      return { stirrupTable: { ...s.stirrupTable, [diam]: { ...cur, [len]: 0 } } }; }, () => this.recompute());
  }
  removeStirrupLength(diam, len) {

    this.setState(s => { const cur = { ...(s.stirrupTable[diam] || {}) }; delete cur[len];
      return { stirrupTable: { ...s.stirrupTable, [diam]: cur } }; }, () => this.recompute());
  }
  setPcWireCondType(id, type) {
    if (READONLY) return;
    this.setState(s => ({ pcWireTable: s.pcWireTable.map(c => {
      if (c.id !== id) return c;
      const base = { id: c.id, diam: c.diam, pc4: c.pc4, pc5: c.pc5 };
      if (type === 'exact') return { ...base, exact: c.exact ?? c.max ?? c.min ?? 0 };
      if (type === 'max') return { ...base, max: c.max ?? c.exact ?? c.min ?? 0 };
      if (type === 'min') return { ...base, min: c.min ?? c.exact ?? c.max ?? 0 };
      return base;
    }) }), () => this.recompute());
  }
  addPcWireRow(diam) {
    if (READONLY) return;
    this.setState(s => { const nextId = Math.max(-1, ...s.pcWireTable.map(c => c.id)) + 1;
      return { pcWireTable: [...s.pcWireTable, { id: nextId, diam, pc4: 0, pc5: 0 }] }; }, () => this.recompute());
  }
  removePcWireRow(id) { if (READONLY) return; this.setState(s => ({ pcWireTable: s.pcWireTable.filter(c => c.id !== id) }), () => this.recompute()); }

  buildLockUi(key) {
    const locked = this.state.locks[key];
    return { locked, label: locked ? '🔒 ล็อกอยู่ — กดเพื่อปลดล็อก' : '🔓 ปลดล็อกแล้ว — กดเพื่อล็อก',
      pointerEvents: locked ? 'none' : 'auto', opacity: locked ? 0.5 : 1, onToggle: () => this.toggleLock(key) };
  }

  toggleGeneralUseOpen(key) { this.setState(s => ({ generalUseOpen: { ...s.generalUseOpen, [key]: !s.generalUseOpen[key] } })); }
  togglePlateGeneralUseOpen(t) { this.setState(s => ({ plateGeneralUseOpen: { ...s.plateGeneralUseOpen, [t]: !s.plateGeneralUseOpen[t] } })); }
  addExtraRebarItem() { if (READONLY) return; this.setState(s => ({ undoStack: this.pushUndo(s), redoStack: [], extraRebarItems: [...s.extraRebarItems, { id: 'x' + Date.now() + Math.random(), spec: '' }] })); }
  removeExtraRebarItem(id) { if (READONLY) return; this.setState(s => ({ undoStack: this.pushUndo(s), redoStack: [], extraRebarItems: s.extraRebarItems.filter(it => it.id !== id) })); }
  updateExtraRebarSpec(id, v) { if (READONLY) return; this.setState(s => ({ undoStack: this.pushUndo(s), redoStack: [], extraRebarItems: s.extraRebarItems.map(it => it.id === id ? { ...it, spec: v } : it) })); }
  addGeneralUseEntry(key) {
    if (READONLY) return;
    this.setState(s => ({ undoStack: this.pushUndo(s), redoStack: [],
      generalUseEntries: { ...s.generalUseEntries, [key]: [...(s.generalUseEntries[key] || []), { amount: 0, reason: '' }] },
      generalUseOpen: { ...s.generalUseOpen, [key]: true } }));
  }
  removeGeneralUseEntry(key, idx) {
    if (READONLY) return;
    this.setState(s => ({ undoStack: this.pushUndo(s), redoStack: [], generalUseEntries: { ...s.generalUseEntries, [key]: (s.generalUseEntries[key] || []).filter((_, i) => i !== idx) } }));
  }
  updateGeneralUseEntry(key, idx, field, value) {
    if (READONLY) return;
    this.setState(s => {
      const list = [...(s.generalUseEntries[key] || [])];
      list[idx] = { ...list[idx], [field]: field === 'amount' ? (value === '' ? 0 : Number(value)) : value };
      return { undoStack: this.pushUndo(s), redoStack: [], generalUseEntries: { ...s.generalUseEntries, [key]: list } };
    });
  }

  diffInfo(calc, actualStr, digits) {
    const d = digits ?? 1;
    const actual = actualStr === '' || actualStr == null ? null : Number(actualStr);
    if (actual == null || !isFinite(actual)) return { actual: '', diffFmt: '-', pctFmt: '-', diffColor: 'inherit' };
    const diff = actual - calc;
    const pct = calc !== 0 ? (diff / calc) * 100 : (actual !== 0 ? Infinity : 0);
    const color = Math.abs(pct) < 3 ? '#728' : (diff > 0 ? '#c0392b' : '#3f7d2b');
    return { actual: actualStr, diffFmt: (diff > 0 ? '+' : '') + fmt(diff, d), pctFmt: !isFinite(pct) ? 'ไม่มียอดคำนวณ' : (pct > 0 ? '+' : '') + fmt(pct, 1) + '%', diffColor: color };
  }
  thresholdBg(pctLost, key) {
    const cat = key ? String(key).split(':')[1] : null;
    const threshold = cat ? this.getThresholdFor(cat) : (this.state.alertThresholdPct || Infinity);
    if (pctLost == null || !isFinite(pctLost) || Math.abs(pctLost) < threshold) return 'transparent';
    return pctLost > 0 ? '#eaf7ea' : '#fbeaea';
  }
  setActual(key, value) { if (READONLY) return; this.setState(s => ({ undoStack: this.pushUndo(s), redoStack: [], actual: { ...s.actual, [key]: value } })); }

  buildRow(key, label, calcVal, extraFmt) {
    const hasStockEntry = this.state.stock[key] && (this.state.stock[key].opening != null || this.state.stock[key].received != null || this.state.stock[key].closing != null);
    const actualStr = (this.state.resultView === 'stock' || hasStockEntry) ? this.computedActualFromStock(key) : (this.state.actual[key] ?? '');
    const dg = digitsForKey(key);
    const info = this.diffInfo(calcVal, actualStr, dg);
    const stockVals = this.state.stock[key] || {};
    const generalUseEntriesRaw = this.state.generalUseEntries[key] || [];
    const generalUse = generalUseEntriesRaw.reduce((s, e) => s + (e.amount || 0), 0);
    const actualNum = info.actual === '' || info.actual == null ? null : Number(info.actual);
    const A = actualNum != null ? calcVal - actualNum : null;
    const realDiff = A != null ? A + generalUse : null;
    const pctLost = realDiff != null && actualNum ? (realDiff / actualNum) * 100 : null;
    return {
      key, label, calcFmt: fmt(calcVal, dg), actual: info.actual,
      actualFmt: (info.actual === '' || info.actual == null || isNaN(Number(info.actual))) ? '-' : fmt(Number(info.actual), dg),
      diffFmt: info.diffFmt, pctFmt: info.pctFmt, diffColor: info.diffColor,
      onActualChange: v => this.setActual(key, v),
      opening: stockVals.opening ?? '', received: stockVals.received ?? '', closing: stockVals.closing ?? '',
      onOpeningChange: v => this.updateStock(key, 'opening', v), onReceivedChange: v => this.updateStock(key, 'received', v), onClosingChange: v => this.updateStock(key, 'closing', v),
      generalUse,
      generalUseEntries: generalUseEntriesRaw.map((e, idx) => ({
        amount: e.amount, reason: e.reason,
        onAmountChange: v => this.updateGeneralUseEntry(key, idx, 'amount', v),
        onReasonChange: v => this.updateGeneralUseEntry(key, idx, 'reason', v),
        onRemove: () => this.removeGeneralUseEntry(key, idx),
      })),
      onAddGeneralUseEntry: () => this.addGeneralUseEntry(key),
      generalUseOpen: !!this.state.generalUseOpen[key],
      generalUseSummaryFmt: fmt(generalUse, dg),
      onToggleGeneralUseOpen: () => this.toggleGeneralUseOpen(key),
      realDiffFmt: realDiff != null ? ((realDiff > 0 ? '+' : '') + fmt(realDiff, dg)) : '-',
      pctLostFmt: pctLost != null && isFinite(pctLost) ? ((pctLost > 0 ? '+' : '') + fmt(pctLost, 1) + '%') : '-',
      rowBg: this.thresholdBg(pctLost, key),
      ...extraFmt,
    };
  }

  buildMainPage(r) {
    if (!r) return null;
    const wireMmMap = this.state.stirrupWireMm || {}, thickMap = this.state.plateThicknessMm || {}, specMap = this.state.whiskerSpecs || {};
    const dl = this._mod ? this._mod.diamLabel : (x => x);
    const rebarRowsM = markRebarGroups(sortRebarBySpec(r.rebar, x => x.spec)
      .map(x => this.buildRow('main:rebar:' + x.spec, x.spec, x.pieces, { unit: 'เส้น', notExtra: true })));
    this.state.extraRebarItems.forEach(item => {
      const row = this.buildRow('main:rebarExtra:' + item.id, item.spec || '(ระบุขนาด/สเปค)', 0, { unit: 'กก.' });
      rebarRowsM.push({ ...row, isExtra: true, spec: item.spec, onSpecChange: v => this.updateExtraRebarSpec(item.id, v), onRemoveExtra: () => this.removeExtraRebarItem(item.id) });
    });
    const pcBuckets = { 4: 0, 5: 0, 7: 0 };
    r.pc.forEach(x => { pcBuckets[4] += x.pc4Kg; pcBuckets[5] += x.pc5Kg; pcBuckets[7] += x.pc7Kg; });
    const pcRowsM = Object.entries(pcBuckets).filter(([, v]) => v > 0).map(([mm, v]) => this.buildRow('main:pc:' + mm, 'PC.wire' + mm + 'มม.', v, { unit: 'กก.' }));
    const stirrupBuckets = {};
    r.stirrup.forEach(x => { const mm = wireMmMap[x.diam] || 'ไม่ระบุ'; stirrupBuckets[mm] = (stirrupBuckets[mm] || 0) + x.weightKg; });
    const stirrupRowsM = Object.entries(stirrupBuckets).sort((a, b) => a[0].localeCompare(b[0])).map(([mm, v]) => this.buildRow('main:stirrup:' + mm, 'ปลอก' + mm + (mm !== 'ไม่ระบุ' ? ' มม.' : ''), v, { unit: 'กก.' }));
    const plateBuckets = { 6: { count: 0, weight: 0 }, 8: { count: 0, weight: 0 }, 9: { count: 0, weight: 0 } };
    r.plates.forEach(x => { const t = thickMap[x.diam] || 'ไม่ระบุ'; if (!plateBuckets[t]) plateBuckets[t] = { count: 0, weight: 0 }; plateBuckets[t].count += x.count; plateBuckets[t].weight += x.weightKg; });
    const bigSheetKg = this.state.plateBigSheetKg || {};
    const mokFn = this._mod ? this._mod.isMok : (() => false);
    const plateWeightsM = this.state.plateWeights || {};
    const plateRowsM = Object.entries(plateBuckets).sort((a, b) => Number(b[0]) - Number(a[0])).map(([t, v]) => {
      const kgPerBigSheet = bigSheetKg[t] || null;
      const bigSheets = kgPerBigSheet ? v.weight / kgPerBigSheet : 0;
      const label = 'เพลท' + t + (t !== 'ไม่ระบุ' ? ' มม.' : '') + ' (แผ่นใหญ่ 5x20ฟุต)';
      const row = this.buildRow('main:plate:' + t, label, bigSheets, { unit: 'แผ่น' });
      const diams = Object.keys(thickMap).filter(d => thickMap[d] === t && (Number(t) !== 9 || mokFn(d)));
      let openW = 0, closeW = 0;
      diams.forEach(d => { const st = this.state.plateStockDiam[d] || {}; const w = plateWeightsM[d] || 0; openW += (st.open || 0) * w; closeW += (st.close || 0) * w; });
      const openSheets = kgPerBigSheet ? openW / kgPerBigSheet : 0, closeSheets = kgPerBigSheet ? closeW / kgPerBigSheet : 0;
      const stockInOut = closeSheets - openSheets;
      const generalUseKg = (this.state.plateGeneralUseEntries[t] || []).reduce((s, e) => s + (e.kg || 0), 0);
      const generalUseSheets = kgPerBigSheet ? generalUseKg / kgPerBigSheet : 0;
      const actualNum = row.actual === '' || row.actual == null ? null : Number(row.actual);
      const A = actualNum != null ? bigSheets - actualNum : null;
      // เข้า-ออกสต็อกสำเร็จ = (B) สต็อกปลาย−ต้นงวด เฉยๆ (กลับไปใช้ B ตรงๆ ตามที่ยืนยัน) แล้วบวกใช้งานอื่น-เสียหายเป็นส่วนต่างจริง
      const realDiff = A != null ? A + stockInOut + generalUseSheets : null;
      const pctLost = realDiff != null && actualNum ? (realDiff / actualNum) * 100 : null;
      const plateEntries = (this.state.plateGeneralUseEntries[t] || []).map((e, idx) => ({
        kg: e.kg, note: e.note, onKgChange: v => this.updatePlateGeneralUseEntry(t, idx, 'kg', v),
        onNoteChange: v => this.updatePlateGeneralUseEntry(t, idx, 'note', v), onRemove: () => this.removePlateGeneralUseEntry(t, idx),
      }));
      return {
        ...row, thickness: t,
        generalUseFmt: fmt(generalUseSheets, 2), plateGeneralUseOpen: !!this.state.plateGeneralUseOpen[t],
        onTogglePlateGeneralUseOpen: () => this.togglePlateGeneralUseOpen(t), plateGeneralUseEntries: plateEntries,
        onAddPlateGeneralUseEntry: () => this.addPlateGeneralUseEntry(t),
        stockInOutFmt: (stockInOut >= 0 ? '+' : '') + fmt(stockInOut, 2),
        realDiffFmt: realDiff != null ? ((realDiff > 0 ? '+' : '') + fmt(realDiff, 2)) : '-',
        pctLostFmt: pctLost != null && isFinite(pctLost) ? ((pctLost > 0 ? '+' : '') + fmt(pctLost, 2) + '%') : '-',
        rowBg: this.thresholdBg(pctLost, 'main:plate'),
        generalUseSummaryFmt: fmt(generalUseSheets, 2),
      };
    });
    const whiskerBuckets = {};
    r.whisker.forEach(x => { const spec = specMap[x.diam] || 'ไม่ระบุ'; if (!whiskerBuckets[spec]) whiskerBuckets[spec] = { count: 0, weight: 0 }; whiskerBuckets[spec].count += x.count; whiskerBuckets[spec].weight += x.weightKg; });
    // โชว์ให้ครบทุกสเปคที่ตั้งค่าไว้ (ไม่ใช่แค่สเปคที่มีผลิตงวดนี้) กันขนาดที่ไม่ได้ผลิตแต่มีสต็อกค้างอยู่หายไปจากตาราง
    const allWhiskerSpecs = [...new Set(Object.values(specMap).filter(Boolean))];
    Object.keys(whiskerBuckets).forEach(spec => { if (!allWhiskerSpecs.includes(spec)) allWhiskerSpecs.push(spec); });
    const whiskerRowsM = allWhiskerSpecs.map(spec => this.buildRow('main:whisker:' + spec, spec, (whiskerBuckets[spec] || {}).weight || 0, { unit: 'กก.' }));
    const mok = this._mod ? this._mod.isMok : (() => false);
    const allMokDiams = Object.keys(this.state.plateWeights || {}).filter(mok);
    const collarCountByDiam = Object.fromEntries(r.collar.map(x => [x.diam, x.count]));
    const collarRowsM = allMokDiams.map(diam => this.buildRow('main:collar:' + diam, 'Colla ' + dl(diam).replace(' มอก.', '').replace('-', ''), collarCountByDiam[diam] || 0, { unit: 'ชุด' }));
    return { rebarRowsM, pcRowsM, stirrupRowsM, plateRowsM, whiskerRowsM, collarRowsM };
  }

  buildDetailPage(r) {
    if (!r || !this._mod) return null;
    const dl = this._mod.diamLabel;
    const plateThicknessD = this.state.plateThicknessMm || {};
    const wireMmD = this.state.stirrupWireMm || {};
    const rebarRowsD = markRebarGroups(sortRebarBySpec(r.rebar, x => x.spec)
      .map(x => this.buildRow('detail:rebar:' + x.spec, x.spec, x.weightKg, { piecesFmt: fmt(x.pieces, 0) })));
    const plateRowsD = r.plates.map(x => this.buildRow('detail:plate:' + x.diam, dl(x.diam) + (plateThicknessD[x.diam] ? ' (เพลท ' + plateThicknessD[x.diam] + ' มม.)' : ''), x.weightKg, { countFmt: fmt(x.count, 0) }));
    const whiskerRowsD = r.whisker.map(x => this.buildRow('detail:whisker:' + x.diam, dl(x.diam), x.weightKg, { countFmt: fmt(x.count, 0), spec: x.spec || 'ไม่ระบุในไฟล์ต้นฉบับ' }));
    const collarRowsD = r.collar.map(x => ({ ...this.buildRow('detail:collar:' + x.diam, dl(x.diam), x.count), calcFmt: fmt(x.count, 0) }));
    const pcRowsD = [];
    r.pc.forEach(x => {
      pcRowsD.push(this.buildRow('detail:pc4:' + x.diam, 'PC.wire4 - เสา ' + dl(x.diam), x.pc4Kg));
      pcRowsD.push(this.buildRow('detail:pc5:' + x.diam, 'PC.wire5 - เสา ' + dl(x.diam), x.pc5Kg));
    });
    const pc7Total = r.pc.reduce((s, x) => s + x.pc7Kg, 0);
    pcRowsD.push(this.buildRow('detail:pc7:total', 'PC.wire7 (รายการพิเศษ)', pc7Total));
    const pc7NoteExtra = pc7Total === 0
      ? 'ในไฟล์นี้ไม่มีข้อความ "PcWire 7 มม." อยู่เลย จึงคำนวณได้ 0 — กรอกยอดใช้จริงเพื่อเทียบได้'
      : 'พบข้อความ "PcWire 7 มม." ในไฟล์นี้ คำนวณจากข้อความที่ระบุไว้ในชื่อสินค้าโดยตรง (ไม่ใช่สูตรมาตรฐาน)';
    const stirrupRowsD = r.stirrup.map(x => this.buildRow('detail:stirrup:' + x.diam, dl(x.diam) + (wireMmD[x.diam] ? ' (ลวด ' + wireMmD[x.diam] + ' มม.)' : ''), x.weightKg));
    return { rebarRowsD, plateRowsD, whiskerRowsD, collarRowsD, pcRowsD, pc7NoteExtra, stirrupRowsD };
  }

  buildPlateReconcile(r) {
    if (!r || !this._mod) return [];
    const mok = this._mod.isMok, dl = this._mod.diamLabel;
    const thickMap = this.state.plateThicknessMm || {}, plateWeights = this.state.plateWeights || {}, bigSheetKg = this.state.plateBigSheetKg || {};
    const thicknesses = [...new Set(Object.values(thickMap).filter(Boolean))].sort((a, b) => Number(b) - Number(a));
    return thicknesses.map(t => {
      const diams = Object.keys(thickMap).filter(d => thickMap[d] === t && (Number(t) !== 9 || mok(d)));
      const rows = diams.map(diam => {
        // เก็บค่าสำหรับโชว์ในช่องกรอกแบบเว้นว่างไว้ (ไม่ยัด 0) ต่างจากค่าที่ใช้คำนวณน้ำหนักซึ่งถือว่าว่าง = 0
        const st = this.state.plateStockDiam[diam] || {}; const open = st.open ?? 0, close = st.close ?? 0, w = plateWeights[diam] || 0;
        return { diam, label: dl(diam), open: st.open ?? '', close: st.close ?? '', openWeight: open * w, closeWeight: close * w,
          onOpenChange: v => this.updatePlateStockDiam(diam, 'open', v), onCloseChange: v => this.updatePlateStockDiam(diam, 'close', v) };
      });
      const openWeightTotal = rows.reduce((s, x) => s + x.openWeight, 0), closeWeightTotal = rows.reduce((s, x) => s + x.closeWeight, 0);
      const kgPerSheet = bigSheetKg[t] || 1;
      const openSheets = openWeightTotal / kgPerSheet, closeSheets = closeWeightTotal / kgPerSheet;
      const plateCalcBig = (r.plates || []).filter(x => thickMap[x.diam] === t).reduce((s, x) => s + x.weightKg, 0) / kgPerSheet;
      const plateKey = 'main:plate:' + t;
      const hasStockEntryP = this.state.stock[plateKey] && (this.state.stock[plateKey].opening != null || this.state.stock[plateKey].received != null || this.state.stock[plateKey].closing != null);
      const actualStr = (this.state.resultView === 'stock' || hasStockEntryP) ? this.computedActualFromStock(plateKey) : (this.state.actual[plateKey] ?? '');
      const actualSheets = actualStr === '' || actualStr == null ? null : Number(actualStr);
      const A = actualSheets != null ? plateCalcBig - actualSheets : null;
      const B = closeSheets - openSheets;
      // สรุป (A)+(B) = ยอดขาด/เกินที่แท้จริง กลับเครื่องหมายจาก A+B เพราะ (A) ติดลบ = ใช้เกินคำนวณ (ของขาด)
      // แต่ผลรวมควรโชว์เป็นบวกเมื่อของขาดจริง (ยืนยันจากตัวอย่าง A=-4.05,B=1.10 ต้องได้ +2.95 ไม่ใช่ -2.95)
      const sumABSheets = A != null ? -(A + B) : null, sumABKg = sumABSheets != null ? sumABSheets * kgPerSheet : null;
      const entries = (this.state.plateGeneralUseEntries[t] || []).map((e, idx) => ({
        kg: e.kg, note: e.note, onKgChange: v => this.updatePlateGeneralUseEntry(t, idx, 'kg', v),
        onNoteChange: v => this.updatePlateGeneralUseEntry(t, idx, 'note', v), onRemove: () => this.removePlateGeneralUseEntry(t, idx),
      }));
      // "ใช้งานอื่น-เสียหาย" คิดเป็นแผ่นใหญ่ด้วย (เดิมมีแค่ กก.) ให้รวมกับ (A)+(B) ซึ่งเป็นหน่วยแผ่นใหญ่อยู่แล้วได้ตรงๆ
      const generalUseKg = entries.reduce((s, e) => s + (e.kg || 0), 0);
      const generalUseSheets = generalUseKg / kgPerSheet;
      const unexplainedSheets = sumABSheets != null ? sumABSheets + generalUseSheets : null;
      const unexplainedKg = unexplainedSheets != null ? unexplainedSheets * kgPerSheet : null;
      return { t, rows, openWeightFmt: fmt(openWeightTotal, 1), closeWeightFmt: fmt(closeWeightTotal, 1),
        openSheetsFmt: fmt(openSheets, 2), closeSheetsFmt: fmt(closeSheets, 2), plateCalcBigFmt: fmt(plateCalcBig, 2),
        AFmt: A != null ? fmt(A, 2) : '-', BFmt: fmt(B, 2), sumABSheetsFmt: sumABSheets != null ? fmt(sumABSheets, 2) : '-',
        sumABKgFmt: sumABKg != null ? fmt(sumABKg, 1) : '-', generalUseEntries: entries,
        generalUseKgFmt: fmt(generalUseKg, 1), generalUseSheetsFmt: fmt(generalUseSheets, 2),
        onAddGeneralUseEntry: () => this.addPlateGeneralUseEntry(t),
        unexplainedSheetsFmt: unexplainedSheets != null ? fmt(unexplainedSheets, 2) : '-',
        unexplainedKgFmt: unexplainedKg != null ? fmt(unexplainedKg, 1) : '-' };
    });
  }

  // สรุปคิวผลิต + ความยาวรวมของงวด (เก็บไว้เทียบข้ามเดือน)
  // รายการเสาของงวด — ถ้าผลลัพธ์ที่บันทึกไว้เป็นเวอร์ชันเก่า (ไม่มี piles) ให้คำนวณใหม่จากรายการดิบ
  pilesOf(s) {
    if (s.result && s.result.piles && s.result.piles.length) return s.result.piles;
    if (this._mod && s.rawRows && s.rawRows.length) {
      try { return (this._mod.calcPileList(s.rawRows, this.currentConfig()) || {}).piles || null; } catch (e) { return null; }
    }
    return null;
  }
  computePileTotals(s) {
    const piles = this.pilesOf(s);
    if (!piles || !piles.length) return null;
    const r = { piles };
    const areas = s.pileAreaM2 || {};
    let qty = 0, length = 0, volume = 0, missing = 0;
    const seen = new Set();
    r.piles.forEach(p => {
      qty += p.qty;
      length += p.totalLength;
      const a = Number(areas[p.diam]);
      if (a > 0) volume += a * p.totalLength;
      else if (!seen.has(p.diam)) { seen.add(p.diam); missing++; }
    });
    return { qty, length, volume: missing ? null : volume, missing };
  }
  computePeriodSummary(s) {
    if (!s.result) return null;
    const mp = this.buildMainPage(s.result);
    const piles = this.computePileTotals(s);
    const base = piles ? [{ key: '__piles', label: 'สรุปเสาเข็ม', piles }] : [];
    return base.concat(CATS.map(c => {
      const rows = mp[c.key + 'RowsM'] || [];
      let totalCalc = 0, totalRealDiff = 0, hasDiff = false;
      rows.forEach(row => {
        totalCalc += parseFmtNum(row.calcFmt) || 0;
        const rd = parseFmtNum(row.realDiffFmt);
        if (rd != null) { totalRealDiff += rd; hasDiff = true; }
      });
      const pct = hasDiff && totalCalc ? (totalRealDiff / totalCalc) * 100 : null;
      return { key: c.key, label: c.label, totalCalc, totalRealDiff, pct };
    }));
  }
  // แถวเทียบคิวผลิต/ความยาว ข้ามงวด
  buildPileTrendRows() {
    const s = this.state;
    const closedLabels = (s.periods || []).filter(p => s.periodSummaries[p] && p !== s.periodLabel);
    const cols = [...closedLabels, s.periodLabel];
    const totalsFor = pl => {
      if (pl === s.periodLabel) return this.computePileTotals(s);
      const sum = s.periodSummaries[pl];
      const e = sum && sum.find ? sum.find(x => x.key === '__piles') : null;
      return e ? e.piles : null;
    };
    const defs = [
      { label: 'จำนวนเสาเข็ม (ต้น)', pick: t => t && fmt(t.qty, 0) },
      { label: 'ความยาวรวม (ม.)', pick: t => t && fmt(t.length, 2) },
      { label: 'คิวผลิต (m³)', pick: t => t ? (t.volume == null ? 'ยังไม่ตั้งหน้าตัด' : fmt(t.volume, 2)) : null },
    ];
    return { cols, rows: defs.map(d => ({ label: d.label, cells: cols.map(pl => ({ period: pl, text: d.pick(totalsFor(pl)) || '-' })) })) };
  }
  filterMainPage(mp) {
    if (!mp) return mp;
    const q = (this.state.mainSearchQuery || '').trim().toLowerCase();
    if (!q) return mp;
    const f = rows => (rows || []).filter(row => String(row.label || '').toLowerCase().includes(q));
    const out = { ...mp };
    CATS.forEach(c => { out[c.key + 'RowsM'] = f(mp[c.key + 'RowsM']); });
    return out;
  }
  computeMaterialStatus(mp) {
    if (!mp) return { normal: 0, alert: 0, total: 0, alertRows: [] };
    let alert = 0, total = 0; const alertRows = [];
    CATS.forEach(cat => (mp[cat.key + 'RowsM'] || []).forEach(row => {
      const pct = parseFmtNum(row.pctLostFmt ?? row.pctFmt);
      if (pct == null) return;
      total++;
      if (Math.abs(pct) >= this.getThresholdFor(cat.key)) { alert++; alertRows.push({ category: cat.label, label: row.label, pctFmt: row.pctLostFmt ?? row.pctFmt }); }
    }));
    return { normal: total - alert, alert, total, alertRows };
  }
  buildTrendRows() {
    const s = this.state;
    const closedLabels = (s.periods || []).filter(p => s.periodSummaries[p] && p !== s.periodLabel);
    const currentSummary = this.computePeriodSummary(s);
    const periodCols = [...closedLabels, s.periodLabel];
    return CATS.map(m => ({
      label: m.label,
      cells: periodCols.map(pl => {
        const summary = pl === s.periodLabel ? currentSummary : s.periodSummaries[pl];
        const item = summary && summary.find(x => x.key === m.key);
        const pct = item ? item.pct : null;
        return { period: pl, pctFmt: pct != null && isFinite(pct) ? ((pct > 0 ? '+' : '') + fmt(pct, 1) + '%') : '-' };
      }),
    }));
  }

  exportExcel() {
    const r = this.state.result; if (!r) return;
    const mp = this.buildMainPage(r);
    const esc = v => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const sections = [
      { title: 'PC.wire', rows: mp.pcRowsM }, { title: 'ลวดปลอก', rows: mp.stirrupRowsM },
      { title: 'แผ่นเพลท', rows: mp.plateRowsM }, { title: 'เหล็กหนวดกุ้ง', rows: mp.whiskerRowsM },
      { title: 'เหล็ก Collar', rows: mp.collarRowsM }, { title: 'เหล็กเสริม', rows: mp.rebarRowsM },
    ];
    let html = '<html><head><meta charset="UTF-8"></head><body>';
    sections.forEach(sec => {
      if (!sec.rows || !sec.rows.length) return;
      html += '<table border="1"><tr><td colspan="8"><b>' + esc(sec.title) + '</b></td></tr>';
      html += '<tr><th>รายการ</th><th>คำนวณ</th><th>ใช้จริง</th><th>ส่วนต่าง</th><th>ใช้งานอื่น-เสียหาย</th><th>เข้า-ออกสต็อกสำเร็จ (แผ่นใหญ่)</th><th>ส่วนต่างจริง</th><th>% หาย</th></tr>';
      sec.rows.forEach(row => {
        html += '<tr>' + [row.label, row.calcFmt, row.actual, row.diffFmt, row.generalUseFmt ?? row.generalUseSummaryFmt, row.stockInOutFmt ?? '', row.realDiffFmt, row.pctLostFmt].map(v => '<td>' + esc(v) + '</td>').join('') + '</tr>';
      });
      html += '</table><br/>';
    });
    // กระทบยอดเพลทสำเร็จรูปต่อขนาดเสา — ไม่มีให้ก่อนหน้านี้ในไฟล์ Excel เลย ทั้งที่ต้องใช้ดูส่วนต่างจริงต่อขนาดเสา
    this.buildPlateReconcile(r).forEach(pr => {
      html += '<table border="1"><tr><td colspan="3"><b>กระทบยอดเพลท ' + esc(pr.t) + ' มม. (สต็อกแผ่นสำเร็จรูปต่อขนาดเสา)</b></td></tr>';
      html += '<tr><th>ขนาดเสา</th><th>แผ่นคงเหลือต้นงวด</th><th>แผ่นคงเหลือปลายงวด</th></tr>';
      pr.rows.forEach(row => { html += '<tr><td>' + esc(row.label) + '</td><td>' + esc(row.open) + '</td><td>' + esc(row.close) + '</td></tr>'; });
      html += '</table>';
      html += '<table border="1">';
      [
        ['น้ำหนักคงเหลือต้นงวด', pr.openWeightFmt + ' กก. (' + pr.openSheetsFmt + ' แผ่นใหญ่)'],
        ['น้ำหนักคงเหลือปลายงวด', pr.closeWeightFmt + ' กก. (' + pr.closeSheetsFmt + ' แผ่นใหญ่)'],
        ['คำนวณตามรายการผลิต', pr.plateCalcBigFmt + ' แผ่นใหญ่'],
        ['(A) คำนวณ − ยอดใช้จริง', pr.AFmt + ' แผ่นใหญ่'],
        ['(B) สต็อกปลาย − ต้นงวด', pr.BFmt + ' แผ่นใหญ่'],
        ['สรุป (A) + (B)', pr.sumABSheetsFmt + ' แผ่นใหญ่ (= ' + pr.sumABKgFmt + ' กก.)'],
      ].forEach(([lbl, val]) => { html += '<tr><td>' + esc(lbl) + '</td><td>' + esc(val) + '</td></tr>'; });
      if (pr.generalUseEntries.length) {
        html += '<tr><td colspan="2"><b>ใช้งานอื่น-เสียหาย</b></td></tr>';
        pr.generalUseEntries.forEach(e => { html += '<tr><td>' + esc(e.note || '') + '</td><td>' + esc(e.kg) + ' กก.</td></tr>'; });
      }
      html += '<tr><td>รวมใช้งานอื่น-เสียหาย</td><td>' + esc(pr.generalUseSheetsFmt) + ' แผ่นใหญ่ (= ' + esc(pr.generalUseKgFmt) + ' กก.)</td></tr>';
      html += '<tr><td><b>ส่วนต่างเกิน-หายที่อธิบายไม่ได้</b></td><td><b>' + esc(pr.unexplainedSheetsFmt) + ' แผ่นใหญ่ (= ' + esc(pr.unexplainedKgFmt) + ' กก.)</b></td></tr>';
      html += '</table><br/>';
    });
    html += '</body></html>';
    const blob = new Blob(['\uFEFF' + html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'วัตถุดิบเสาเข็ม.xls'; a.click(); URL.revokeObjectURL(url);
  }

  async handleFile(e) {
    if (READONLY) return;
    const file = e.target.files[0]; if (!file) return;
    this.setState({ loading: true, error: '', fileName: file.name });
    try {
      const mod = this._mod || await waitForPileCalc(); this._mod = mod;
      const rows = await mod.readPileListXlsx(file);
      if (!rows.length) throw new Error('ไม่พบข้อมูลรายการเสาในไฟล์ (ตรวจสอบหัวคอลัมน์ รหัสสินค้า/จำนวน)');
      const result = mod.calcPileList(rows, this.currentConfig());
      this.setState({ loading: false, result, actual: {}, rawRows: rows });
      if (!this.state.periodLabel) this.setState({ periodPickerOpen: true, periodPickerPurpose: 'add', periodPickerRequired: true });
    } catch (err) { this.setState({ loading: false, error: 'เกิดข้อผิดพลาด: ' + err.message }); }
  }
  cancelFirstFileLoad() {
    // ยกเลิกตอนเลือกไฟล์ผิด (ตอนยังไม่เคยตั้งงวดมาก่อน) — เคลียร์ไฟล์/ผลลัพธ์ที่เพิ่งโหลด ให้เลือกไฟล์ใหม่ได้ทันที
    if (this.fileInputRef && this.fileInputRef.current) this.fileInputRef.current.value = '';
    this.setState({ fileName: '', error: '', result: null, rawRows: null, actual: {}, periodPickerOpen: false, periodPickerPurpose: null, periodPickerRequired: false });
  }

  confirmPeriodPicker() {
    if (READONLY) return;
    const finalLabel = THAI_MONTHS[this.state.periodPickerMonth] + ' ' + this.state.periodPickerYear;
    if (this.state.periodPickerPurpose === 'add') {
      if (!this.state.periodLabel) {
        this.setState(s => ({ periodLabel: finalLabel, periods: [...new Set([...(s.periods || []), finalLabel])], periodPickerOpen: false, periodPickerPurpose: null, periodPickerRequired: false }));
        return;
      }
      this.switchPeriod(finalLabel);
      this.setState({ periodPickerOpen: false, periodPickerPurpose: null });
      return;
    }
    if (!confirm('ปิดงวด "' + (this.state.periodLabel || 'ปัจจุบัน') + '" และยกยอดคงเหลือไปเป็นยอดยกมาของงวด "' + finalLabel + '"?')) return;
    this.setState(s => {
      const undoStack = this.pushUndo(s);
      const newStock = {}; Object.keys(s.stock).forEach(k => { newStock[k] = { opening: s.stock[k].closing ?? '', received: '', closing: '' }; });
      const newPlateStockDiam = {}; Object.keys(s.plateStockDiam).forEach(d => { const close = s.plateStockDiam[d].close ?? 0; newPlateStockDiam[d] = { open: close, close }; });
      const oldLabel = s.periodLabel || 'งวดที่ยังไม่ตั้งชื่อ';
      const snapshot = { stock: s.stock, plateStockDiam: s.plateStockDiam, actual: s.actual, generalUseEntries: s.generalUseEntries, plateGeneralUseEntries: s.plateGeneralUseEntries };
      const periodHistory = { ...s.periodHistory, [oldLabel]: snapshot };
      const periods = [...new Set([...(s.periods || []), oldLabel, finalLabel])];
      const periodSummaries = { ...s.periodSummaries, [oldLabel]: this.computePeriodSummary(s) };
      return { stock: newStock, plateStockDiam: newPlateStockDiam, actual: {}, generalUseEntries: {}, plateGeneralUseEntries: {}, generalUseOpen: {},
        periodLabel: finalLabel, periodHistory, periods, periodSummaries, periodLocked: { ...s.periodLocked, [oldLabel]: true },
        periodPickerOpen: false, periodPickerPurpose: null, undoStack, redoStack: [] };
    });
  }
  switchPeriod(newLabel) {
    if (newLabel === this.state.periodLabel) return;
    this.setState(s => {
      const undoStack = this.pushUndo(s);
      const oldLabel = s.periodLabel || 'งวดที่ยังไม่ตั้งชื่อ';
      const snapshot = { stock: s.stock, plateStockDiam: s.plateStockDiam, actual: s.actual, generalUseEntries: s.generalUseEntries, plateGeneralUseEntries: s.plateGeneralUseEntries };
      const periodHistory = { ...s.periodHistory, [oldLabel]: snapshot };
      const loaded = periodHistory[newLabel] || { stock: {}, plateStockDiam: {}, actual: {}, generalUseEntries: {}, plateGeneralUseEntries: {} };
      const periods = [...new Set([...(s.periods || []), oldLabel, newLabel])];
      return { periodHistory, periodLabel: newLabel, periods, stock: loaded.stock, plateStockDiam: loaded.plateStockDiam,
        actual: loaded.actual, generalUseEntries: loaded.generalUseEntries, plateGeneralUseEntries: loaded.plateGeneralUseEntries,
        generalUseOpen: {}, undoStack };
    });
  }
  closeMonthCarryForward() {
    if (READONLY) return;
    const curIdx = THAI_MONTHS.indexOf((this.state.periodLabel || '').split(' ')[0]);
    const curYear = parseInt((this.state.periodLabel || '').split(' ')[1], 10);
    let nextMonth = 0, nextYear = new Date().getFullYear() + 543;
    if (curIdx >= 0 && !isNaN(curYear)) { nextMonth = (curIdx + 1) % 12; nextYear = curIdx === 11 ? curYear + 1 : curYear; }
    this.setState({ periodPickerOpen: true, periodPickerPurpose: 'close', periodPickerMonth: nextMonth, periodPickerYear: nextYear });
  }
  deleteCurrentPeriod() {
    if (READONLY) return;
    const label = this.state.periodLabel;
    if (!confirm('ลบข้อมูลทั้งหมดของงวด "' + label + '" ทิ้งถาวร? การกระทำนี้ย้อนกลับไม่ได้')) return;
    this.setState(s => {
      const periods = (s.periods || []).filter(p => p !== label);
      const periodHistory = { ...s.periodHistory }; delete periodHistory[label];
      const periodSummaries = { ...s.periodSummaries }; delete periodSummaries[label];
      if (!periods.length) {
        return { periods: [], periodHistory: {}, periodSummaries: {}, periodLabel: null, stock: {}, plateStockDiam: {},
          actual: {}, generalUseEntries: {}, plateGeneralUseEntries: {}, generalUseOpen: {}, undoStack: [], redoStack: [],
          periodLocked: {}, result: null, rawRows: null, error: null, resultView: 'main' };
      }
      const nextLabel = periods[0];
      const loaded = periodHistory[nextLabel] || { stock: {}, plateStockDiam: {}, actual: {}, generalUseEntries: {}, plateGeneralUseEntries: {} };
      return { periods, periodHistory, periodSummaries, periodLabel: nextLabel, stock: loaded.stock, plateStockDiam: loaded.plateStockDiam,
        actual: loaded.actual, generalUseEntries: loaded.generalUseEntries, plateGeneralUseEntries: loaded.plateGeneralUseEntries,
        generalUseOpen: {}, undoStack: [], redoStack: [] };
    });
  }

  render() {
    const s = this.state, r = s.result, mod = this._mod;
    if (!mod && !r) return <div style={{ padding: 40, textAlign: 'center', color: '#78839A' }}>กำลังโหลด...</div>;
    const mp = r ? this.filterMainPage(this.buildMainPage(r)) : null;
    const status = mp ? this.computeMaterialStatus(this.buildMainPage(r)) : { normal: 0, alert: 0 };
    const stockMode = s.resultView === 'stock';
    const openGU = (row) => {
      if (row.key && row.key.startsWith('main:plate:')) this.togglePlateGeneralUseOpen(row.thickness);
      else this.toggleGeneralUseOpen(row.key);
    };
    return (
      <div style={{ fontFamily: "'IBM Plex Sans Thai','Sarabun',sans-serif", color: '#1f2733', maxWidth: 1200, margin: '0 auto', padding: '32px 24px 80px', display: 'flex', flexDirection: 'column', gap: 26 }}>

        {READONLY && (
          <div style={{ background: '#fff6e5', border: '1px solid #e8c98a', borderRadius: 10, padding: '12px 18px', fontSize: 14, color: '#8a6114', fontWeight: 600 }} data-no-print="true">
            🔒 คุณมีสิทธิ์ดูอย่างเดียว — ไม่สามารถอัปโหลดไฟล์ใหม่หรือแก้ไขข้อมูลในหน้านี้ได้
          </div>
        )}

        <div style={card()} data-no-print="true">
          <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
            {!READONLY && (
              <label style={{ display: 'inline-flex', alignItems: 'center', gap: 8, background: '#2f5fd0', color: 'white', fontWeight: 600, fontSize: 15, padding: '11px 20px', borderRadius: 8, cursor: 'pointer' }}>
                เลือกไฟล์ Excel
                <input ref={this.fileInputRef} type="file" accept=".xlsx" onChange={e => this.handleFile(e)} style={{ display: 'none' }} />
              </label>
            )}
            <div style={{ fontSize: 14, color: '#78839A' }}>{s.loading ? 'กำลังอ่านไฟล์...' : (s.fileName ? 'ไฟล์: ' + s.fileName : 'ยังไม่ได้เลือกไฟล์')}</div>
            <SyncBadge status={s.syncStatus} />
          </div>
          {s.error && <div style={{ color: '#c0392b', fontSize: 14, marginTop: 10 }}>{s.error}</div>}
          <div style={{ fontSize: 13, color: '#8892a0', marginTop: 10 }}>ไฟล์ต้องมีคอลัมน์: รหัสสินค้า, รายการสินค้า, จำนวน</div>
          {CAN_EDIT_FORMULA && <button onClick={() => this.toggleSettings()} style={{ ...btnGhost(), marginTop: 12 }}>{s.showSettings ? 'ซ่อนตั้งค่าคงที่' : 'ตั้งค่าคงที่ (แก้ไขค่าน้ำหนัก)'}</button>}
        </div>

        {s.showSettings && CAN_EDIT_FORMULA && <SettingsPanel app={this} />}

        {s.periodPickerOpen && (
          <Modal onClose={() => { if (!s.periodPickerRequired) this.setState({ periodPickerOpen: false, periodPickerPurpose: null }); }}>
            <div style={{ fontSize: 17, fontWeight: 700 }}>{s.periodPickerRequired ? 'ก่อนเริ่ม เลือกเดือน/ปีของข้อมูลชุดนี้' : (s.periodPickerPurpose === 'close' ? 'เลือกเดือน/ปีของงวดถัดไป' : 'เลือกเดือน/ปีของงวดที่ต้องการดู')}</div>
            <div style={{ display: 'flex', gap: 10, marginTop: 12 }}>
              <select value={s.periodPickerMonth} onChange={e => this.setState({ periodPickerMonth: Number(e.target.value) })} style={{ ...inp(null), flex: 1 }}>
                {THAI_MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}
              </select>
              <input type="number" value={s.periodPickerYear} onChange={e => this.setState({ periodPickerYear: e.target.value === '' ? '' : Number(e.target.value) })} placeholder="ปี พ.ศ." style={inp(110)} />
            </div>
            <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 16 }}>
              {!s.periodPickerRequired && <button onClick={() => this.setState({ periodPickerOpen: false, periodPickerPurpose: null })} style={btnGhost()}>ยกเลิก</button>}
              {s.periodPickerRequired && <button onClick={() => this.cancelFirstFileLoad()} style={btnGhost()}>ยกเลิก (เลือกไฟล์ผิด)</button>}
              <button onClick={() => this.confirmPeriodPicker()} style={btnPrimary()}>ยืนยัน</button>
            </div>
          </Modal>
        )}

        {r && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 26 }}>
            <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
              <div style={kpi()}><div style={kpiLbl()}>แถวข้อมูลที่ใช้ได้</div><div style={kpiVal()}>{r.usedRows} / {r.totalRows}</div></div>
              <div style={kpi()}><div style={kpiLbl()}>จำนวนเสาเข็มรวม</div><div style={kpiVal()}>{fmt(r.totalPiles, 0)} ต้น</div></div>
              <div style={kpi()}><div style={kpiLbl()}>รายการที่ข้าม</div><div style={{ ...kpiVal(), color: r.skippedRows.length ? '#b87412' : 'inherit' }}>{r.skippedRows.length}</div></div>
            </div>

            {(r.warnings.length > 0 || r.skippedRows.length > 0) && (
              <div style={{ border: '1px solid #e8c98a', background: '#fdf6e8', borderRadius: 10, padding: '16px 20px' }}>
                <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 8, color: '#8a6114' }}>ต้องตรวจสอบ ({r.warnings.length + r.skippedRows.length} รายการ)</div>
                {r.warnings.map((w, i) => <div key={i} style={{ fontSize: 13, color: '#8a6114', padding: '3px 0' }}>• {w}</div>)}
                {r.skippedRows.map((sr, i) => <div key={'sk' + i} style={{ fontSize: 13, color: '#8a6114', padding: '3px 0' }}>• ข้ามแถว "{sr.code}": {sr.reason}</div>)}
              </div>
            )}

            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }} data-no-print="true">
              {[['main', 'หน้าหลัก (รวมทุกวัตถุดิบ)'], ['stock', '📦 นับสต็อก'], ['detail', 'ตามรายการเสา'], ['volume', '🧮 คิวผลิต & ความยาว'], ['trend', '📈 แนวโน้มย้อนหลัง']].map(([v, lbl]) => (
                <button key={v} onClick={() => this.setResultView(v)} style={{ padding: '9px 18px', borderRadius: 8, border: '1px solid #d8dde6', fontFamily: 'inherit', fontSize: 14, fontWeight: 600, cursor: 'pointer', background: s.resultView === v ? '#2f5fd0' : 'white', color: s.resultView === v ? 'white' : '#333' }}>{lbl}</button>
              ))}
            </div>

            {s.resultView === 'trend' && <TrendView app={this} />}
            {s.resultView === 'detail' && <DetailView app={this} />}
            {s.resultView === 'volume' && <VolumeView app={this} />}

            {(s.resultView === 'main' || s.resultView === 'stock') && (
              <React.Fragment>
                {s.resultView === 'main' && (
                  <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
                    <div style={kpi()}><div style={kpiLbl()}>วัตถุดิบปกติ</div><div style={{ ...kpiVal(), color: '#3f7d2b' }}>{status.normal}</div></div>
                    <div style={{ ...kpi(), cursor: 'pointer', position: 'relative' }} onClick={() => this.toggleAlertList()}>
                      <div style={kpiLbl()}>เกินเกณฑ์แจ้งเตือน ({s.alertThresholdPct}%)</div>
                      <div style={{ ...kpiVal(), color: '#c0392b' }}>{status.alert}</div>
                      {s.showAlertList && (
                        <Modal onClose={(e) => { e.stopPropagation(); this.toggleAlertList(); }}>
                          <div style={{ fontSize: 17, fontWeight: 700 }}>รายการที่เกินเกณฑ์ {s.alertThresholdPct}%</div>
                          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13, marginTop: 10 }}>
                            <thead><tr style={{ textAlign: 'left', borderBottom: '1px solid #eee' }}><th style={{ padding: '6px 4px' }}>ประเภท</th><th style={{ padding: '6px 4px' }}>รายการ</th><th style={{ padding: '6px 4px', textAlign: 'right' }}>%</th></tr></thead>
                            <tbody>{status.alertRows.map((ar, i) => <tr key={i} style={{ borderTop: '1px solid #f2f2f2' }}><td style={{ padding: '6px 4px', color: '#78839A' }}>{ar.category}</td><td style={{ padding: '6px 4px' }}>{ar.label}</td><td style={{ padding: '6px 4px', textAlign: 'right', fontWeight: 700, color: '#c0392b' }}>{ar.pctFmt}</td></tr>)}</tbody>
                          </table>
                        </Modal>
                      )}
                    </div>
                    <div style={{ ...kpi(), flex: 1.5, display: 'flex', alignItems: 'center' }}>
                      <input type="text" value={s.mainSearchQuery} onChange={e => this.setMainSearchQuery(e.target.value)} placeholder="🔍 ค้นหารายการวัตถุดิบ..." style={{ width: '100%', border: 'none', outline: 'none', fontFamily: 'inherit', fontSize: 14 }} />
                    </div>
                  </div>
                )}

                <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', background: '#eef3fc', border: '1px solid #b9cdf0', borderRadius: 10, padding: '12px 18px' }} data-no-print="true">
                  <div style={{ fontSize: 14, fontWeight: 700, color: '#244c9b' }}>📅 กำลังดูข้อมูลงวด:</div>
                  <select value={s.periodLabel || ''} onChange={e => this.switchPeriod(e.target.value)} style={{ padding: '8px 14px', borderRadius: 6, border: '1px solid #2f5fd0', fontFamily: 'inherit', fontSize: 15, fontWeight: 700, color: '#244c9b', background: 'white' }}>
                    {(s.periods.length ? s.periods : [s.periodLabel]).map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                  {!READONLY && <button onClick={() => this.setState({ periodPickerOpen: true, periodPickerPurpose: 'add' })} style={btnDashed()}>+ งวดใหม่</button>}
                  {!READONLY && <button onClick={() => this.deleteCurrentPeriod()} style={{ ...btnGhost('#c0392b'), border: '1px solid #e0a3a3', background: '#fdf1f1' }}>🗑 ลบงวดนี้</button>}
                  {!READONLY && s.undoStack.length > 0 && <button onClick={() => this.undoLastAction()} style={{ ...btnGhost('#8a6114'), border: '1px solid #e0c07a', background: '#fdf6e8' }}>↩ ย้อนกลับ ({s.undoStack.length})</button>}
                  {!READONLY && s.redoStack.length > 0 && <button onClick={() => this.redoLastAction()} style={{ ...btnGhost('#244c9b'), border: '1px solid #b9cdf0', background: '#eef3fc' }}>↪ ทำซ้ำ ({s.redoStack.length})</button>}
                </div>

                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
                  <div style={{ fontSize: 22, fontWeight: 700 }}>{stockMode ? 'นับสต็อก — บันทึกยอดยกมา / รับเข้า / ปิดสต็อก' : 'หน้าหลัก — สรุปรวมวัตถุดิบทั้งหมด'}</div>
                  {stockMode && !READONLY && <button onClick={() => this.closeMonthCarryForward()} data-no-print="true" style={{ padding: '9px 16px', borderRadius: 8, border: '1px solid #8fc17a', background: '#eaf7ea', color: '#3f7d2b', fontFamily: 'inherit', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>ปิดเดือน / ยกยอดไปเดือนถัดไป</button>}
                </div>

                {s.periodLocked[s.periodLabel] && (
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, padding: '12px 16px', borderRadius: 8, background: '#fdf6e8', border: '1px solid #e0c07a' }} data-no-print="true">
                    <div style={{ fontSize: 13, color: '#8a6114' }}>🔒 งวด "{s.periodLabel}" ปิดแล้ว — ข้อมูลนี้ใช้อ้างอิงเท่านั้น</div>
                    <button onClick={() => this.toggleCurrentPeriodLock()} style={btnGhost('#8a6114')}>ปลดล็อก</button>
                  </div>
                )}

                <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }} data-no-print="true">
                  <button onClick={() => this.exportExcel()} style={btnGhost()}>ดาวน์โหลด Excel</button>
                  <button onClick={() => window.print()} style={btnGhost()}>พิมพ์ / บันทึกเป็น PDF</button>
                </div>

                <MaterialTable title="ลวด PC.wire" rows={mp.pcRowsM} unitLabel="กก." stockMode={stockMode} onOpenGeneralUse={openGU} />
                <MaterialTable title="ลวดปลอก" rows={mp.stirrupRowsM} unitLabel="กก." stockMode={stockMode} onOpenGeneralUse={openGU} />
                <MaterialTable title="แผ่นเพลทเชื่อมต่อเสาเข็ม" rows={mp.plateRowsM} unitLabel="แผ่น" stockMode={stockMode} onOpenGeneralUse={openGU} />
                {/* กระทบยอดเพลทสำเร็จรูปต่อขนาดเสา — โชว์เฉพาะแท็บนับสต็อก (ผู้ใช้แจ้งว่าไม่ต้องการให้โชว์ในหน้าหลัก) */}
                {stockMode && this.buildPlateReconcile(r).map((pr, i) => <PlateReconcileCard key={i} pr={pr} />)}
                <MaterialTable title="เหล็กหนวดกุ้ง" rows={mp.whiskerRowsM} unitLabel="กก." stockMode={stockMode} onOpenGeneralUse={openGU} />
                <MaterialTable title="เหล็ก Collar" subtitle="1 ชุด ต่อ 1 หัวเพลท — เฉพาะเสามาตรฐาน มอก. เท่านั้น" rows={mp.collarRowsM} unitLabel="ชุด" stockMode={stockMode} onOpenGeneralUse={openGU} />
                <MaterialTable title="เหล็กเสริมหลัก (DB/RB)" rows={mp.rebarRowsM} unitLabel="เส้น" stockMode={stockMode} onOpenGeneralUse={openGU} allowExtraSpec
                  extraRebarButton={!READONLY && <button onClick={() => this.addExtraRebarItem()} style={btnDashed()}>+ เพิ่มรายการเหล็กเส้น (เหล็กค้าง/ไม่อยู่ในสูตร)</button>} />

                {mp.plateRowsM.map((row, i) => row.plateGeneralUseOpen && (
                  <GeneralUseModalPlate key={'p' + i} row={row} onClose={() => this.togglePlateGeneralUseOpen(row.thickness)} />
                ))}
                {[...mp.whiskerRowsM, ...mp.collarRowsM, ...mp.pcRowsM, ...mp.stirrupRowsM, ...mp.rebarRowsM].map((row, i) => row.generalUseOpen && (
                  <GeneralUseModal key={'g' + i} title={row.label} entries={row.generalUseEntries} onAdd={row.onAddGeneralUseEntry} onClose={row.onToggleGeneralUseOpen} unit="" />
                ))}
              </React.Fragment>
            )}
          </div>
        )}
      </div>
    );
  }
}
function GeneralUseModalPlate({ row, onClose }) {
  return (
    <Modal onClose={onClose}>
      <div style={{ fontSize: 18, fontWeight: 700 }}>ใช้งานอื่น-เสียหาย — {row.label}</div>
      <div style={{ fontSize: 14, color: '#78839A' }}>ระบุน้ำหนัก (กก.) และสาเหตุทีละรายการ ระบบจะรวมยอดและแปลงเป็นแผ่นใหญ่ให้อัตโนมัติ</div>
      {row.plateGeneralUseEntries.map((e, i) => (
        <div key={i} style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          <input type="number" value={e.kg} onChange={ev => e.onKgChange(ev.target.value)} placeholder="กก." style={inp(130, true)} disabled={READONLY} />
          <input type="text" value={e.note} onChange={ev => e.onNoteChange(ev.target.value)} placeholder="ใช้งาน/เสียหายจากอะไร" style={{ ...inp(null), flex: 1 }} disabled={READONLY} />
          {!READONLY && <button onClick={e.onRemove} style={btnGhost('#c0392b')}>ลบ</button>}
        </div>
      ))}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 6, paddingTop: 14, borderTop: '1px solid #eee' }}>
        {!READONLY && <button onClick={row.onAddPlateGeneralUseEntry} style={btnDashed()}>+ เพิ่มรายการ</button>}
        {READONLY && <div />}
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <div style={{ fontSize: 15, fontWeight: 700 }}>รวม: {row.generalUseFmt} แผ่นใหญ่</div>
          <button onClick={onClose} style={btnPrimary()}>เสร็จสิ้น</button>
        </div>
      </div>
    </Modal>
  );
}
function PlateReconcileCard({ pr }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10, border: '1px solid #e0c07a', borderRadius: 10, padding: 16, background: '#fdf9ee' }}>
      <div style={{ fontSize: 15, fontWeight: 700 }}>กระทบยอดเพลท {pr.t} มม. (สต็อกแผ่นสำเร็จรูปต่อขนาดเสา)</div>
      <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>

            <td style={{ padding: '3px 8px', textAlign: 'right' }}><input type="number" value={row.close} onChange={e => row.onCloseChange(e.target.value)} style={inp(80, true)} disabled={READONLY} /></td>
          </tr>
        ))}</tbody>
      </table>
      {[
        ['น้ำหนักคงเหลือต้นงวด', pr.openWeightFmt + ' กก. (' + pr.openSheetsFmt + ' แผ่นใหญ่)'],
        ['น้ำหนักคงเหลือปลายงวด', pr.closeWeightFmt + ' กก. (' + pr.closeSheetsFmt + ' แผ่นใหญ่)'],
        ['คำนวณตามรายการผลิต', pr.plateCalcBigFmt + ' แผ่นใหญ่'],
        ['(A) คำนวณ − ยอดใช้จริง', pr.AFmt + ' แผ่นใหญ่'],
        ['(B) สต็อกปลาย − ต้นงวด', pr.BFmt + ' แผ่นใหญ่'],
        ['สรุป (A) + (B)', pr.sumABSheetsFmt + ' แผ่นใหญ่ (= ' + pr.sumABKgFmt + ' กก.)'],

      <div style={{ fontSize: 12, fontWeight: 700, color: '#8a6114', textTransform: 'uppercase', marginTop: 6 }}>ใช้งานอื่น-เสียหาย</div>
      {pr.generalUseEntries.map((e, i) => (
        <div key={i} style={{ display: 'flex', gap: 6, alignItems: 'center' }}>

          <input type="text" value={e.note} onChange={ev => e.onNoteChange(ev.target.value)} placeholder="สาเหตุ" style={{ ...inp(null), flex: 1 }} disabled={READONLY} />
          {!READONLY && <button onClick={e.onRemove} style={btnGhost('#c0392b')}>ลบ</button>}
        </div>

      {!READONLY && <button onClick={pr.onAddGeneralUseEntry} style={{ ...btnDashed(), alignSelf: 'flex-start' }}>+ เพิ่มสาเหตุ</button>}
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, borderTop: '1px solid #e0c07a', paddingTop: 8 }}><span>รวมใช้งานอื่น-เสียหาย</span><span style={{ fontWeight: 700 }}>{pr.generalUseSheetsFmt} แผ่นใหญ่ (= {pr.generalUseKgFmt} กก.)</span></div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderRadius: 8, padding: '12px 14px', background: '#fbeaea', border: '1px solid #e0a3a3' }}>

        <span style={{ fontSize: 17, fontWeight: 800, color: '#c0392b' }}>{pr.unexplainedSheetsFmt} แผ่นใหญ่ (= {pr.unexplainedKgFmt} กก.)</span>
      </div>
    </div>
  );
}
function DetailTable({ title, subtitle, rows, columns }) {
  if (!rows || !rows.length) return null;

    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>

              {columns.map(c => <td key={c.key} style={{ padding: '9px 14px', fontSize: c.key === 'spec' ? 13 : 14, color: c.key === 'spec' ? '#78839A' : 'inherit', textAlign: c.right ? 'right' : 'left' }}>{row[c.key]}</td>)}

// ============================================================
// คิวผลิต & ความยาวเสาเข็มรวม — แยกตามขนาดเสา
//   ความยาวรวม = ความยาวเสา × จำนวนต้น
//   คิว (m³)   = พื้นที่หน้าตัด (ตร.ม.) × ความยาวรวม
// พื้นที่หน้าตัดกรอกเองต่อขนาด (ระบบไม่เดาให้ เพราะหน้าตัด I/S ไม่ใช่วงกลม)
// ============================================================
function VolumeView({ app }) {
  const mod = app._mod;
  const saved = app.state.result;
  // ผลลัพธ์ที่บันทึกไว้ก่อนหน้านี้ยังไม่มีส่วนสรุปเสา — คำนวณใหม่จากรายการดิบให้เอง
  const r = React.useMemo(() => {
    // คำนวณใหม่จากรายการดิบก่อนเสมอถ้ามี (ให้ได้ผลตามตรรกะคำนวณล่าสุดเช่นแยกท่อนเดียว/ท่อนต่อเชื่อม)
    // ผลบันทึกเก่า (saved) ใช้เป็นสำรองกรณีไม่มีรายการดิบเก็บไว้ (งวดเก่าก่อนมี rawRows)
    if (mod && app.state.rawRows && app.state.rawRows.length) {
      try { return mod.calcPileList(app.state.rawRows, app.currentConfig()); } catch (e) { return saved; }
    }
    if (saved && saved.piles && saved.piles.length) return saved;
    return saved;
  }, [saved, mod, app.state.rawRows]);

  if (!r || !r.piles || !r.piles.length) {
    return <div style={{ padding: 24, color: '#78839A' }}>ยังไม่มีข้อมูล — อัปโหลดไฟล์รายการเสาก่อน</div>;
  }
  const dl = mod ? mod.diamLabel : (x => x);
  const areas = app.state.pileAreaM2 || {};
  const [openDiam, setOpenDiam] = React.useState(null);

  // รวมตามขนาดเสา
  const byDiam = {};
  r.piles.forEach(p => {
    if (!byDiam[p.diam]) byDiam[p.diam] = { diam: p.diam, qty: 0, totalLength: 0, rows: [] };
    byDiam[p.diam].qty += p.qty;
    byDiam[p.diam].totalLength += p.totalLength;
    byDiam[p.diam].rows.push(p);
  });
  const groups = Object.values(byDiam).sort((a, b) => String(a.diam).localeCompare(String(b.diam), 'th'));
  const volOf = g => { const a = Number(areas[g.diam]); return (a > 0) ? a * g.totalLength : null; };

  const sumQty = groups.reduce((s, g) => s + g.qty, 0);
  const sumLen = groups.reduce((s, g) => s + g.totalLength, 0);
  const volList = groups.map(volOf);
  const sumVol = volList.some(v => v != null) ? volList.reduce((s, v) => s + (v || 0), 0) : null;
  const missing = groups.filter(g => volOf(g) == null).length;

  // คิดหิน/ทราย/ปูนจากคิว × สูตรคอนกรีต (กก./ม³) — ตั้งค่าได้ที่ปุ่มตั้งค่าคงที่ → แท็บหน้าตัดเสา
  // หิน 3/4" และหิน 1" ใช้อัตราเดียวกับทุกขนาดเสา ส่วนปูน/ทรายมีสูตรพิเศษ (cementAlt/sandAlt)
  // เฉพาะ I-18/S-18 "ท่อนเดียว" เท่านั้น — ท่อนต่อเชื่อมและขนาดอื่นใช้สูตรปกติเหมือนกันหมด
  const mix = app.state.concreteMix || {};
  const mixSet = mix.rock34 > 0 && mix.rock1 > 0 && mix.sand > 0;
  const cementSet = mix.cement > 0;
  const tonsOf = (v, kgPerM3) => (v != null && kgPerM3 > 0) ? v * kgPerM3 / 1000 : null;
  const sumRock34 = tonsOf(sumVol, mix.rock34), sumRock1 = tonsOf(sumVol, mix.rock1);

  // ขนาดเสาที่มีสูตรพิเศษ (I-18 / S-18 ทุกแบบ มอก./โรงงาน) — ใช้ altVal แทนค่าปกติ เฉพาะท่อนเดียว
  const ALT_MIX_DIAMS = new Set(['อ18', 'อม18', 'อสม18']);
  const rateFor = (diam, isWelded, mainVal, altVal) =>
    (ALT_MIX_DIAMS.has(diam) && !isWelded && altVal > 0) ? altVal : mainVal;
  const cementRateFor = (diam, isWelded) => rateFor(diam, isWelded, mix.cement, mix.cementAlt);
  const sandRateFor = (diam, isWelded) => rateFor(diam, isWelded, mix.sand, mix.sandAlt);
  // ปูน/ทรายต้องคิดแยกทีละแถวความยาว×ท่อนเดียว/ต่อเชื่อม เพราะแต่ละแถวอาจใช้อัตราไม่เท่ากัน (หินไม่ต้องแยก เพราะอัตราเท่ากันทุกกรณี)
  const materialOf = (g, rateForFn, isSet) => {
    const a = Number(areas[g.diam]);
    if (!(a > 0) || !isSet) return null;
    return g.rows.reduce((sum, p) => sum + (tonsOf(a * p.totalLength, rateForFn(g.diam, p.isWelded)) || 0), 0);
  };
  const cementOf = g => materialOf(g, cementRateFor, cementSet);
  const sandOf = g => materialOf(g, sandRateFor, mix.sand > 0);
  const cementList = groups.map(cementOf);
  const sandList = groups.map(sandOf);
  const sumCement = cementList.some(v => v != null) ? cementList.reduce((s, v) => s + (v || 0), 0) : null;
  const sumSand = sandList.some(v => v != null) ? sandList.reduce((s, v) => s + (v || 0), 0) : null;

  const thS = { padding: '10px 12px', textAlign: 'right', fontWeight: 700, color: '#42465a', borderBottom: '2px solid #e2e5ee', whiteSpace: 'nowrap', fontSize: 13 };
  const tdS = { padding: '9px 12px', textAlign: 'right', whiteSpace: 'nowrap', fontSize: 14 };
  const fmtKg = tons => tons == null ? null : fmt(tons * 1000, 0) + ' กก.';

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
      <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap' }}>
        <div style={kpi()}><div style={kpiLbl()}>จำนวนเสาเข็มรวม</div><div style={kpiVal()}>{fmt(sumQty, 0)} ต้น</div></div>
        <div style={kpi()}><div style={kpiLbl()}>ความยาวรวมทั้งหมด</div><div style={kpiVal()}>{fmt(sumLen, 2)} ม.</div></div>
        <div style={kpi()}><div style={kpiLbl()}>คิวผลิตรวม</div>
          <div style={{ ...kpiVal(), color: sumVol == null ? '#c0392b' : '#2f5fd0' }}>{sumVol == null ? 'ยังใส่หน้าตัดไม่ครบ' : fmt(sumVol, 2) + ' m³'}</div>
        </div>
        <div style={kpi()}><div style={kpiLbl()}>หิน 3/4" รวม</div>
          <div style={{ ...kpiVal(), color: sumRock34 == null ? '#c0392b' : '#42465a' }}>{sumRock34 == null ? '–' : fmt(sumRock34, 2) + ' ตัน'}</div>
          {sumRock34 != null && <div style={{ fontSize: 12, color: '#94a3b8', marginTop: 2 }}>{fmtKg(sumRock34)}</div>}
        </div>
        <div style={kpi()}><div style={kpiLbl()}>หิน 1" รวม</div>
          <div style={{ ...kpiVal(), color: sumRock1 == null ? '#c0392b' : '#42465a' }}>{sumRock1 == null ? '–' : fmt(sumRock1, 2) + ' ตัน'}</div>
          {sumRock1 != null && <div style={{ fontSize: 12, color: '#94a3b8', marginTop: 2 }}>{fmtKg(sumRock1)}</div>}
        </div>
        <div style={kpi()}><div style={kpiLbl()}>ทรายรวม</div>
          <div style={{ ...kpiVal(), color: sumSand == null ? '#c0392b' : '#42465a' }}>{sumSand == null ? '–' : fmt(sumSand, 2) + ' ตัน'}</div>
          {sumSand != null && <div style={{ fontSize: 12, color: '#94a3b8', marginTop: 2 }}>{fmtKg(sumSand)}</div>}
        </div>
        <div style={kpi()}><div style={kpiLbl()}>ปูนรวม</div>
          <div style={{ ...kpiVal(), color: sumCement == null ? '#c0392b' : '#42465a' }}>{sumCement == null ? '–' : fmt(sumCement, 2) + ' ตัน'}</div>
          {sumCement != null && <div style={{ fontSize: 12, color: '#94a3b8', marginTop: 2 }}>{fmtKg(sumCement)}</div>}
        </div>
      </div>

      {missing > 0 && (
        <div style={{ padding: '11px 15px', background: '#fffbeb', border: '1px solid #fde68a', borderRadius: 10, fontSize: 13.5, color: '#92400e', lineHeight: 1.7 }}>
          ⚠️ ยังไม่ได้ตั้งค่าพื้นที่หน้าตัดของ {missing} ขนาด — ช่องคิวจะขึ้น “–” จนกว่าจะตั้งค่า
          <br />ตั้งได้ที่ปุ่ม <b>ตั้งค่าคงที่ (แก้ไขค่าน้ำหนัก)</b> ด้านบน → แท็บ <b>หน้าตัดเสา</b> — กรอกครั้งเดียวใช้ได้ทุกงวด
        </div>
      )}
      {!mixSet && (
        <div style={{ padding: '11px 15px', background: '#fffbeb', border: '1px solid #fde68a', borderRadius: 10, fontSize: 13.5, color: '#92400e', lineHeight: 1.7 }}>
          ⚠️ ยังไม่ได้ตั้งค่าสูตรคอนกรีต — ช่องหิน/ทรายจะขึ้น “–” จนกว่าจะตั้งค่า
          <br />ตั้งได้ที่ปุ่ม <b>ตั้งค่าคงที่ (แก้ไขค่าน้ำหนัก)</b> ด้านบน → แท็บ <b>หน้าตัดเสา</b> → ส่วน <b>สูตรคอนกรีต</b>
        </div>
      )}
      {!cementSet && (
        <div style={{ padding: '11px 15px', background: '#fffbeb', border: '1px solid #fde68a', borderRadius: 10, fontSize: 13.5, color: '#92400e', lineHeight: 1.7 }}>
          ⚠️ ยังไม่ได้ตั้งค่าปูน (กก./ม³) — ช่องปูนจะขึ้น “–” จนกว่าจะตั้งค่า
          <br />ตั้งได้ที่ปุ่ม <b>ตั้งค่าคงที่ (แก้ไขค่าน้ำหนัก)</b> ด้านบน → แท็บ <b>หน้าตัดเสา</b> → ส่วน <b>สูตรคอนกรีต</b>
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        <div style={{ fontSize: 18, fontWeight: 700 }}>สรุปตามขนาดเสา</div>
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', background: 'white', border: '1px solid #e3e7ee', borderRadius: 10, overflow: 'hidden' }}>
            <thead>
              <tr style={{ background: '#f4f6f9' }}>
                <th style={{ ...thS, textAlign: 'left' }}>ขนาดเสา</th>
                <th style={thS}>จำนวน (ต้น)</th>
                <th style={thS}>ความยาวรวม (ม.)</th>
                <th style={thS}>หน้าตัด (ตร.ม./ต้น)</th>
                <th style={thS}>คิว (m³)</th>
                <th style={thS}>% ของคิวรวม</th>
                <th style={thS}>หิน 3/4" (ตัน)</th>
                <th style={thS}>หิน 1" (ตัน)</th>
                <th style={thS}>ทราย (ตัน)</th>
                <th style={thS}>ปูน (ตัน)</th>
              </tr>
            </thead>
            <tbody>
              {groups.map(g => {

                      <td style={{ ...tdS, textAlign: 'left', fontWeight: 700 }}>{open ? '▲' : '▼'} {dl(g.diam)}</td>

                      <td style={tdS}>{fmt(g.totalLength, 2)}</td>
                      <td style={{ ...tdS, color: areas[g.diam] > 0 ? '#42465a' : '#c0392b' }}>
                        {areas[g.diam] > 0 ? fmt(areas[g.diam], 4) : 'ยังไม่ตั้งค่า'}
                      </td>
                      <td style={{ ...tdS, fontWeight: 700, color: v == null ? '#b6bcc8' : '#2f5fd0' }}>{v == null ? '–' : fmt(v, 2)}</td>
                      <td style={tdS}>{(v != null && sumVol) ? fmt(v / sumVol * 100, 1) + '%' : '–'}</td>
                      <td style={{ ...tdS, color: '#5f6470' }}>
                        {tonsOf(v, mix.rock34) == null ? '–' : fmt(tonsOf(v, mix.rock34), 2)}
                        {tonsOf(v, mix.rock34) != null && <div style={{ fontSize: 10.5, color: '#b6bcc8' }}>{fmtKg(tonsOf(v, mix.rock34))}</div>}
                      </td>
                      <td style={{ ...tdS, color: '#5f6470' }}>
                        {tonsOf(v, mix.rock1) == null ? '–' : fmt(tonsOf(v, mix.rock1), 2)}
                        {tonsOf(v, mix.rock1) != null && <div style={{ fontSize: 10.5, color: '#b6bcc8' }}>{fmtKg(tonsOf(v, mix.rock1))}</div>}
                      </td>
                      <td style={{ ...tdS, color: '#5f6470' }}>
                        {gSand == null ? '–' : fmt(gSand, 2)}
                        {gSand != null && <div style={{ fontSize: 10.5, color: '#b6bcc8' }}>{fmtKg(gSand)}</div>}
                      </td>
                      <td style={{ ...tdS, color: '#5f6470' }}>
                        {gCement == null ? '–' : fmt(gCement, 2)}
                        {gCement != null && <div style={{ fontSize: 10.5, color: '#b6bcc8' }}>{fmtKg(gCement)}</div>}
                      </td>
                    </tr>
                    {open && g.rows.slice().sort((a, b) => a.length - b.length || (a.isWelded ? 1 : 0) - (b.isWelded ? 1 : 0)).map(p => {
                      const a = Number(areas[g.diam]);
                      const pv = a > 0 ? a * p.totalLength : null;
                      const isAltDiam = ALT_MIX_DIAMS.has(g.diam) && !p.isWelded;
                      const pCementRate = cementRateFor(g.diam, p.isWelded);
                      const pSandRate = sandRateFor(g.diam, p.isWelded);
                      const isAltCement = isAltDiam && mix.cementAlt > 0;
                      const isAltSand = isAltDiam && mix.sandAlt > 0;
                      return (
                        <tr key={p.length + '_' + (p.isWelded ? 'w' : 's')} style={{ borderTop: '1px solid #f4f6fa', background: '#fafbfd' }}>
                          <td style={{ ...tdS, textAlign: 'left', paddingLeft: 40, color: '#5f6470' }}>
                            ยาว {fmt(p.length, 2)} ม. <span style={{ fontSize: 11.5, color: p.isWelded ? '#8a6d1f' : '#2f5fd0' }}>· {p.isWelded ? 'ท่อนต่อเชื่อม' : 'ท่อนเดียว'}</span>
                          </td>
                          <td style={{ ...tdS, color: '#5f6470' }}>{fmt(p.qty, 0)}</td>
                          <td style={{ ...tdS, color: '#5f6470' }}>{fmt(p.totalLength, 2)}</td>
                          <td style={{ ...tdS, color: '#b6bcc8' }}>—</td>
                          <td style={{ ...tdS, color: '#5f6470' }}>{pv == null ? '–' : fmt(pv, 2)}</td>
                          <td style={{ ...tdS, color: '#5f6470' }}>{(pv != null && sumVol) ? fmt(pv / sumVol * 100, 1) + '%' : '–'}</td>
                          <td style={{ ...tdS, color: '#b6bcc8' }}>{tonsOf(pv, mix.rock34) == null ? '–' : fmt(tonsOf(pv, mix.rock34), 2)}</td>
