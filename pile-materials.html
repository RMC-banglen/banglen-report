          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 10 }}><b>น้ำหนักลวดปลอกต่อเสา 1 ต้น (กก.) ตามขนาด/ความยาวเสา</b>{lockBtn('stirrup')}</div>
            <div style={{ opacity: s.locks.stirrup ? 0.5 : 1, pointerEvents: s.locks.stirrup ? 'none' : 'auto', display: 'flex', flexDirection: 'column', gap: 12 }}>
              {groupDiam(Object.entries(s.stirrupTable || {})).map((g, gi) => (
                <div key={gi} style={{ border: '1px solid #dce7ea', borderRadius: 10, padding: 14, background: g.bg }}>
                  <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 10, color: g.color }}>{g.title}</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 10, maxHeight: 420, overflowY: 'auto', paddingRight: 4 }}>
                    {g.rows.map(([diam, lenMap]) => (
                      <div key={diam} style={{ borderTop: '1px solid ' + g.lineColor, paddingTop: 10 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                          <span style={{ fontWeight: 600, fontSize: 13, color: g.color }}>{dl(diam)}</span>
                          <span style={{ fontSize: 11, color: '#78839A' }}>ขนาดลวด</span>
                          <select value={(s.stirrupWireMm || {})[diam] || ''} onChange={e => app.updateStirrupWireMm(diam, e.target.value)} style={inp(110)}>
                            <option value="">— เลือก —</option><option value="2.8">2.8 มม.</option><option value="3.0">3.0 มม.</option><option value="4.0">4.0 มม.</option>
                          </select>
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(110px,1fr))', gap: 8 }}>
                          {Object.entries(lenMap || {}).sort((a, b) => Number(a[0]) - Number(b[0])).map(([len, v]) => (
                            <div key={len} style={{ background: 'white', border: '1px solid #e3e7ee', borderRadius: 6, padding: 6 }}>
                              <div style={{ fontSize: 11, color: '#78839A', display: 'flex', alignItems: 'center', gap: 4, marginBottom: 4 }}>
                                <span>ยาว</span>
                                <span>{len}</span>
                                <span>ม.</span>
                                <span onClick={() => app.removeStirrupLength(diam, len)} style={{ marginLeft: 'auto', color: '#c0392b', cursor: 'pointer', border: '1px solid #e3e7ee', borderRadius: 4, padding: '1px 6px' }}>ลบ</span>
                              </div>
                              <input type="number" step="0.001" value={v ?? ''} onChange={e => app.updateStirrup(diam, len, e.target.value)} placeholder="น้ำหนัก กก." style={{ ...inp(null), width: '100%' }} />
                            </div>
                          ))}
                        </div>
                        <button onClick={() => { const len = window.prompt('ความยาว (ม.) ที่จะเพิ่มสำหรับ ' + dl(diam) + ' ?'); if (len) app.addStirrupLength(diam, len); }} style={{ ...btnGhost(), fontSize: 12, marginTop: 8, background: 'white' }}>+ เพิ่มความยาว</button>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
        {s.settingsTab === 'area' && (
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 10 }}><b>พื้นที่หน้าตัดเสาแต่ละขนาด (ตร.ม.)</b>{lockBtn('area')}</div>
            <div style={{ fontSize: 12.5, color: '#78839A', marginBottom: 10, lineHeight: 1.7 }}>
              ใช้คำนวณคิวผลิตในแท็บ “คิวผลิต & ความยาว” — คิว = พื้นที่หน้าตัด × ความยาวรวม<br />
              กรอกครั้งเดียว ระบบจำไว้ใช้ทุกงวด
            </div>
            <div style={{ opacity: s.locks.area ? 0.5 : 1, pointerEvents: s.locks.area ? 'none' : 'auto', display: 'flex', flexDirection: 'column', gap: 10 }}>
              {groupBy(app.allPileDiams().map(k => ({ key: k, value: (s.pileAreaM2 || {})[k], isMok: mok(k) }))).map((g, i) => (
                <div key={i} style={{ border: '1px solid #dce7ea', borderRadius: 8, padding: 12, background: g.bg }}>
                  <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8, color: g.color }}>{g.title}</div>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(150px,1fr))', gap: 10 }}>
                    {g.rows.map(row => (
                      <div key={row.key} style={{ background: 'white', border: '1px solid #e3e7ee', borderRadius: 6, padding: 8 }}>
                        <div style={{ fontSize: 12, color: '#78839A' }}>{dl(row.key)}</div>
                        <input type="number" step="0.0001" min="0" placeholder="ตร.ม." value={row.value ?? ''}
                          onChange={e => app.updatePileArea(row.key, e.target.value)} style={{ ...inp(null), width: '100%' }} />
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
            <div style={{ marginTop: 20, paddingTop: 16, borderTop: '1px solid #e3e7ee' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <b>สูตรคอนกรีต (กก./ม³)</b>{lockBtn('concreteMix')}
              </div>
              <div style={{ fontSize: 12.5, color: '#78839A', margin: '6px 0 10px', lineHeight: 1.7 }}>
                ใช้คิดปริมาณหิน/ทราย/ปูนจากคิวผลิตในแท็บ “คิวผลิต & ความยาว” — ค่าเริ่มต้นตามสูตรมาตรฐานของโรงงาน
              </div>
              <div style={{ opacity: s.locks.concreteMix ? 0.5 : 1, pointerEvents: s.locks.concreteMix ? 'none' : 'auto' }}>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(150px,1fr))', gap: 10 }}>
                {[['cement', 'ปูน'], ['rock34', 'หิน 3/4"'], ['rock1', 'หิน 1"'], ['sand', 'ทราย']].map(([key, label]) => (
                  <div key={key} style={{ background: 'white', border: '1px solid #e3e7ee', borderRadius: 6, padding: 8 }}>
                    <div style={{ fontSize: 12, color: '#78839A' }}>{label}</div>
                    <input type="number" step="1" min="0" placeholder="กก./ม³" value={(s.concreteMix || {})[key] ?? ''}
                      onChange={e => app.updateConcreteMix(key, e.target.value)} style={{ ...inp(null), width: '100%' }} />
                  </div>
                ))}
              </div>
              <div style={{ marginTop: 16, padding: 12, background: '#fbf8ee', border: '1px solid #ece0b8', borderRadius: 8 }}>
                <b style={{ fontSize: 13 }}>สูตรพิเศษ — I-18 / S-18 “ท่อนเดียว” เท่านั้น</b>
                <div style={{ fontSize: 12.5, color: '#8a6d1f', margin: '6px 0 10px', lineHeight: 1.7 }}>
                  ใช้แทนค่าปูน/ทรายด้านบน เฉพาะเสาขนาด I-18 หรือ S-18 ที่เป็นท่อนเดียว (ไม่ใช่ท่อนต่อเชื่อม) — ถ้าเป็นท่อนต่อเชื่อมยังใช้สูตรปกติเหมือนขนาดอื่น ส่วนหิน 3/4" และหิน 1" ใช้อัตราเดียวกับสูตรปกติทุกกรณี
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(150px,1fr))', gap: 10 }}>
                  {[['cementAlt', 'ปูน (I-18/S-18 ท่อนเดียว)'], ['sandAlt', 'ทราย (I-18/S-18 ท่อนเดียว)']].map(([key, label]) => (
                    <div key={key}>
                      <div style={{ fontSize: 12, color: '#78839A' }}>{label}</div>
                      <input type="number" step="1" min="0" placeholder="กก./ม³" value={(s.concreteMix || {})[key] ?? ''}
                        onChange={e => app.updateConcreteMix(key, e.target.value)} style={{ ...inp(null), width: '100%' }} />
                    </div>
                  ))}
                </div>
              </div>
              </div>
            </div>
          </div>
        )}
        {s.settingsTab === 'alert' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 8, background: '#f4f6f9' }}>
              <span style={{ fontSize: 13 }}>แจ้งเตือนเมื่อ % ผิดพลาดเกิน:</span>
              <input type="number" value={s.alertThresholdPct} onChange={e => app.setAlertThreshold(e.target.value)} style={inp(70, true)} />
              <span style={{ fontSize: 13, color: '#78839A' }}>%</span>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(180px,1fr))', gap: 8, padding: 12, borderRadius: 8, background: '#f4f6f9' }}>
              {CATS.map(c => (
                <div key={c.key} style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 13, width: 80 }}>{c.label}</span>
                  <input type="number" value={s.alertThresholdByCategory[c.key] ?? ''} onChange={e => app.setAlertThresholdCategory(c.key, e.target.value)} placeholder={String(s.alertThresholdPct)} style={inp(64, true)} />
                  <span style={{ fontSize: 12, color: '#78839A' }}>%</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
const card = () => ({ border: '1px solid #e3e7ee', borderRadius: 10, padding: 24, background: 'white' });
const kpi = () => ({ flex: 1, minWidth: 160, border: '1px solid #e3e7ee', borderRadius: 10, padding: '16px 20px', background: 'white' });
const kpiLbl = () => ({ fontSize: 13, color: '#78839A' });
const kpiVal = () => ({ fontSize: 24, fontWeight: 700 });

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
