  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ceholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:60;background:#EBF1F8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;overflow:auto\">\n    <div style=\"display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center\">\n      <div style=\"font-size:18px;font-weight:700\">ติดตามรายการคำนวณเสาเข็ม<\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#5E5C56\">เข้าสู่ระบบด้วยผู้ใช้เดียวกับแดชบอร์ด RMC<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ loginPicking }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:640px\">\n        <sc-for list=\"{{ loginUsers }}\" as=\"u\" hint-placeholder-count=\"0\">\n          <button sc-camel-on-click=\"{{ u.onPick }}\" style=\"min-width:120px;padding:16px 20px;border:1px solid #CFDAE8;border-radius:12px;background:#FFFFFF;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center\">\n            <span style=\"font-size:14.5px;font-weight:700;color:#1C1B19\">{{ u.name }}<\u002Fspan>\n            <span style=\"font-size:12px;color:#5E5C56\">{{ u.sub }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ loginName }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#FFFFFF;border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;align-items:center;width:min(320px,100%)\">\n        <div style=\"display:flex;flex-direction:column;gap:2px;align-items:center\"><div style=\"font-size:17px;font-weight:700\">{{ loginName }}<\u002Fdiv><div style=\"font-size:13px;color:#5E5C56\">กรอก PIN 4 หลัก<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:10px\"><sc-for list=\"{{ pinDots }}\" as=\"d\" hint-placeholder-count=\"4\"><div style=\"width:14px;height:14px;border-radius:50%;background:{{ d.bg }}\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n        <sc-if value=\"{{ hasPinErr }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:13.5px;font-weight:600;color:#B3261E\">{{ pinErr }}<\u002Fdiv><\u002Fsc-if>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%\">\n          <sc-for list=\"{{ pinKeys }}\" as=\"k\" hint-placeholder-count=\"12\"><button sc-camel-on-click=\"{{ k.onPress }}\" style=\"height:56px;border:1px solid #CFDAE8;border-radius:10px;background:#fff;font:inherit;font-size:20px;font-weight:600;color:#1C1B19;cursor:pointer;visibility:{{ k.vis }}\">{{ k.k }}<\u002Fbutton><\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onLoginBack }}\" style=\"border:0;background:transparent;font:inherit;font-size:13.5px;color:#5E5C56;cursor:pointer\">← เลือกผู้ใช้อื่น<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ noPerm }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;inset:0;z-index:60;background:#EBF1F8;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;color:#3A3935\">บัญชี {{ userLabel }} ยังไม่มีสิทธิ์ใช้หน้านี้ ติดต่อผู้ดูแลระบบ<\u002Fdiv>\n<\u002Fsc-if>\n<div class=\"pc-root\" style=\"min-height:100vh;display:flex;flex-direction:column\">\n  <div style=\"background:linear-gradient(120deg,#0B2545 0%,#13508A 58%,#0F766E 100%);color:#fff;box-shadow:0 4px 14px rgba(11,37,69,.25)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:14px 20px 0;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <div style=\"font-size:18px;font-weight:700;letter-spacing:.2px\">ติดตามรายการคำนวณเสาเข็ม<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#BCD3EC\">บริษัท ร่วมมิตรคอนกรีต (บางเลน) จำกัด · {{ todayLabel }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:#D9D5CB;margin-top:2px\">\n            <span style=\"width:8px;height:8px;border-radius:50%;background:{{ syncDot }}\"><\u002Fspan><span>{{ syncLabel }}<\u002Fspan>\n            <sc-if value=\"{{ hasUser }}\" hint-placeholder-val=\"{{ false }}\"><span>· ผู้ใช้: {{ userLabel }}<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ notRo }}\"><label style=\"display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;background:#E8590C;color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)\">\n          <span>แนบ PDF จาก สย. (เลือกได้หลายไฟล์)<\u002Fspan>\n          <input type=\"file\" accept=\"application/pdf\" multiple=\"{{ true }}\" sc-camel-on-change=\"{{ onQuickPdf }}\" style=\"display:none\">\n        <\u002Flabel><\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ ro }}\"><div style=\"padding:8px 12px;border-radius:8px;background:#3A3935;color:#FFE9A8;font-size:13.5px;font-weight:600\">👁 โหมดดูอย่างเดียว — บัญชีนี้ไม่มีสิทธิ์แก้ไขหน้านี้ (ขอสิทธิ์ได้จากผู้ดูแลระบบ)<\u002Fdiv><\u002Fsc-if>\n      <div style=\"display:flex;gap:4px;overflow-x:auto\">\n        <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"flex:none;display:flex;align-items:center;gap:8px;padding:10px 16px;border:0;border-radius:8px 8px 0 0;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;background:{{ t.bg }};color:{{ t.fg }}\">\n            <span>{{ t.label }}<\u002Fspan>\n            <sc-if value=\"{{ t.badge }}\"><span style=\"min-width:20px;padding:0 6px;border-radius:999px;background:#C2491D;color:#fff;font-size:12px;line-height:20px;text-align:center\">{{ t.badge }}<\u002Fspan><\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;width:100%;max-width:1200px;margin:0 auto;padding:24px 20px 60px;display:flex;flex-direction:column;gap:24px\">\n\n    <sc-if value=\"{{ hasSyncErr }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:12px 16px;border-radius:10px;background:#FDF3F2;border:1px solid #F0C4BF;color:#B3261E;font-size:14px\">{{ syncErr }}<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ hasLocalPending }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:10px;background:#FBF3E2;border:1px solid #EBD3A0;font-size:14px;color:#5C3D0A\">\n        <span>{{ localPendingText }}<\u002Fspan>\n        <div style=\"display:flex;gap:8px\">\n          <button sc-camel-on-click=\"{{ onDismissLocal }}\" style=\"padding:8px 14px;border:1px solid #CFCBC0;border-radius:8px;background:#fff;color:#1C1B19;font:inherit;font-size:14px;font-weight:600;cursor:pointer\">ไม่ต้อง<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onUploadLocal }}\" style=\"padding:8px 14px;border:0;border-radius:8px;background:#C2491D;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap\">อัปโหลดขึ้นระบบ<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isBusy }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);padding:12px 18px;border-radius:10px;background:#1C1B19;color:#fff;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.25)\">{{ busyText }}<\u002Fdiv><\u002Fsc-if>\n\n    <sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:24px\">\n        <div style=\"background:#FFFFFF;border:1px solid #CFDAE8;border-left:5px solid #13508A;border-radius:12px;overflow:hidden\">\n          <div style=\"padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #DEE7F2;background:linear-gradient(90deg,#E8F1FD,#FFFFFF)\">\n            <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n              <div style=\"font-size:17px;font-weight:700;color:#13508A\">⏳ งานที่ยังไม่จบ<\u002Fdiv>\n              <div style=\"font-size:14px;color:#5E5C56\">{{ openCount }} งาน · ขึ้นอยู่จนกว่าจะได้เอกสารตัวจริง · กดที่งานเพื่อดูรายละเอียด<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onShowActive }}\" style=\"padding:8px 14px;border:1px solid #B7D0F0;border-radius:8px;background:#E8F1FD;color:#13508A;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap\">ดูแบบรายการ<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ noOpen }}\"><div style=\"padding:22px 20px;color:#1E7B45;font-size:15px;font-weight:600\">✓ ไม่มีงานค้าง — ทุกงานได้เอกสารตัวจริงแล้ว<\u002Fdiv><\u002Fsc-if>\n          <sc-for list=\"{{ openRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ r.onOpen }}\" style=\"padding:14px 20px;display:grid;grid-template-columns:minmax(120px,160px) minmax(0,1fr) auto;gap:6px 16px;align-items:center;border-top:1px solid #EBF1F8;cursor:pointer\" style-hover=\"background:#F3F7FC\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;color:{{ r.codeColor }}\">{{ r.code }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                <div style=\"font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.project }}<\u002Fdiv>\n                <div style=\"font-size:13px;color:#5E5C56;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:3px\">\n                <span style=\"display:inline-flex;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:{{ r.stBg }};color:{{ r.stColor }}\">{{ r.stLabel }}<\u002Fspan>\n                <div style=\"font-size:12.5px;color:{{ r.ageColor }}\">{{ r.age }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:#FFFFFF;border:1px solid #CFDAE8;border-left:5px solid #C0392B;border-radius:12px;overflow:hidden\">\n          <div style=\"padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #F3D5D1;background:linear-gradient(90deg,#FDEEEC,#FFFFFF)\">\n            <div style=\"display:flex;align-items:baseline;gap:10px\">\n              <div style=\"font-size:17px;font-weight:700;color:#B3261E\">⏰ ต้องตาม<\u002Fdiv>\n              <div style=\"font-size:14px;color:#5E5C56\">{{ overdueCount }} รายการเกินกำหนด<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <button sc-camel-on-click=\"{{ onMsgFactory }}\" style=\"padding:8px 14px;border:1px solid #F2C9A8;border-radius:8px;background:#FFF1E6;color:#9A3F06;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap\">ข้อความเตือนโรงงาน<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onMsgEngineer }}\" style=\"padding:8px 14px;border:1px solid #B7D0F0;border-radius:8px;background:#E8F1FD;color:#13508A;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap\">ข้อความตาม สย.<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ noOverdue }}\"><div style=\"padding:28px 20px;color:#1E7B45;font-size:15px;font-weight:600\">✓ ไม่มีงานค้างเกินกำหนด<\u002Fdiv><\u002Fsc-if>\n          <sc-for list=\"{{ overdueRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ r.onOpen }}\" style=\"padding:14px 20px;display:grid;grid-template-columns:minmax(120px,150px) minmax(0,1fr) auto;gap:6px 16px;align-items:center;border-top:1px solid #EBF1F8;cursor:pointer\" style-hover=\"background:#F3F1EC\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600;color:{{ r.codeColor }}\">{{ r.code }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0\">\n                <div style=\"font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.project }}<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#B3261E;font-weight:500\">{{ r.reason }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:2px\">\n                <div style=\"font-size:15px;font-weight:700;color:#B3261E\">{{ r.days }} วัน<\u002Fdiv>\n                <div style=\"font-size:12px;color:#5E5C56\">รอ{{ r.who }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-size:17px;font-weight:700;border-left:5px solid #13508A;padding-left:10px\">สถานะงานทั้งหมด<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px\">\n            <sc-for list=\"{{ statusCards }}\" as=\"s\" hint-placeholder-count=\"8\">\n              <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"text-align:left;padding:14px 16px;border:1px solid {{ s.color }}33;border-radius:10px;background:{{ s.color }}12;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:8px;border-top:4px solid {{ s.color }}\" style-hover=\"background:{{ s.color }}26\">\n                <div style=\"font-size:30px;font-weight:700;line-height:1;color:{{ s.color }}\">{{ s.count }}<\u002Fdiv>\n                <div style=\"font-size:13.5px;font-weight:500;color:#1C1B19\">{{ s.label }}<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isList }}\">\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n          <input value=\"{{ q }}\" sc-camel-on-change=\"{{ onQ }}\" placeholder=\"ค้นหา รหัส / โครงการ / เจ้าของ\" style=\"flex:1 1 260px;padding:10px 12px;border:1px solid #CFCBC0;border-radius:8px;font:inherit;font-size:15px;background:#fff;color:#1C1B19\">\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n          <sc-for list=\"{{ filterChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"padding:6px 12px;border-radius:999px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }}\">{{ c.label }} · {{ c.count }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;border:1px solid #CFDAE8;border-radius:12px;overflow:hidden\">\n          <sc-if value=\"{{ noRows }}\"><div style=\"padding:28px 20px;color:#5E5C56\">ไม่พบรายการ<\u002Fdiv><\u002Fsc-if>\n          <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ r.onOpen }}\" style=\"padding:14px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 18px;align-items:center;border-top:1px solid #EBF1F8;cursor:pointer\" style-hover=\"background:#F3F1EC\">\n              <div style=\"display:flex;flex-direction:column;gap:3px;min-width:0\">\n                <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:{{ r.codeColor }}\">{{ r.code }}<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:600;text-wrap:pretty\">{{ r.project }}<\u002Fdiv>\n                <div style=\"font-size:13px;color:#5E5C56\">{{ r.owner }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#3A3935;text-wrap:pretty;white-space:pre-line\">{{ r.summary }}<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap\">\n                <span style=\"display:inline-flex;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:{{ r.stBg }};color:{{ r.stColor }}\">{{ r.stLabel }}<\u002Fspan>\n                <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:1px\">\n                  <div style=\"font-size:12.5px;color:#5E5C56\">{{ r.since }}<\u002Fdiv>\n                  <sc-if value=\"{{ r.late }}\"><div style=\"font-size:12.5px;font-weight:600;color:#B3261E\">{{ r.late }}<\u002Fdiv><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isNew }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start\">\n        <div style=\"background:#FFFFFF;border:1px solid #CFDAE8;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-size:17px;font-weight:700\">วางข้อความจากไลน์<\u002Fdiv>\n          <div style=\"font-size:13.5px;color:#5E5C56\">ระบบจะแยกชื่อโครงการ เจ้าของ สถานที่ และรายการเสาให้ ตรวจแล้วแก้ในฟอร์มได้<\u002Fdiv>\n          <textarea value=\"{{ lineText }}\" sc-camel-on-change=\"{{ onLineText }}\" rows=\"11\" placeholder=\"{{ linePlaceholder }}\" style=\"width:100%;padding:12px;border:1px solid #CFCBC0;border-radius:8px;font:inherit;font-size:14.5px;line-height:1.55;background:#fff;color:#1C1B19;res
